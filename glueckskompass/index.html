  const gift=shared===b.id?`<div class="gift"><b>Jemand möchte dir dieses Häppchen zeigen.</b><span>Es stammt aus dem „Glückskompass“, einer kleinen, kostenlosen App mit Erkenntnissen aus der Glücksforschung, Begriffen zum Üben und Experimenten für den Alltag. Ohne Anmeldung, deine Daten bleiben auf deinem Gerät.</span><button class="btn accent" id="explore">Selbst ausprobieren</button></div>`:"";
  return gift+`<article class="card bite" ${cc(b.cat)}>
    <div class="meta"><span class="catn">${dot(b.cat)}${CATS[b.cat].n}</span>${evHTML(b.ev)}</div>
    <h2>${b.t}</h2>
    <p class="body">${b.x}</p>
    <p class="caveat"><b>Wie sicher?</b> ${b.c}</p>
    <div class="take"><b>Was heißt das für dich?</b>${b.tip}</div>
    <p class="src">Quelle: <a href="${esc(b.u)}" target="_blank" rel="noopener">${b.src} ↗</a></p>
    ${t||x?`<div class="links">${t?`<button class="chip" data-term="${t.id}">${dot(t.cat)}Begriff: ${t.n}</button>`:""}${x?`<button class="chip" data-exp="${x.id}">${dot(x.cat)}Experiment: ${x.t}</button>`:""}</div>`:""}
    <div class="row"><button class="btn primary" id="next">Nächstes Häppchen</button><button class="btn ghost" id="save" aria-pressed="${!!S.saved[b.id]}">${S.saved[b.id]?"Gemerkt ✓":"Merken"}</button><button class="btn ghost" id="share">Teilen</button><button class="linkbtn" id="back">Zum Kompass</button></div>
  </article>`;
}
function viewBites(){
  const nRead=Object.keys(S.read).length,p=pool(),unread=p.filter(b=>!S.read[b.id]).length;
  const filt=`<div class="chips" role="group" aria-label="Richtung wählen">${[["alle","Alle"],...Object.entries(CATS).map(([k,v])=>[k,v.n])].map(([k,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${k!=="alle"?dot(k):""}${n}</button>`).join("")}</div>`;
  if(S.cur&&B[S.cur])return `<section class="view">${biteCard(B[S.cur])}</section>`;
  const recent=S.history.filter(id=>B[id]).slice(0,4);
  return `<section class="view">
    <div class="hero">
      <button class="compass breath" id="go" aria-label="Neues Häppchen aufdecken"><span class="core"><span class="needle"></span><b>Häppchen</b><span>${unread?`${unread} noch neu`:"alle gelesen · Wiederholung"}</span></span></button>
      <p>${nRead?"Drück auf den Kompass für die nächste Erkenntnis.":"Drück auf den Kompass. Du bekommst eine Erkenntnis aus der Glücksforschung, mit Quelle und ehrlicher Einschätzung, wie sicher sie ist."}</p>
    </div>
    <div class="sec"><div class="label">Richtung</div>${filt}</div>
    <div class="sec"><div class="sec-h"><h3>Zuletzt gelesen</h3><span class="label">${nRead} von ${BITES.length}</span></div>
      ${recent.length?`<div class="list">${recent.map(id=>{const b=B[id];return `<button class="li" data-open="${id}">${dot(b.cat)}<span class="tx"><b>${b.t}</b><small>${b.src}</small></span><span class="aside">${fmtDate(S.read[id])}</span></button>`}).join("")}</div>`:`<p class="empty">Hier sammeln sich deine gelesenen Häppchen. Ein bis drei am Tag sind ein guter Rhythmus.</p>`}
    </div>
  </section>`;
}

/* ---------- Begriffe: Abfrage nach dem Karteikastenprinzip ---------- */
const IV=[0,1,3,7,16,35];
const box=id=>(S.terms[id]||{}).box||0;
const learned=()=>TERMS.filter(t=>box(t.id)>=4).length;
function dueTerms(){
  const seen=new Set(Object.keys(S.read).map(id=>B[id]&&B[id].term).filter(Boolean));
  return TERMS.filter(t=>{const s=S.terms[t.id];return s?s.next<=now()&&s.box<5:seen.has(t.id)}).sort((a,b)=>box(a.id)-box(b.id));
}
let Q=null;
function startQuiz(){
  let list=dueTerms();
  if(list.length<5){const fresh=TERMS.filter(t=>!S.terms[t.id]&&!list.includes(t));list=list.concat(fresh.sort(()=>Math.random()-.5).slice(0,6-list.length))}
  if(list.length<5){const rest=TERMS.filter(t=>!list.includes(t)).sort((a,b)=>((S.terms[a.id]||{}).next||0)-((S.terms[b.id]||{}).next||0));list=list.concat(rest.slice(0,6-list.length))}
  Q={items:list.slice(0,8).map(t=>({id:t.id,mode:Math.random()<.6?"def":"term"})),i:0,right:0,answered:null};render();
}
function quizCard(){
  if(Q.i>=Q.items.length){return `<article class="card quiz"><div class="label">Runde geschafft</div><h2>${Q.right} von ${Q.items.length} richtig</h2><p>Richtige Begriffe wandern ein Fach weiter und kommen später wieder. Falsche kommen bald noch einmal. So verankern sie sich Schritt für Schritt.</p><div class="row"><button class="btn primary" id="qagain">Noch eine Runde</button><button class="btn ghost" id="qend">Fertig</button></div></article>`}
  const it=Q.items[Q.i],t=T[it.id];
  if(!it.opts){const others=TERMS.filter(o=>o.id!==t.id).sort(()=>Math.random()-.5);const same=others.filter(o=>o.cat===t.cat).slice(0,2);const pick=[...same,...others.filter(o=>!same.includes(o))].slice(0,3);it.opts=[t,...pick].sort(()=>Math.random()-.5).map(o=>o.id)}
  const q=it.mode==="def"?`<p class="label">Welcher Begriff passt?</p><h2 style="font-family:var(--f-body);font-weight:500;font-size:19px;line-height:1.45">${t.d}</h2>`:`<p class="label">Was bedeutet</p><h2>${t.n}?</h2>`;
  const a=Q.answered;
  return `<article class="card quiz">
    <div class="qhead"><span class="label">Frage ${Q.i+1} von ${Q.items.length}</span><button class="linkbtn" id="qend">Abbrechen</button></div>
    ${q}
    <div class="opts">${it.opts.map(id=>{const o=T[id];let cls="opt";if(a){if(id===t.id)cls+=" right";else if(id===a)cls+=" wrong"}return `<button class="${cls}" data-ans="${id}" ${a?"disabled":""}>${it.mode==="def"?`<b style="font-family:var(--f-display)">${o.n}</b>`:o.d}</button>`}).join("")}</div>
    ${a?`<p class="fb ${a===t.id?"ok":"no"}">${a===t.id?"Richtig.":"Nicht ganz. Gemeint war: "+t.n+"."}</p><p class="muted" style="font-size:15px">Beispiel: ${t.e}</p><div class="row"><button class="btn primary" id="qnext">Weiter</button></div>`:""}
  </article>`;
}
function answer(id){
  const it=Q.items[Q.i],ok=id===it.id,s=S.terms[it.id]||{box:0,next:0};
  s.box=ok?Math.min(5,s.box+1):1;s.next=now()+IV[s.box]*DAY-(ok?0:DAY)+(ok?0:6e5);S.terms[it.id]=s;if(ok)Q.right++;Q.answered=id;save();render();const fb=document.querySelector('.fb');if(fb)fb.scrollIntoView({block:'center',behavior:'smooth'});
}
let openTerm=null;
function viewTerms(){
  const due=dueTerms().length,l=learned();
  let h=`<section class="view">
    <div class="card"><div class="sec-h"><h3>Im Kopf verankert</h3><span class="label">${l} von ${TERMS.length}</span></div>
      <div class="meter"><span style="width:${Math.round(l/TERMS.length*100)}%"></span></div>
      <p class="muted" style="font-size:15px">${due?`${due} Begriff${due>1?"e sind":" ist"} heute zur Wiederholung fällig.`:"Gerade ist nichts fällig. Du kannst trotzdem üben oder neue Begriffe kennenlernen."} Ein Begriff gilt als verankert, wenn du ihn viermal in wachsenden Abständen richtig hattest.</p>
      <div class="row"><button class="btn accent" id="quiz">${due?`Wiederholen (${Math.min(due,8)})`:"Üben"}</button></div>
    </div>`;
  if(Q)h+=quizCard();
  h+=`<div class="sec"><div class="label">Alle Begriffe</div>`;
  Object.entries(CATS).forEach(([k,c])=>{const ts=TERMS.filter(t=>t.cat===k);if(!ts.length)return;
    h+=`<h3 style="display:flex;gap:8px;align-items:center">${dot(k)}${c.n}</h3><div class="list">`+ts.map(t=>`<div><button class="li" data-tt="${t.id}" aria-expanded="${openTerm===t.id}"><span class="tx"><b>${t.n}</b></span><span class="boxes" ${cc(t.cat)}>${[1,2,3,4,5].map(i=>`<b class="${box(t.id)>=i?"on":""}"></b>`).join("")}</span></button>${openTerm===t.id?`<div class="term-def"><p>${t.d}</p><em>Beispiel: ${t.e}</em></div>`:""}</div>`).join("")+`</div>`});
  h+=`<p class="label" style="text-transform:none;letter-spacing:0">Die Balken zeigen das Fach im Karteikasten: von neu (leer) bis sicher verankert (fünf).</p></div></section>`;
  return h;
}

/* ---------- Experimente ---------- */
const MAXACT=3;
const activeExps=()=>Object.entries(S.exps).filter(([,v])=>v.status==="active").map(([id])=>id).filter(id=>X[id]);
function suggest(){
  const readCats={};Object.keys(S.read).forEach(id=>{const b=B[id];if(b)readCats[b.cat]=(readCats[b.cat]||0)+1});
  const linked=new Set(Object.keys(S.read).map(id=>B[id]&&B[id].exp).filter(Boolean));
  const free=EXPS.filter(e=>!S.exps[e.id]);
  if(!free.length)return null;
  const today=Math.floor(now()/DAY)+(S.skip||0);
  const pref=free.filter(e=>linked.has(e.id));
  const list=pref.length?pref:free;
  return list[today%list.length];
}
let expFilter="alle";
function expCard(e,mode){
  const v=S.exps[e.id];
  let extra="";
  if(mode==="active"){const total=e.d,el=Math.min(total,Math.floor((now()-v.start)/DAY)),left=Math.max(0,total-el);
    extra=`<div class="prog"><div class="meter"><span style="width:${Math.max(4,Math.round(el/total*100))}%;background:var(--c-${e.cat})"></span></div><span class="dur">${left?`Noch ${left} Tag${left>1?"e":""} · bis ${fmtDate(v.start+total*DAY)}`:"Zeit ist um. Wie lief es?"}</span></div>
    <div class="row"><button class="btn primary" data-done="${e.id}">Geschafft</button><button class="btn ghost" data-open-exp="${e.id}">Anleitung</button><button class="linkbtn" data-drop="${e.id}">Abbrechen</button></div>`}
  else extra=`<div class="row"><button class="btn accent" data-accept="${e.id}" ${activeExps().length>=MAXACT?"disabled":""}>Annehmen</button><button class="btn ghost" data-open-exp="${e.id}">Mehr dazu</button>${mode==="suggest"?`<button class="linkbtn" id="other">Anderer Vorschlag</button>`:""}</div>${activeExps().length>=MAXACT?`<p class="muted" style="font-size:14px">Du hast schon ${MAXACT} Experimente laufen. Schließ erst eins ab.</p>`:""}`;
  return `<article class="card exp" ${cc(e.cat)}><div class="meta"><span class="catn">${dot(e.cat)}${CATS[e.cat].n}</span><span>${e.d===1?"Heute":e.d+" Tage"}</span></div><h2>${e.t}</h2><p style="font-size:16px">${e.x}</p>${extra}</article>`;
}
function viewExps(){
  const act=activeExps(),sug=suggest();
  let h=`<section class="view">`;
  h+=`<div class="sec"><div class="sec-h"><h3>Läuft gerade</h3><span class="label">${act.length} von ${MAXACT}</span></div>${act.length?act.map(id=>expCard(X[id],"active")).join(""):`<p class="empty">Noch kein Experiment angenommen. Experimente sind kleine, befristete Versuche, dein Leben ein Stück umzubauen. Nichts davon muss perfekt gelingen.</p>`}</div>`;
  if(sug)h+=`<div class="sec"><h3>Vorschlag für dich</h3>${expCard(sug,"suggest")}</div>`;
  const chips=`<div class="chips">${[["alle","Alle"],...Object.entries(CATS).map(([k,v])=>[k,v.n])].map(([k,n])=>`<button class="chip" data-efilter="${k}" aria-pressed="${expFilter===k}">${k!=="alle"?dot(k):""}${n}</button>`).join("")}</div>`;
  const list=EXPS.filter(e=>expFilter==="alle"||e.cat===expFilter);
  h+=`<div class="sec"><h3>Alle Experimente</h3>${chips}<div class="list">${list.map(e=>{const v=S.exps[e.id];const st=v?(v.status==="active"?"läuft":v.status==="done"?"geschafft ✓":"abgebrochen"):(e.d===1?"heute":e.d+" Tage");return `<button class="li" data-open-exp="${e.id}">${dot(e.cat)}<span class="tx"><b>${e.t}</b></span><span class="aside">${st}</span></button>`}).join("")}</div></div>`;
  return h+`</section>`;
}
function sheet(html){const l=$("#layer");l.innerHTML=`<div class="sheet" id="sh"><div class="panel" role="dialog" aria-modal="true"><button class="close" id="shx">Schließen</button>${html}</div></div>`;
  $("#sh").addEventListener("click",e=>{if(e.target.id==="sh"||e.target.id==="shx")closeSheet()})}
function closeSheet(){$("#layer").innerHTML=""}
function expSheet(id){const e=X[id],v=S.exps[id],b=B[e.b];
  sheet(`<div class="meta"><span class="catn">${dot(e.cat)}${CATS[e.cat].n}</span><span>${e.d===1?"Heute":e.d+" Tage"}</span></div><h2>${e.t}</h2><p>${e.x}</p><h3>So gehst du vor</h3><ol class="steps">${e.s.map(s=>`<li>${s}</li>`).join("")}</ol>${b?`<div class="take"><b>Warum das?</b>${b.t}. <button class="linkbtn" data-open="${b.id}">Häppchen lesen</button></div>`:""}
  <div class="row">${!v||v.status==="dropped"?`<button class="btn accent" data-accept="${id}" ${activeExps().length>=MAXACT?"disabled":""}>Annehmen</button>`:v.status==="active"?`<button class="btn primary" data-done="${id}">Geschafft</button>`:`<span class="label">Geschafft am ${fmtDate(v.end)}</span><button class="btn ghost" data-accept="${id}" ${activeExps().length>=MAXACT?"disabled":""}>Noch einmal</button>`}</div>`)}
function doneSheet(id){const e=X[id];
  sheet(`<div class="label">Geschafft</div><h2>${e.t}</h2><p>Wie war es? Deine Antwort bleibt nur auf diesem Gerät und hilft dir später beim Zurückschauen.</p><div class="moods" id="moods">${[["gut","Hat mir gutgetan"],["mix","Gemischt"],["nein","Eher nicht"]].map(([k,n])=>`<button class="chip" data-mood="${k}" aria-pressed="false">${n}</button>`).join("")}</div><label class="label" for="note">Was nimmst du mit?</label><textarea id="note" placeholder="Ein, zwei Sätze reichen."></textarea><div class="row"><button class="btn primary" id="savedone" data-id="${id}">Speichern</button></div>`);
  $("#moods").addEventListener("click",ev=>{const c=ev.target.closest("[data-mood]");if(!c)return;$("#moods").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));});
}

/* ---------- Dein Weg ---------- */
let confirmReset=false;
function viewWay(){
  const nRead=Object.keys(S.read).length,done=Object.entries(S.exps).filter(([,v])=>v.status==="done");
  const score={};Object.keys(CATS).forEach(k=>score[k]=0);
  Object.keys(S.read).forEach(id=>{const b=B[id];if(b)score[b.cat]+=1});
  done.forEach(([id])=>{const e=X[id];if(e)score[e.cat]+=3});
  const mx=Math.max(1,...Object.values(score));
  const journal=done.filter(([,v])=>v.note||v.mood).sort((a,b)=>b[1].end-a[1].end);
  const saved=Object.keys(S.saved).filter(id=>B[id]);
  const moodN={gut:"Hat mir gutgetan",mix:"Gemischt",nein:"Eher nicht"};
  return `<section class="view">
    <div class="tiles"><div class="tile"><b>${nRead}</b><span>Häppchen gelesen</span></div><div class="tile"><b>${learned()}</b><span>Begriffe verankert</span></div><div class="tile"><b>${done.length}</b><span>Experimente geschafft</span></div></div>
    <div class="sec"><div class="sec-h"><h3>Deine Balance</h3><span class="label">Lesen 1 · Tun 3</span></div>
      <div class="bal">${Object.entries(CATS).map(([k,c])=>`<div class="balrow" ${cc(k)}><span>${c.n}</span><span class="bar"><span style="width:${Math.round(score[k]/mx*100)}%"></span></span><em>${score[k]}</em></div>`).join("")}</div>
      <p class="muted" style="font-size:15px">${nRead+done.length?balanceHint(score):"Sobald du liest und ausprobierst, zeigt sich hier, in welche Richtungen dein Leben gerade wächst."}</p></div>
    <div class="sec"><h3>Tagebuch der Experimente</h3>${journal.length?`<div class="journal">${journal.map(([id,v])=>`<div class="jr" ${cc(X[id].cat)}><b>${X[id].t}</b><small>${fmtDate(v.end)}${v.mood?" · "+moodN[v.mood]:""}</small>${v.note?`<p style="font-size:16px">${esc(v.note)}</p>`:""}</div>`).join("")}</div>`:`<p class="empty">Wenn du ein Experiment abschließt, kannst du festhalten, wie es war. Diese Notizen erscheinen hier.</p>`}</div>
    <div class="sec"><h3>Gemerkte Häppchen</h3>${saved.length?`<div class="list">${saved.map(id=>{const b=B[id];return `<button class="li" data-open="${id}">${dot(b.cat)}<span class="tx"><b>${b.t}</b><small>${b.src}</small></span></button>`}).join("")}</div>`:`<p class="empty">Tippe bei einem Häppchen auf „Merken“, um es hier wiederzufinden.</p>`}</div>
    <div class="sec about"><h3>Über diese App</h3>
      <p>Der Glückskompass zeigt, was die Forschung über ein gutes Leben weiß, und bringt es in kleinen Portionen in deinen Alltag. Die Haltung dahinter: Ein gutes Leben heißt, sich selbst gut zu behandeln, andere glücklich zu machen und die Welt intakt zu halten. Dazu gehört die Frage, wer wir sind, wenn wir uns weniger über Arbeit und Besitz definieren.</p>
      <p>Jedes Häppchen zeigt, wie belastbar die Erkenntnis ist:</p>
      <div class="legend">${[3,2,1,0].map(l=>`<div>${evHTML(l)} <span class="muted">· ${["Philosophie oder Zusammenschau, keine Studie","eine einzelne Studie oder nur Zusammenhänge","mehrere Studien, aber mit Grenzen","Meta-Analysen, große Längsschnitte oder randomisierte Studien"][l]}</span></div>`).join("")}</div>
      <p>Stand der Recherche: Oktober 2026. Die Quellen sind verlinkt, damit du selbst nachlesen kannst. Die App ersetzt keine Therapie. Wenn es dir schlecht geht, ist die Telefonseelsorge rund um die Uhr erreichbar: 0800 111 0 111.</p>
      <p class="muted" style="font-size:14px">Alles, was du hier liest, markierst und notierst, bleibt nur in diesem Browser auf diesem Gerät.</p>
      <div class="row"><button class="btn ghost" id="shareapp">App weiterempfehlen</button></div>
      <div class="row">${confirmReset?`<span>Wirklich alles löschen?</span><button class="btn primary" id="resetyes">Ja, löschen</button><button class="btn ghost" id="resetno">Abbrechen</button>`:`<button class="linkbtn" id="reset">Fortschritt zurücksetzen</button>`}</div>
    </div>
  </section>`;
}
function balanceHint(s){const e=Object.entries(s).sort((a,b)=>a[1]-b[1]);const low=e[0],high=e[e.length-1];if(high[1]-low[1]<3)return "Deine Richtungen sind gerade ziemlich ausgewogen.";return `Am meisten bewegst du dich gerade bei ${CATS[high[0]].n}. ${CATS[low[0]].n} kommt noch zu kurz. Im Kompass kannst du gezielt diese Richtung wählen.`}

/* ---------- Teilen ---------- */
const APP_URL="https://wurstgott.github.io/fernweh/glueckskompass/";
let shared=null;
function firstSentence(s){const m=s.match(/^.*?[.!?](\s|$)/);return (m?m[0]:s).trim()}
async function shareOut(title,text,url){
  const full=text+"\n\n"+url;
  if(navigator.share){try{await navigator.share({title,text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(full);toast("Text und Link kopiert. Jetzt einfügen und verschicken.");return}catch(e){}
  sheet(`<div class="label">Zum Verschicken</div><h2>Text kopieren</h2><p class="muted" style="font-size:15px">Markiere den Text und kopiere ihn in eine Nachricht.</p><textarea id="sharetext" readonly style="min-height:200px">${esc(full)}</textarea>`);
  const ta=$("#sharetext");ta.focus();ta.select();
}
function shareBite(b){
  const text=`„${b.t}“\n\n${firstSentence(b.x)}\n\nDas stammt aus dem „Glückskompass“, einer kleinen, kostenlosen App mit Erkenntnissen aus der Glücksforschung in Häppchen, Begriffen zum Üben und Experimenten für den Alltag. Ohne Anmeldung, einfach öffnen und stöbern. Das ganze Häppchen mit Quelle (${b.src}) findest du hier:`;
  shareOut(b.t,text,APP_URL+"#h-"+b.id);
}
function shareApp(){
  shareOut("Glückskompass","Ich nutze gerade den „Glückskompass“: eine kleine, kostenlose App, die Erkenntnisse aus der Glücksforschung in Häppchen serviert, mit Quellen und ehrlicher Einschätzung, wie sicher sie sind. Dazu Begriffe zum Üben und kleine Experimente für den Alltag. Ohne Anmeldung, deine Daten bleiben auf deinem Gerät.",APP_URL);
}

/* ---------- Rendern & Ereignisse ---------- */
function render(){
  const v={bites:viewBites,terms:viewTerms,exps:viewExps,way:viewWay}[tab]();
  $("#main").innerHTML=v;renderTabs();
  const n=Object.keys(S.read).length;$("#topline").textContent=n?`${n} / ${BITES.length}`:"";
  $("#rose").innerHTML=Object.keys(CATS).map(k=>{const all=BITES.filter(b=>b.cat===k),r=all.filter(b=>S.read[b.id]).length;return `<b style="--c:var(--c-${k})" title="${CATS[k].n}: ${r} von ${all.length}"><i style="width:${Math.round(r/all.length*100)}%"></i></b>`}).join("");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  const d=t.dataset;
  if(t.id==="go"){const b=pickBite();if(!b)return;t.classList.remove("breath");t.classList.add("spin");setTimeout(()=>openBite(b.id),matchMedia("(prefers-reduced-motion:reduce)").matches?0:520);return}
  if(t.id==="next"){const b=pickBite();if(b)openBite(b.id);return}
  if(t.id==="back"){S.cur=null;shared=null;save();render();return}
  if(t.id==="share"&&S.cur){shareBite(B[S.cur]);return}
  if(t.id==="shareapp"){shareApp();return}
  if(t.id==="explore"){shared=null;S.cur=null;try{history.replaceState(null,"",location.pathname)}catch(x){}render();window.scrollTo(0,0);return}
  if(t.id==="save"&&S.cur){if(S.saved[S.cur])delete S.saved[S.cur];else{S.saved[S.cur]=now();toast("Gemerkt. Du findest es unter „Dein Weg“.")}save();render();return}
  if(d.filter){S.filter=d.filter;save();render();return}
  if(d.open){closeSheet();openBite(d.open);return}
  if(d.term){openTerm=d.term;tab="terms";render();const el=document.querySelector(`[data-tt="${d.term}"]`);if(el)el.scrollIntoView({block:"center"});return}
  if(d.exp){expSheet(d.exp);return}
  if(t.id==="quiz"){startQuiz();return}
  if(d.ans&&Q&&!Q.answered){answer(d.ans);return}
  if(t.id==="qnext"){Q.i++;Q.answered=null;render();return}
  if(t.id==="qagain"){startQuiz();return}
  if(t.id==="qend"){Q=null;render();return}
  if(d.tt){openTerm=openTerm===d.tt?null:d.tt;render();return}
  if(d.efilter){expFilter=d.efilter;render();return}
  if(d.openExp){expSheet(d.openExp);return}
  if(d.accept){if(activeExps().length>=MAXACT)return;S.exps[d.accept]={status:"active",start:now()};save();closeSheet();tab="exps";render();toast("Angenommen. Viel Freude beim Ausprobieren.");return}
  if(t.id==="other"){S.skip=(S.skip||0)+1;save();render();return}
  if(d.drop){S.exps[d.drop]={status:"dropped",start:S.exps[d.drop].start,end:now()};save();render();return}
  if(d.done){doneSheet(d.done);return}
  if(t.id==="savedone"){const id=t.dataset.id,m=document.querySelector('#moods [aria-pressed="true"]');S.exps[id]=Object.assign(S.exps[id]||{start:now()},{status:"done",end:now(),mood:m?m.dataset.mood:null,note:$("#note").value.trim()});save();closeSheet();render();toast("Gespeichert. Schön, dass du es ausprobiert hast.");return}
  if(t.id==="reset"){confirmReset=true;render();return}
  if(t.id==="resetno"){confirmReset=false;render();return}
  if(t.id==="resetyes"){S={read:{},saved:{},terms:{},exps:{},filter:"alle",history:[],cur:null};save();confirmReset=false;Q=null;render();toast("Alles zurückgesetzt.");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function fromHash(){const h=location.hash.slice(1);if(["bites","terms","exps","way"].includes(h)){tab=h;return}if(h.startsWith("h-")&&B[h.slice(2)]){shared=h.slice(2);openBite(shared)}}
if(location.hash)fromHash();
window.addEventListener("hashchange",()=>{fromHash();render()});
render();
})();
</script>
</body></html>
