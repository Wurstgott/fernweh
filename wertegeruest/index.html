<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Wertegerüst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1D2850">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Work+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Konzept „Zwischentöne“: kein Schwarz, kein Weiß. Der Grund läuft von kühlem Nachtblau (die offene Frage)
   zu warmer Erde (das Fundament Würde). Verläufe nur dort, wo zwei Dinge wirklich zusammenkommen. */
:root{
  --bg-top:#1D2850;--bg-bot:#3A2B33;--bg:#29284A;
  --sheet:#252C4C;--sheet-bot:#33293B;
  --card:rgba(232,228,255,.065);--s1:var(--card);--s2:rgba(232,228,255,.11);--line:rgba(222,218,245,.2);--hair:rgba(222,218,245,.11);
  --ink:#F1EDE6;--muted:#B6B7CD;--faint:#A0A3BD;
  --lit:#F1E6D2;--ghost:#4C5378;--accent:#EED3A8;--accent-ink:#EDD7B5;
  --on-lit:#22223A;
  --pol-kalt:#93A6DE;--pol-warm:#D9AE96;--waerme:rgba(236,180,120,.2);
  --c-selbst:#F4B650;--c-naehe:#F58BA0;--c-miteinander:#76B5F8;--c-welt:#56CFA2;--c-urteil:#C3A7FA;
  --f-ui:"Work Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Bricolage Grotesque","Work Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;--ease:cubic-bezier(.2,.8,.2,1);
  --gapc:#222A4C;--scrim:rgba(14,16,34,.55);--shade:rgba(8,8,24,.35);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg-top:#E1E6F1;--bg-bot:#F2E5D3;--bg:#ECE8E4;
  --sheet:#F8F8FA;--sheet-bot:#FAF5EE;
  --s1:var(--card);--s2:rgba(60,56,90,.07);--line:rgba(45,40,70,.15);--hair:rgba(45,40,70,.09);
  --ink:#1B1E2E;--muted:#535870;--faint:#62667C;
  --lit:#262A45;--ghost:#BEBBC6;--accent:#262A45;--accent-ink:#6A4F2E;--on-lit:#F6F1E8;
  --pol-kalt:#5D74B3;--pol-warm:#9A6F5A;--waerme:rgba(196,140,80,.16);
  --c-selbst:#8F5A00;--c-naehe:#B8304A;--c-miteinander:#2462C0;--c-welt:#0E7651;--c-urteil:#7146CC;
  --card:rgba(255,255,255,.7);--gapc:#EBECF1;--scrim:rgba(40,36,56,.32);--shade:rgba(40,36,56,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
/* Grundfarbe hinter allem: oben Anfang, unten Ende des Verlaufs (Gummiband auf dem iPhone blitzt nicht schwarz oder weiß) */
html{-webkit-text-size-adjust:100%;background:var(--bg-bot) linear-gradient(180deg,var(--bg-top),var(--bg),var(--bg-bot)) no-repeat;min-height:100%}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--f-ui);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
/* Fest am Bildschirm ohne background-attachment:fixed (geht auf iOS nicht). Die Ebene ragt je einen halben Bildschirm
   über oben und unten hinaus und ist dort einfarbig; so bleibt sie auch beim Gummiband und bei ein- und ausfahrender
   Safari-Leiste lückenlos. Der sichtbare Teil (25 % bis 75 %) zeigt genau den Verlauf: unten liegt immer die warme Erde. */
body::before{content:"";position:fixed;left:0;right:0;top:-50vh;height:200vh;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 25%,var(--bg) 51%,var(--bg-bot) 75%,var(--bg-bot) 100%);transform:translateZ(0)}
button{font:inherit;color:inherit}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}

/* Kopf */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.logo{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--s1);padding:5px;cursor:pointer;display:grid;place-items:center;flex:none}
.logo svg{width:100%;height:100%;display:block}
.mark{border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-serif);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.pill{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

/* Grundbausteine */
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:7px;line-height:1.4}
.muted{color:var(--muted)}
.small{font-size:14.5px;line-height:1.5}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sec{margin-top:34px}
.view{display:flex;flex-direction:column}
.vh{margin:4px 0 22px}
.vh h1{font-family:var(--f-serif);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.025em}
.vh p{color:var(--muted);margin-top:10px;font-size:15.5px;max-width:34em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:border-color .3s,background-color .3s,transform .15s}
.btn:not(.primary):active{background-color:var(--s2);transition-duration:0s}
.btn.primary{background:var(--lit);color:var(--on-lit);border-color:var(--lit)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--muted);font-size:14.5px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.mini{align-self:flex-start;border:0;background:none;padding:8px 0 0;color:var(--muted);font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mini::before{content:"";width:14px;height:1px;background:var(--muted)}
textarea,input[type=time]{width:100%;background:var(--s1);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;resize:vertical;min-height:90px}
input[type=time]{width:auto;min-height:0;padding:9px 12px;font-family:var(--f-mono);font-size:14px}
textarea:focus,input:focus{outline:none;border-color:var(--muted)}

/* Bereiche als Chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px -18px 2px;padding:4px 18px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .3s,border-color .3s,background-color .3s}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--c,var(--lit)) 60%,var(--line));background:color-mix(in srgb,var(--c,var(--lit)) 9%,transparent)}
.tag{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.tag em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* Listen */
.list{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.li{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:14px 2px;cursor:pointer}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li b{font-weight:600;font-size:15.5px;line-height:1.35}
.li small{color:var(--muted);font-size:13.5px;line-height:1.4}
.li .aside{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.04em;flex:none}
.li .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);width:54px;flex:none}
.wli .tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{white-space:nowrap}
.wli .pill{margin-left:0;font-size:11px;padding:3px 8px;letter-spacing:.1em;text-transform:uppercase}
.wli .pill.on{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}

/* ---------- Bühne: das Gerüst ---------- */
.stage{margin-top:2px}
.gwrap{position:relative;margin:0 -6px}
.gwrap::before{content:"";position:absolute;left:4%;right:4%;top:18%;bottom:6%;background:radial-gradient(closest-side at 50% 76%,var(--waerme),transparent);pointer-events:none}
.gsvg{display:block;width:100%;height:auto;overflow:visible;position:relative}
.gsvg line{stroke-linecap:round;fill:none}
.gsvg .gh{stroke:var(--ghost);stroke-width:1.3;stroke-dasharray:2 5}
.gsvg .gh.nx{stroke:var(--lit);stroke-width:2.4;stroke-dasharray:4 6}
.gsvg .ld{stroke-width:1;opacity:.5;stroke-dasharray:1 3}
.gsvg .glow line{stroke-width:10;opacity:.42}
:root[data-theme="light"] .gsvg .glow{display:none}
.gsvg .gap{stroke:var(--gapc)}
.gsvg .rod{transition:opacity .5s}
.gsvg .pk{stroke-width:3.6;transition:opacity .5s}
.gsvg .br{stroke-width:2.2;stroke-dasharray:9 5;transition:opacity .5s}
.gsvg .base{stroke:var(--pol-warm);stroke-width:5}
.gsvg .nd{fill:var(--gapc);stroke:var(--lit);stroke-width:1.5}
.gsvg.sel .rod:not(.on),.gsvg.sel .pk,.gsvg.sel .br{opacity:.2}
.gsvg .slab{cursor:pointer}
.gsvg .slab text{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.24em;fill:var(--muted)}
.gsvg .lb{font-family:var(--f-ui);font-size:11.5px;font-weight:600}
.gsvg .lb.free{fill:var(--faint);font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.1em}
.gsvg .hit{fill:transparent;cursor:pointer;outline:none}
@media (prefers-reduced-motion:no-preference){
  .gsvg .gh.nx{animation:nx 3.2s ease-in-out infinite}
}
@keyframes nx{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}
#ginfo:empty{display:none}
.pinfo{margin-top:8px;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--s1)}
.steps5{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps5 li{display:flex;align-items:center;gap:11px;font-size:14.5px;color:var(--muted)}
.steps5 li i{width:16px;height:10px;border-radius:2px;border:1px dashed var(--ghost);flex:none}
.steps5 li.ok{color:var(--ink)}
.steps5 li.ok i{background:var(--lit);border:0}

/* Nächster Schritt */
.next{position:relative;overflow:hidden;margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;border:1.5px solid transparent;background:linear-gradient(100deg,color-mix(in srgb,var(--pol-kalt) 10%,var(--sheet)),color-mix(in srgb,var(--pol-warm) 10%,var(--sheet-bot))) padding-box,linear-gradient(100deg,var(--pol-kalt),var(--pol-warm)) border-box;border-radius:var(--r);padding:15px 16px;cursor:pointer}
.next .label{color:var(--accent-ink);grid-column:1}
.next b{grid-column:1;font-weight:600;font-size:16px;line-height:1.4}
.next .arr{grid-column:2;grid-row:1/3;color:var(--accent-ink);font-size:18px}

/* Festigen */
.fest{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--s1)}
.fest .q{color:var(--muted);font-size:14.5px}
.fest blockquote,.leit q{font-family:var(--f-serif);font-weight:500;font-size:20px;line-height:1.3;letter-spacing:-.01em;margin:8px 0 0;quotes:"„" "“"}
.fest blockquote::before{content:"„"}.fest blockquote::after{content:"“"}
.leits{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.leit{border:0;border-bottom:1px solid var(--hair);background:none;text-align:left;padding:14px 2px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.leit small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.leit q{font-size:17.5px}
.special{padding:14px 2px;border-bottom:1px solid var(--hair);font-size:15px}
.special .links{margin-top:10px}

/* Falten */
.fold{margin-top:16px;border-top:1px solid var(--hair)}
.fold+.fold{margin-top:0}
.fold summary{list-style:none;display:flex;align-items:center;gap:10px;padding:17px 2px;cursor:pointer;font-weight:600;font-size:15.5px}
.fold summary::-webkit-details-marker{display:none}
.fold summary .label{margin-left:auto}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .35s var(--ease)}
.fold[open] .chev{transform:rotate(180deg)}
.fbody{padding:0 2px 22px}
.fbody h3,.panel h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.about p{margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tiles div{border:1px solid var(--line);border-radius:10px;padding:12px}
.tiles b{display:block;font-family:var(--f-serif);font-size:28px;font-weight:700;line-height:1}
.tiles span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:6px}
.journal{display:flex;flex-direction:column;gap:14px}
.jr{border-left:2px solid var(--c);padding-left:12px;display:flex;flex-direction:column;gap:2px}
.jr small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.jr b{font-weight:600}
.jr p{font-size:15.5px;line-height:1.5}
.moms{display:flex;flex-wrap:wrap;gap:6px}
.mom{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;display:inline-flex;gap:8px;align-items:baseline}
.mom small{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.setrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:14px 0;cursor:pointer}
.setrow.static{cursor:default}
.setrow span:first-child{flex:1;display:flex;flex-direction:column;gap:3px}
.setrow b{font-weight:600;font-size:15px}
.setrow small{color:var(--muted);font-size:13.5px;line-height:1.45}
.sw{width:40px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--s2);position:relative;flex:none;transition:background-color .3s,border-color .3s}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .3s var(--ease),background-color .3s}
[aria-checked="true"] .sw{background:color-mix(in srgb,var(--accent) 25%,var(--s2));border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
[aria-checked="true"] .sw i{transform:translateX(16px);background:var(--accent)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;flex-direction:column;gap:2px;font-size:14px}
.credit{margin-top:22px;padding-top:16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.credit p{margin:0}
.footcredit{margin:34px 0 0;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--faint)}

/* Belege */
.ev{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ev i{display:inline-flex;gap:2px}
.ev b{width:8px;height:3px;border-radius:1px;background:var(--ghost)}
.ev b.on{background:var(--lit)}

/* ---------- Impulse ---------- */
.draw{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;width:100%;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:20px 18px;cursor:pointer;margin-bottom:16px}
.draw .stack{position:relative;width:38px;height:46px;flex:none}
.draw .stack i{position:absolute;inset:0;border:1px solid var(--muted);border-radius:4px;background:var(--sheet);transition:transform .45s var(--ease)}
.draw .stack i:nth-child(1){transform:translate(6px,-5px);opacity:.35}
.draw .stack i:nth-child(2){transform:translate(3px,-2.5px);opacity:.6}
.draw .stack i:nth-child(3){border-color:var(--lit);background:var(--s2)}
.draw.pull .stack i:nth-child(3){transform:translate(-6px,-14px) rotate(-6deg);opacity:0;transition:transform .42s var(--ease),opacity .42s}
.draw .dtx{flex:1;display:flex;flex-direction:column;gap:3px}
.draw b{font-family:var(--f-serif);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.02em}
.draw small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.draw .arr{color:var(--muted);font-size:18px}
.bite{display:flex;flex-direction:column;padding-top:4px}
.bite .meta,.probe .meta,.exp .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bite .meta>span:first-child,.probe .meta>span:first-child,.exp .meta>span:first-child{display:inline-flex;align-items:center;gap:7px}
.bite h2{font-family:var(--f-serif);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:18px 0 16px;text-wrap:balance}
.bite .body{font-size:17.5px;line-height:1.62}
.note{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;border-top:1px solid var(--hair);background:none;padding:16px 2px;cursor:pointer;font-size:15.5px;line-height:1.5}
.note:first-of-type{margin-top:22px}
.note .tipx{font-family:var(--f-serif);font-weight:500;font-size:18.5px;line-height:1.35;letter-spacing:-.01em}
.note .more{font-size:13px;color:var(--muted)}
.bite .src{border-top:1px solid var(--hair);padding-top:14px;font-size:13.5px;color:var(--muted)}
.bite .src a{text-decoration:none;border-bottom:1px solid var(--line)}
.bite #back{margin-top:18px;align-self:flex-start;text-decoration:none}
.hint{margin-top:22px;text-align:center;font-size:12.5px;color:var(--faint)}
.gift{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);padding:16px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.gift .btn{align-self:flex-start}

/* ---------- Üben ---------- */
.probe,.exp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;background:var(--s1);margin-top:8px}
.exp+.exp{margin-top:10px}
.probe h2,.exp h2{font-family:var(--f-serif);font-weight:700;font-size:25px;line-height:1.12;letter-spacing:-.02em;margin:14px 0 10px}
.exp h2{font-size:21px}
.probe .situ{font-size:17px;line-height:1.58;margin-bottom:18px}
.exp p{font-size:15.5px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:transparent;padding:13px 14px;cursor:pointer;font-size:15.5px;line-height:1.45;transition:border-color .4s,opacity .4s,background-color .4s}
.opt .ok{width:14px;height:14px;border-radius:50%;border:1px solid var(--muted);flex:none;margin-top:3px;transition:background-color .3s,border-color .3s}
.opt.chosen,.opt.pick{border-color:color-mix(in srgb,var(--c) 70%,var(--line));background:color-mix(in srgb,var(--c) 7%,transparent)}
.opt.chosen .ok,.opt.pick .ok{background:var(--c);border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.opts.done .opt{cursor:default}
.opts.done .opt:not(.pick){opacity:.5}
.vw{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink);cursor:pointer}
.vchip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.ot{display:flex;flex-direction:column}
.reveal{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:12px}
.reveal p{font-size:15.5px}
.ask{font-family:var(--f-serif);font-weight:500;font-size:18.5px;line-height:1.35;letter-spacing:-.01em}
.prog{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.meter{height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--pol-kalt),var(--pol-warm))}
.check{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.check .sh{margin-bottom:8px}
.cdots{display:flex;gap:6px}
.cdot{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:4px 0}
.cdot i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
.cdot:active i{background:var(--lit)}
.cdot span{font-size:11.5px;color:var(--muted)}
.spark{width:120px;height:28px}
.spark polyline{fill:none;stroke:var(--lit);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--lit)}
.dcurve{margin:12px 0}

/* ---------- Werte ---------- */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;min-height:118px;border:1px dashed var(--ghost);border-radius:10px;background:none;padding:12px 4px 10px;cursor:pointer}
.slot.on{border-style:solid;border-color:var(--line);background:var(--s1)}
.slot .bars{display:flex;flex-direction:column-reverse;gap:3px}
.slot .bars i{width:16px;height:9px;border-radius:2px;border:1px dashed var(--ghost)}
.slot .bars i.on{background:var(--lit);border:0}
.slot .sn{font-size:11.5px;line-height:1.2;text-align:center;color:var(--ink);word-break:normal;overflow-wrap:normal;hyphens:manual;min-height:2.4em;display:flex;align-items:flex-end}
.slot:not(.on) .sn{color:var(--faint);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em}
.slot.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;background:var(--c);border-radius:2px}
.fundline{margin-top:12px}
.fundline .linkbtn{font-size:14.5px;color:var(--ink)}

/* Sheets */
#layer{position:relative;z-index:40}
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .3s ease both}
.sheet.swap{animation:none}
.sheet.out{animation:fadeout .26s ease both}
.sheet.out .panel{animation:panelout .26s ease both}
.panel{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,var(--sheet),var(--sheet-bot) 520px) var(--sheet-bot);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:26px 20px calc(30px + env(safe-area-inset-bottom));animation:panelin .45s var(--ease) both}
.sheet.swap .panel{animation:none}
.panel .grab{position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.panel .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;z-index:2}
.panel h2{font-family:var(--f-serif);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.025em;margin:10px 40px 12px 0;text-wrap:balance}
.panel .lead{font-size:16.5px;line-height:1.55}
.panel .src{margin-top:16px;font-size:13.5px;color:var(--muted)}
.panel .src a{text-decoration:none;border-bottom:1px solid var(--line)}
.panel>.label:first-of-type,.deep>.label{margin-top:2px}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15.5px}
.howto li::marker{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.go{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:none;padding:12px 14px;cursor:pointer;margin-top:6px}
.go .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.go small{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.go b{font-weight:600;font-size:15px;line-height:1.35}
.go .arr{color:var(--muted)}
.evscale{display:flex;flex-direction:column;gap:6px}
.evscale div{border:1px solid var(--hair);border-radius:10px;padding:10px 12px;opacity:.6}
.evscale div.on{opacity:1;border-color:var(--line);background:var(--s2)}
.evscale p{font-size:14px;margin-top:4px}
/* Wertequadrat: Die Linien zeichnet wqDraw() in Pixeln nach den Kästchen. Oben ein Doppelstrich für das Gleichgewicht,
   senkrecht gestrichelt das Kippen ins Zuviel, schräg ein Pfeil als Weg heraus. Pfeile gibt es nur für den Weg heraus. */
.wq{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:50px 24px}
.wq svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wq svg g{transition:opacity .3s}
.wq svg path{fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,stroke-width .3s}
.wq svg .bal path{stroke:color-mix(in srgb,var(--c) 45%,var(--ghost))}
.wq svg .v path{stroke:var(--ghost);stroke-dasharray:3 4}
.wq svg .d path{stroke:color-mix(in srgb,var(--c) 35%,var(--ghost))}
.wq .q{position:relative;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;min-height:44px;background:var(--sheet)}
.wq .q small{font-family:var(--f-mono);font-size:11px;line-height:1.35;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wq .q small,.wq .q b{-webkit-hyphens:manual;hyphens:manual;overflow-wrap:break-word}
@media (max-width:360px){.wq .q{padding:10px 6px}.wq .q b{font-size:13.5px}}
.wq .q b{font-weight:600;font-size:15px;line-height:1.25}
.wq .q.top{border:1px solid color-mix(in srgb,var(--c) 55%,var(--line))}
.wq .q.bot{border:1px dashed var(--ghost)}
.wq .q.bot b{color:var(--muted);font-weight:500}
.wqkey{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-top:12px;font-size:12px;line-height:1.4;color:var(--muted)}
.wqkey span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.wqkey svg{width:20px;height:12px;flex:none;overflow:visible}
.wqkey path{fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.wqkey .bal path{stroke:color-mix(in srgb,var(--c) 70%,var(--ghost))}
.wqkey .v path{stroke:var(--muted);stroke-dasharray:3 3}
.wqkey .d path{stroke:color-mix(in srgb,var(--c) 70%,var(--ghost))}
.fundnote{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:10px;padding:13px 14px;font-size:15px;margin-top:6px}
.leitbox textarea{font-family:var(--f-serif);font-weight:500;font-size:18px;line-height:1.35;min-height:100px}
.leitbox .row{margin-top:10px}
.leitbox p{margin-top:10px}
.wel .memb,.mcard .memb{width:64px;height:54px;display:block;margin-bottom:14px}

/* Momente */
.moment{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .4s ease both}
.moment.out{animation:fadeout .35s ease both}
.mcard{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.mcard .memb{width:84px;height:70px;margin:0 0 8px}
.mcard h2{font-family:var(--f-serif);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.025em}
.mcard p:not(.label){color:var(--muted);font-size:15.5px;max-width:28em}
.mcard .btn{margin-top:14px}

/* Reiter */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg-bot) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{position:relative;border:0;background:none;padding:17px 0 19px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);transition:color .3s}
.tabs button[aria-current]{color:var(--ink)}
.tabs button em{position:absolute;top:10px;margin-left:4px;font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--accent-ink)}
.tabs button .bd{position:absolute;top:13px;margin-left:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
/* Reiterpunkt: ein kleiner, warmer Punkt unter dem aktiven Reiter, der beim Wechsel hinübergleitet (nur transform) */
.tabs .tbar{position:absolute;bottom:calc(6px + env(safe-area-inset-bottom,0px));left:max(0px,calc(50% - 280px));width:min(100%,560px);height:5px;pointer-events:none}
.tabs .tbar::before{content:"";position:absolute;top:0;left:0;width:25%;height:5px;background:radial-gradient(circle at 50% 50%,var(--pol-warm) 2.1px,transparent 2.6px);transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--ease)}

/* Licht und Effekte */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#fx .lamp{position:fixed;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--lit) 30%,transparent),color-mix(in srgb,var(--lit) 8%,transparent) 55%,transparent);pointer-events:none}
:root[data-theme="light"] #fx .lamp{background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 28%,transparent),transparent)}
#fx .glow{position:fixed;pointer-events:none}
#fx .trace{position:fixed;overflow:visible;pointer-events:none}
#fx .trace rect{fill:none;stroke-width:1.2;stroke-dasharray:100;stroke-dashoffset:100;vector-effect:non-scaling-stroke}
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;width:fit-content;max-width:528px;text-align:center;bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:14px;box-shadow:0 8px 24px var(--shade);animation:toastin .4s var(--ease) both}
.toast b{font-weight:600;color:var(--accent-ink)}
.toast.out{animation:fadeout .3s ease both}

/* Bewegung: nur beim Wechsel und als Antwort auf Berührung */
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes panelin{from{transform:translateY(40px);opacity:0}}
@keyframes panelout{to{transform:translateY(30px);opacity:0}}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes segin{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:no-preference){
  #main.anim .view>*{animation:rise .6s var(--ease) both}
  #main.anim.quick .view{animation:fade .22s ease both}
  #main.anim.quick .view>*,#main.anim.quick .gsvg *{animation:none!important}
  #main.anim .view>*:nth-child(2){animation-delay:.05s}#main.anim .view>*:nth-child(3){animation-delay:.1s}#main.anim .view>*:nth-child(4){animation-delay:.15s}#main.anim .view>*:nth-child(5){animation-delay:.2s}#main.anim .view>*:nth-child(n+6){animation-delay:.25s}
  #main.anim .gsvg .rod,#main.anim .gsvg .gap,#main.anim .gsvg .nd{animation:fade .8s ease both;animation-delay:.2s}
  #main.anim .gsvg .pk,#main.anim .gsvg .br{animation:fade .8s ease both;animation-delay:.6s}
  ::view-transition-group(btitle){animation-duration:.5s;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.vh h1{font-size:30px}.bite h2{font-size:26px}.mark{font-size:20px}.slot .sn{font-size:11px}}
.ask+.muted{margin-top:10px}

/* Werte finden */
.findcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:18px 16px;cursor:pointer;margin-bottom:20px}
.findcard.small{padding:12px 14px;margin:18px 0 0}
.findcard .rods{display:flex;align-items:flex-end;gap:4px;height:40px;flex:none}
.findcard .rods i{width:5px;border-radius:3px;background:var(--c)}
.findcard .rods i:nth-child(1){height:22px;transform:rotate(-8deg)}.findcard .rods i:nth-child(2){height:34px;transform:rotate(6deg)}.findcard .rods i:nth-child(3){height:40px;transform:rotate(-4deg)}.findcard .rods i:nth-child(4){height:28px;transform:rotate(9deg)}.findcard .rods i:nth-child(5){height:18px;transform:rotate(-6deg)}
.findcard.small .rods{height:26px}.findcard.small .rods i{width:4px;height:auto!important;min-height:12px}
.findcard .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.findcard b{font-family:var(--f-serif);font-weight:700;font-size:19px;letter-spacing:-.02em}
.findcard small{color:var(--muted);font-size:13.5px;line-height:1.4}
.findcard .arr{color:var(--muted)}
.fsheet .panel{min-height:78vh}
.finder{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.fsteps{display:flex;gap:14px;flex-wrap:wrap;margin-right:40px}
.fsteps span{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.fsteps i{width:14px;height:3px;border-radius:2px;background:var(--ghost)}
.fsteps .on{color:var(--ink)}.fsteps .on i{background:var(--lit)}
.fsteps .ok{color:var(--muted)}.fsteps .ok i{background:var(--muted)}
.fbar{height:3px;border-radius:2px;background:var(--s2);overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-selbst),var(--c-naehe),var(--c-miteinander),var(--c-welt),var(--c-urteil));transition:width .5s var(--ease)}
.fq{font-family:var(--f-serif);font-weight:600;font-size:20px;line-height:1.3;letter-spacing:-.015em}
.fcard{position:relative;border:1px solid var(--line);border-radius:14px;padding:20px 18px 18px 30px;background:var(--s1);display:flex;flex-direction:column;gap:10px;min-height:190px}
.rodmark{position:absolute;left:13px;top:18px;bottom:18px;width:5px;border-radius:3px;background:var(--c);transform:rotate(2deg)}
.fcard .label{color:var(--c)}
.fst{font-size:20px;line-height:1.4;font-weight:500}
.fbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fbtns .btn{justify-content:center;padding:13px 6px;font-size:14.5px;text-align:center}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fduel{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.fvs{align-self:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.fopt{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--s1);padding:16px 16px 16px 30px;cursor:pointer;transition:border-color .3s,background-color .3s}
.fopt b{font-family:var(--f-serif);font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--c)}
.fopt span:not(.rodmark){font-size:15px;line-height:1.45;color:var(--ink)}
.fopt.won{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.fres{display:flex;flex-direction:column;gap:6px}
.fr{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--s1);padding:12px 14px 12px 30px;cursor:pointer;opacity:.6;transition:opacity .3s,border-color .3s}
.fr .rodmark{top:12px;bottom:12px}
.fr.on{opacity:1;border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.fr .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.fr b{font-weight:600;font-size:16px}
.fr small{color:var(--muted);font-size:13px;line-height:1.4}
.fr .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none}
.fr.on .ck{background:var(--c);border-color:var(--c)}
.fr .why{font-style:normal;font-size:12.5px;color:var(--c);line-height:1.4;margin-top:3px;display:block}
.fcard .fst{font-family:var(--f-serif);font-weight:600;font-size:23px;line-height:1.3;letter-spacing:-.015em}
.slot .psvg{width:100%;height:84px;display:block}
.slot{min-height:0;justify-content:flex-start;padding-top:8px}
.lead+.muted{margin-top:12px}
/* Tensegrity-Wolke */
.gsvg .cb{stroke:var(--lit);stroke-width:.9;opacity:.38}
.gsvg .ft{stroke:var(--pol-warm);stroke-width:1;opacity:.7;stroke-dasharray:none}
.gsvg .ft.gh{stroke:var(--ghost);stroke-dasharray:2 5;opacity:1}
.gsvg .br{stroke-width:2.4;stroke-dasharray:none;opacity:.95}
.gsvg .hitl{stroke:transparent;stroke-width:16;cursor:pointer}
.gsvg .nd{r:2.2;stroke-width:1.2}
.gsvg.sel .cb{opacity:.15}
.gsvg .glow line{stroke-width:9;opacity:.2}
.fundlbl{text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-ink);margin-top:-2px;cursor:pointer}
.glegend{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.lg{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;background:none;padding:10px 4px 9px;cursor:pointer;min-width:0;transition:border-color .4s,background-color .4s}
.lg .nm{font-size:11px;font-weight:600;color:var(--c);line-height:1.2;text-align:center;overflow-wrap:normal;word-break:normal;hyphens:manual}
.lg .pips{display:flex;gap:3px}

  s:{d:"Zufriedenheit heißt, mit dem einverstanden zu sein, was du bist und hast. Du musst nicht ständig mehr werden, um gut genug zu sein.",f:"Womit an dir könntest du heute einfach zufrieden sein?"},
  zv:{d:"Selbstoptimierung ohne Ende heißt, dass nichts je gut genug ist und jeder Erfolg nur zur nächsten Baustelle führt. Gut gemeint ist die Lust, dazuzulernen, doch du kommst nie an.",a:"Du zählst Schlaf, Schritte und Lernzeit und fühlst dich schlecht, sobald ein Wert unter deinem Ziel liegt.",f:"Wann hast du dich zuletzt über etwas gefreut, ohne gleich das Nächste zu planen?"},
  zs:{d:"Stillstand heißt, nichts Neues mehr zu lernen, auch dort, wo es dir guttun würde. Er wächst aus der guten Zufriedenheit, wenn sie sich gegen jede Veränderung sperrt.",a:"Du spielst seit Jahren dieselben drei Stücke auf der Gitarre und sagst: Reicht doch.",f:"Wo hast du dich mit etwas zufriedengegeben, das du eigentlich gern weiterentwickeln würdest?"}},
 echtheit:{
  s:{d:"Anpassungsfähigkeit heißt, dich auf Menschen und Lagen einzustellen. Du merkst, was gerade passt, und kannst dich darauf einlassen, ohne dich aufzugeben.",f:"Wo würde es dir helfen, dich etwas mehr auf die anderen einzustellen?"},
  zv:{d:"Rücksichtslosigkeit heißt hier, dich so zu zeigen, wie du bist, ohne zu fragen, was das bei anderen auslöst. Der gute Kern ist der Wunsch, dich nicht zu verstellen, doch „so bin ich eben“ wird zur Ausrede, um andere zu übergehen.",a:"Du hast schlechte Laune und lässt sie beim Familienessen an allen aus, weil du dich ja nicht verstellen willst.",f:"Wann ist „ich bin halt so“ bei dir eine Ausrede?"},
  zs:{d:"Verstellung heißt, eine Rolle zu spielen, die nicht zu dir passt. Sie beginnt mit dem verständlichen Wunsch, dazuzugehören und keinen Ärger zu machen.",a:"Du lachst über Witze, die du gemein findest, weil alle anderen auch lachen.",f:"In welcher Gruppe bist du am wenigsten du selbst, und warum gerade dort?"}},
 loyalitaet:{
  s:{d:"Kritikbereitschaft heißt, auch Menschen, die dir nahestehen, offen zu sagen, wenn du etwas falsch findest. Du nimmst sie ernst genug, um ihnen zu widersprechen.",f:"Wem in deiner Nähe müsstest du gerade einmal ehrlich widersprechen?"},
  zv:{d:"Blinde Gefolgschaft heißt, zu deinen Leuten zu halten, auch wenn sie im Unrecht sind, und dafür mitzumachen oder zu schweigen. Gut gemeint ist die Treue, doch sie schaut nicht mehr hin.",a:"Deine Clique lästert im Gruppenchat über jemanden, und du schickst ein Lach-Emoji, obwohl du es nicht gut findest.",f:"Wann hast du zuletzt geschwiegen, nur damit niemand denkt, du hältst nicht zu deinen Leuten?"},
  zs:{d:"Nörgelei heißt, an allem etwas auszusetzen, sodass die anderen nicht mehr spüren, dass du zu ihnen stehst. Dahinter steht der gute Wunsch, Dinge besser zu machen.",a:"Bei jedem Plan deiner Freunde sagst du zuerst, was daran nicht funktionieren wird.",f:"Spüren die Menschen, die du kritisierst, auch, dass du zu ihnen hältst?"}},
 fuersorge:{
  s:{d:"Eigenständigkeit heißt hier, anderen zuzutrauen, dass sie selbst wissen, was sie brauchen. Du lässt ihnen ihren eigenen Weg, auch wenn du es anders machen würdest.",f:"Wem könntest du mehr zutrauen, als du es gerade tust?"},
  zv:{d:"Bevormundung heißt, über den Kopf eines anderen hinweg zu entscheiden, was gut für ihn ist. Gut gemeint ist die Sorge um ihn, doch du fragst nicht mehr, was er selbst will.",a:"Deine Freundin will nur von ihrem Streit erzählen, und du sagst ihr genau, was sie jetzt tun muss.",f:"Wann hast du zuletzt geholfen, ohne vorher zu fragen, ob Hilfe gewünscht war?"},
  zs:{d:"Kälte heißt, Menschen allein zu lassen, auch wenn sie dich bräuchten. Sie beginnt mit dem guten Respekt vor dem eigenen Weg der anderen.",a:"Ein Freund ist seit Wochen still, und du denkst: Er meldet sich schon, wenn er etwas will.",f:"Wo sagst du „das muss jeder selbst wissen“, obwohl jemand dich gerade bräuchte?"}},
 vertrauen:{
  s:{d:"Wachsamkeit heißt, aufmerksam zu bleiben und Warnzeichen ernst zu nehmen. Du schaust hin, wenn etwas nicht zusammenpasst.",f:"Wo solltest du genauer hinschauen, statt einfach weiterzumachen?"},
  zv:{d:"Naivität heißt, Warnzeichen zu übersehen, weil du nicht wahrhaben willst, was du siehst. Der gute Kern ist der Glaube an das Gute im anderen.",a:"Du gibst einem Fremden im Netz deine Adresse, weil er so nett geschrieben hat.",f:"Bei wem hast du ein ungutes Gefühl schon einmal weggeschoben?"},
  zs:{d:"Misstrauen heißt, anderen schlechte Absichten zu unterstellen, bevor sie etwas getan haben. Dahinter steht der berechtigte Wunsch, dich zu schützen.",a:"Eine neue Kollegin ist freundlich zu dir, und du fragst dich sofort, was sie von dir will.",f:"Welche Erfahrung hat dich misstrauisch gemacht, und gilt sie wirklich für alle Menschen?"}},
 vergebung:{
  s:{d:"Konsequenz heißt, dass eine Verletzung Folgen hat. Du sagst klar, was nicht in Ordnung war, und hältst daran fest.",f:"Wo bräuchte es von dir eine klare Folge, damit sich etwas nicht wiederholt?"},
  zv:{d:"Nachgiebigkeit heißt, so schnell zu verzeihen, dass sich nichts ändert und dieselbe Kränkung wiederkommt. Gut gemeint ist der Wunsch nach Frieden, doch es fehlt die Grenze.",a:"Deine Freundin sagt zum fünften Mal kurzfristig ab, und du schreibst wieder „kein Problem“.",f:"Welche Entschuldigung hast du angenommen, obwohl du gespürt hast, dass sich nichts ändern wird?"},
  zs:{d:"Unversöhnlichkeit heißt, eine Kränkung so festzuhalten, dass sie dein Leben länger bestimmt als nötig. Sie beginnt mit dem richtigen Wunsch, Unrecht ernst zu nehmen.",a:"Du redest seit Jahren nicht mit deinem Bruder und weißt selbst kaum noch, worum der Streit ging.",f:"Was würde dir helfen, eine Kränkung loszulassen, ohne so zu tun, als wäre sie nicht passiert?"}},
 offenheit:{
  s:{d:"Zurückhaltung heißt, nicht alles sofort zu sagen und nicht alles von dir preiszugeben. Du wählst, wem du was anvertraust.",f:"Wann wäre es klüger, etwas für dich zu behalten oder erst später zu sagen?"},
  zv:{d:"Distanzlosigkeit heißt, zu viel, zu früh oder den falschen Leuten von dir zu erzählen, sodass andere sich bedrängt fühlen. Der gute Kern ist der Wunsch nach Nähe und Ehrlichkeit.",a:"Du erzählst beim ersten Treffen mit neuen Kolleginnen ausführlich von deiner Trennung.",f:"Woran merkst du, dass dein Gegenüber gerade nicht mehr von dir hören möchte?"},
  zs:{d:"Verschlossenheit heißt, dass niemand mehr weiß, wie es dir geht, auch nicht die Menschen, die dir nahestehen. Dahinter steht der gute Wunsch, deine innere Welt zu schützen.",a:"Deine Eltern fragen, wie es dir geht, und du sagst immer nur „passt schon“.",f:"Wem würdest du gern mehr von dir zeigen, und was hält dich davon ab?"}},
 dankbarkeit:{
  s:{d:"Selbstbehauptung heißt, für deine Bedürfnisse und Rechte einzustehen. Du weißt, was dir zusteht, und sagst es auch.",f:"Wo solltest du deutlicher sagen, was du brauchst?"},
  zv:{d:"Unterwürfigkeit heißt, dich so sehr in der Schuld anderer zu fühlen, dass du dich nicht mehr traust, Nein zu sagen. Gut gemeint ist die Anerkennung dessen, was andere für dich tun.",a:"Weil dein Chef dir einmal geholfen hat, machst du klaglos jede Überstunde.",f:"Bei wem fühlst du dich so in der Schuld, dass du nicht mehr widersprichst?"},
  zs:{d:"Anspruchsdenken heißt, alles für selbstverständlich zu halten, weil es dir ja zusteht. Es wächst aus dem guten Wissen um deinen eigenen Wert, wenn dabei der Blick für die Mühe anderer verloren geht.",a:"Du ärgerst dich, dass das Essen noch nicht fertig ist, statt zu sehen, dass jemand für dich kocht.",f:"Was nimmst du als selbstverständlich hin, obwohl sich jemand dafür Mühe gibt?"}},
 verlaesslichkeit:{
  s:{d:"Flexibilität heißt, beweglich zu bleiben, wenn sich die Lage ändert. Du kannst Pläne anpassen, ohne dass alles zusammenbricht.",f:"Welcher deiner Pläne dürfte etwas beweglicher sein?"},
  zv:{d:"Starrheit heißt, an Abmachungen festzuhalten, auch wenn sie niemandem mehr nützen. Gut gemeint ist, dass andere sich auf dich verlassen können.",a:"Du bestehst auf dem verabredeten Kinoabend, obwohl deine Freundin gerade eine schlimme Nachricht bekommen hat.",f:"An welcher Abmachung hältst du fest, obwohl sie ihren Sinn verloren hat?"},
  zs:{d:"Unzuverlässigkeit heißt, zuzusagen und wieder abzusagen, sodass niemand mehr weiß, woran er bei dir ist. Dahinter steht die gute Offenheit für Neues und Unerwartetes.",a:"Du schreibst im Gruppenchat „bin dabei“ und eine Stunde vorher, dass doch etwas dazwischengekommen ist.",f:"Wer musste zuletzt umplanen, weil du deine Pläne geändert hast?"}},
 zuwendung:{
  s:{d:"Eigenraum heißt, Zeit und Platz für dich selbst zu haben. Dort tankst du auf und spürst, was du selbst willst.",f:"Wann hattest du zuletzt eine Stunde ganz für dich?"},
  zv:{d:"Klammern heißt, die Nähe zu einem Menschen so sehr zu brauchen, dass er keine Luft mehr bekommt. Der gute Kern ist der Wunsch, ganz für jemanden da zu sein.",a:"Du wirst unruhig, wenn deine Freundin eine Stunde lang nicht auf deine Nachricht antwortet.",f:"Woran merkst du, dass deine Nähe für jemanden zu viel wird?"},
  zs:{d:"Abschottung heißt, dich so zurückzuziehen, dass andere dich nicht mehr erreichen. Sie beginnt mit dem guten Wunsch nach Ruhe und Zeit für dich.",a:"Du stellst dein Handy wochenlang stumm und sagst jede Einladung ab, auch die von engen Freunden.",f:"Wen hast du in letzter Zeit auf Abstand gehalten, obwohl er dir wichtig ist?"}},
 wuerde:{
  s:{d:"Klarheit gegenüber Unrecht heißt, eine verletzende oder grausame Tat beim Namen zu nennen und ihr entschieden entgegenzutreten. Gerade weil jeder Mensch Würde hat, darf nicht beschönigt werden, was Menschen einander antun.",f:"Welches Unrecht in deiner Nähe möchtest du deutlicher beim Namen nennen?"},
  zv:{d:"Verharmlosung heißt, die Würde eines Täters so sehr in den Vordergrund zu stellen, dass sein Unrecht nicht mehr benannt wird und die Betroffenen aus dem Blick geraten. Der gute Kern ist der Wunsch, keinen Menschen aufzugeben, doch Verstehen heißt nicht Verzeihen und erst recht nicht Beschönigen.",a:"Ein Mitschüler mobbt jemanden, und du sagst nur „er hat es zu Hause auch schwer“, statt klar zu sagen, dass Mobbing nicht in Ordnung ist.",f:"Wann hat dein Verständnis für einen Menschen dazu geführt, dass du sein Unrecht kleiner gemacht hast, als es war?"},
  zs:{d:"Entmenschlichung heißt, in einem Menschen, der Unrecht getan hat, nur noch die Tat zu sehen und ihm sein Menschsein abzusprechen. Sie beginnt mit der richtigen, entschiedenen Ablehnung des Unrechts, doch wer einen Menschen zum „Monster“ oder zu „Abschaum“ erklärt, öffnet neuem Unrecht die Tür.",a:"Unter einem Video über eine Straftat schreiben viele, man solle den Täter „entsorgen“, und du setzt ein Herz darunter.",f:"Woran merkst du, dass deine Ablehnung einer Tat in Verachtung für den Menschen umschlägt?"}},
 gerechtigkeit:{
  s:{d:"Barmherzigkeit heißt, die Not und die Lage eines Menschen zu sehen und ihm mehr Nachsicht zu geben, als ihm streng genommen zusteht.",f:"Wem könntest du mit mehr Nachsicht begegnen, als die Regeln verlangen?"},
  zv:{d:"Unerbittlichkeit heißt, nur noch Regeln zu sehen und keine Menschen mehr. Gut gemeint ist der Wunsch, alle gleich zu behandeln, doch es gibt keine Ausnahme, auch nicht für den, der gerade wirklich nicht konnte.",a:"Ein Mitschüler gibt seinen Teil zu spät ab, weil seine Oma gestorben ist, und du bestehst darauf, dass er genauso bewertet wird wie alle anderen.",f:"Wann war dir eine Regel wichtiger als der Mensch, um den es ging?"},
  zs:{d:"Willkür heißt, dass es nur von Laune oder Sympathie abhängt, wer Nachsicht bekommt und wer nicht. Dahinter steht der gute Wunsch, Menschen zu schonen, doch ohne gemeinsamen Maßstab.",a:"Du bist Schiedsrichterin beim Schulturnier und pfeifst ein Foul mal ab und mal nicht, je nachdem, wer dir gerade leidtut.",f:"Nach welchem Maßstab entscheidest du, wem du etwas durchgehen lässt?"}},
 toleranz:{
  s:{d:"Standfestigkeit heißt, bei deinen Überzeugungen zu bleiben und eine Grenze zu ziehen, wo andere herabgesetzt werden.",f:"Bei welcher Überzeugung möchtest du fester stehen, auch wenn Gegenwind kommt?"},
  zv:{d:"Gleichgültigkeit heißt hier, alles gelten zu lassen, auch wenn Menschen herabgesetzt werden. Der gute Kern ist der Wunsch, andere leben zu lassen, doch es fehlt die Grenze.",a:"In deinem Verein werden abfällige Witze über Geflüchtete gemacht, und du denkst: Jeder darf seine Meinung haben.",f:"Wo hast du etwas „toleriert“, das du eigentlich nicht hinnehmen wolltest?"},
  zs:{d:"Rechthaberei heißt, keinen anderen Standpunkt mehr gelten zu lassen und andere unbedingt bekehren zu wollen. Sie beginnt mit der guten Treue zu deinen Überzeugungen.",a:"Du diskutierst beim Familienessen so lange, bis die anderen nur noch schweigen.",f:"Woran merkst du, dass es dir nicht mehr um die Sache geht, sondern ums Rechtbehalten?"}},
 zivilcourage:{
  s:{d:"Besonnenheit heißt, in einer schwierigen Lage einen kühlen Kopf zu behalten und zu überlegen, was wirklich hilft.",f:"In welcher Lage hätte dir ein kurzer Moment des Überlegens geholfen?"},
  zv:{d:"Übereifer heißt, so hitzig einzugreifen, dass du die Lage verschärfst oder dich und andere in Gefahr bringst. Gut gemeint ist der Wille, Unrecht nicht hinzunehmen.",a:"Du gehst in der Bahn laut schreiend auf einen Pöbler los, statt die bedrängte Person anzusprechen und andere dazuzuholen.",f:"Woran merkst du, dass es dir beim Eingreifen mehr um deine Wut geht als um den Menschen, dem du helfen willst?"},
  zs:{d:"Wegschauen heißt, so lange abzuwägen, bis es zu spät ist, und den bedrängten Menschen allein zu lassen. Dahinter steht der verständliche Wunsch, nichts falsch zu machen.",a:"Jemand wird auf dem Schulhof herumgeschubst, und du überlegst so lange, was das Klügste wäre, bis es vorbei ist.",f:"Was sagst du dir, wenn du nicht eingreifst?"}},
 solidaritaet:{
  s:{d:"Eigenverantwortung heißt, dass jeder Mensch für sein Leben selbst einsteht und das auch kann. Du traust anderen zu, für sich zu sorgen.",f:"Wem würde es mehr helfen, wenn du ihm mehr zutraust?"},
  zv:{d:"Bevormundung heißt, für andere zu sprechen und zu entscheiden, statt mit ihnen. Der gute Kern ist das Einstehen für Menschen, denen es schlechter geht.",a:"Du gehst für eine Kollegin zum Chef, ohne vorher mit ihr gesprochen zu haben.",f:"Wann hast du zuletzt für jemanden gesprochen, ohne ihn zu fragen?"},
  zs:{d:"Ellenbogendenken heißt, dass nur noch zählt, dass du selbst durchkommst. Es wächst aus dem guten Glauben, dass jeder etwas aus sich machen kann, wenn dabei der Blick für die Schwächeren fehlt.",a:"Du sagst über jemanden ohne Arbeit: Selbst schuld, wer sich anstrengt, findet auch etwas.",f:"Wo denkst du „jeder ist für sich selbst verantwortlich“, obwohl jemand es gerade allein nicht schafft?"}},
 erinnerung:{
  s:{d:"Zuversicht heißt, darauf zu vertrauen, dass die Zukunft besser werden kann, und dafür nach vorn zu schauen.",f:"Was gibt dir Hoffnung, dass Menschen aus der Geschichte lernen können?"},
  zv:{d:"Lähmung im Gestern heißt, dass das Vergangene so schwer drückt, dass du nichts mehr anpackst. Gut gemeint ist der Wunsch, nichts zu vergessen, doch der Blick nach vorn fehlt.",a:"Nach einer Doku über die Verbrechen der Vergangenheit fühlst du dich tagelang ohnmächtig und denkst, es ändert sich ja doch nie etwas.",f:"Woran merkst du, dass dich die Vergangenheit lähmt, statt dich wach zu machen?"},
  zs:{d:"Schlussstrich heißt hier, das Vergangene einfach abzuhaken, als hätte es mit heute nichts mehr zu tun. Dahinter steht der gute Wunsch, nach vorn zu schauen, doch was nicht erinnert wird, kann sich wiederholen.",a:"Jemand sagt in der Klasse: Das ist doch ewig her, warum reden wir immer noch darüber?",f:"Welche Geschichte würdest du lieber abhaken, obwohl sie noch etwas mit heute zu tun hat?"}},
 gewaltfreiheit:{
  s:{d:"Wehrhaftigkeit heißt, dich und andere zu schützen und Unrecht nicht einfach geschehen zu lassen. Du setzt eine klare Grenze.",f:"Wo müsstest du dich deutlicher wehren, ohne selbst zu verletzen?"},
  zv:{d:"Hinnehmen von Unrecht heißt, geschehen zu lassen, was du verhindern könntest. Der gute Kern ist der Wunsch, Streit nicht anzuheizen.",a:"Jemand beleidigt dich immer wieder, und du lächelst es weg, damit es keinen Ärger gibt.",f:"Wann hast du Frieden gehalten, obwohl eigentlich Widerstand nötig gewesen wäre?"},
  zs:{d:"Gewaltbereitschaft heißt, zu Drohung, Druck oder Schlägen zu greifen, wodurch neues Unrecht entsteht. Sie beginnt mit dem richtigen Wunsch, sich und andere zu schützen.",a:"Du drohst im Chat, jemandem nach der Schule aufzulauern, weil er deinen Freund beleidigt hat.",f:"Woran merkst du, dass aus Verteidigung Vergeltung wird?"}},
 beteiligung:{
  s:{d:"Kompromissbereitschaft heißt, anderen entgegenzukommen, damit eine gemeinsame Lösung möglich wird. Du kannst auch mittragen, was nicht ganz deins ist.",f:"Wo könntest du einen Schritt auf andere zugehen, damit es gemeinsam weitergeht?"},
  zv:{d:"Dauerprotest heißt, gegen jede Lösung zu sein, die nicht genau deine ist. Gut gemeint ist der Wille, mitzugestalten und nicht alles hinzunehmen.",a:"In der Sitzung der Klassensprecher stimmst du gegen jeden Vorschlag, der nicht von dir kommt.",f:"Wann hast du zuletzt einer Lösung zugestimmt, die nicht deine eigene war?"},
  zs:{d:"Selbstaufgabe heißt, so oft nachzugeben, dass deine Anliegen gar nicht mehr vorkommen. Dahinter steht der gute Wunsch nach Einigung.",a:"Im Team sagst du nach dem ersten Widerspruch: Dann machen wir es halt so, wie ihr wollt.",f:"Wo hast du nachgegeben, obwohl dir die Sache eigentlich wichtig war?"}},
 genuegsamkeit:{
  s:{d:"Lebensfreude heißt, das Leben zu genießen und dich an schönen Dingen zu freuen. Dazu gehört auch, dir ab und zu etwas zu gönnen.",f:"Was hat dir zuletzt richtig Freude gemacht?"},
  zv:{d:"Verzichtszwang heißt, dir nichts mehr zu gönnen und streng auf andere zu schauen, die es anders machen. Der gute Kern ist der Wunsch, mit wenig auszukommen und die Welt zu schonen.",a:"Du kannst dich über ein Geschenk nicht freuen, weil du sofort denkst, dass man so etwas eigentlich nicht braucht.",f:"Wo ist dein Verzichten freudlos geworden?"},
  zs:{d:"Konsumrausch heißt, Freude vor allem im Kaufen und Haben zu suchen, bis sie immer kürzer wird. Er beginnt mit dem verständlichen Wunsch, dir etwas Schönes zu gönnen.",a:"Du bestellst nachts aus Langeweile etwas im Onlineshop und weißt am nächsten Tag kaum noch, was es war.",f:"Was suchst du eigentlich, wenn du etwas Neues kaufst?"}},
 zukunftsverantwortung:{
  s:{d:"Gegenwartsfreude heißt, dich am Hier und Jetzt zu freuen und das Leben heute zu genießen.",f:"Was würdest du heute genießen, wenn du nicht schon an morgen denken würdest?"},
  zv:{d:"Untergangsangst heißt, nur noch Katastrophen zu sehen und dabei die Kraft zum Handeln zu verlieren. Gut gemeint ist die Sorge um die, die nach uns kommen, doch für die Freude am Heute bleibt kein Platz.",a:"Du kannst einen Abend mit Freunden nicht genießen, weil du an die Klimakrise denkst, und fühlst dich danach nur hilflos.",f:"Woran merkst du, dass deine Sorge um die Zukunft dich lähmt, statt dich zu bewegen?"},
  zs:{d:"Sorglosigkeit heißt, die Folgen von heute nicht mehr zu bedenken, sodass andere später den Preis zahlen. Dahinter steht der gute Wunsch, das Leben jetzt zu genießen.",a:"Du sagst: Ob ich das Auto stehen lasse oder nicht, ist doch egal, und denkst nicht weiter darüber nach.",f:"Welche Entscheidung von heute würdest du anders treffen, wenn du ihre Folgen in dreißig Jahren sehen könntest?"}},
 ehrfurcht:{
  s:{d:"Pragmatismus heißt, dich danach zu richten, was im Alltag machbar ist und wirklich hilft. Du suchst Lösungen, die funktionieren.",f:"Wo würde dir eine praktische Lösung mehr helfen als ein hoher Anspruch?"},
  zv:{d:"Moralismus heißt, andere zu belehren und an deinem Maßstab zu messen. Der gute Kern ist der Schutz von Tieren und Pflanzen, doch der Blick für das Machbare geht verloren.",a:"Du hältst beim Essen einen Vortrag, weil jemand Fleisch bestellt hat.",f:"Wann wolltest du zuletzt andere bekehren, statt selbst ein Beispiel zu geben?"},
  zs:{d:"Rücksichtslosigkeit heißt hier, Tiere und Pflanzen nur noch als Mittel und Dinge zu sehen. Sie beginnt mit dem guten Blick für das, was praktisch ist und nützt.",a:"Du trittst eine Schnecke tot, weil sie im Weg ist, und denkst nicht weiter darüber nach.",f:"Welches Lebewesen behandelst du wie eine Sache, ohne es zu merken?"}},
 teilen:{
  s:{d:"Sorgfalt mit Eigentum heißt, deine Sachen zu schätzen und gut auf sie aufzupassen. Du weißt, was dir gehört, und gehst achtsam damit um.",f:"Was gehört dir, auf das du besser achtgeben möchtest?"},
  zv:{d:"Ausnutzbarkeit heißt, auch denen zu geben, die nur nehmen, bis dir selbst etwas fehlt. Gut gemeint ist die Großzügigkeit, doch sie kennt keine Grenze.",a:"Dein Mitbewohner isst ständig deine Vorräte auf, und du sagst nichts, weil man ja teilen soll.",f:"Bei wem gibst du, obwohl du spürst, dass es dir selbst nicht guttut?"},
  zs:{d:"Besitzdenken heißt, dass das Haben mehr zählt als das, was du mit anderen teilen könntest. Es wächst aus der guten Wertschätzung deiner Sachen.",a:"Dein Fahrrad steht seit Monaten im Keller, aber du willst es niemandem leihen.",f:"Was hältst du fest, obwohl jemand anderes es gerade besser gebrauchen könnte?"}},
 sorgfalt:{
  s:{d:"Loslassen heißt, dich von Dingen zu trennen, wenn ihre Zeit vorbei ist. Du erkennst, wann sich Pflege nicht mehr lohnt.",f:"Wovon könntest du dich trennen, weil seine Zeit vorbei ist?"},
  zv:{d:"Festhalten am Kaputten heißt, Dinge aufzuheben, die nicht mehr zu retten sind, bis sie dich belasten. Der gute Kern ist der Wunsch, nichts zu verschwenden.",a:"Dein Schrank ist voll mit Geräten, die du irgendwann reparieren willst, und du benutzt keins davon.",f:"Woran merkst du, dass sich das Reparieren nicht mehr lohnt?"},
  zs:{d:"Wegwerfmentalität heißt, wegzuwerfen, was mit wenig Aufwand noch lange halten würde. Dahinter steht der gute Wunsch nach Ordnung und Neuanfang.",a:"Das Handy hat einen Kratzer, und du willst sofort ein neues.",f:"Was hast du zuletzt weggeworfen, das noch zu retten gewesen wäre?"}},
 naturverbundenheit:{
  s:{d:"Sachlichkeit heißt, die Natur so zu sehen, wie sie ist, mit ihrer Schönheit und ihren Gefahren. Du kannst sie auch nüchtern betrachten, etwa wenn es um Wissen oder Nutzen geht.",f:"Wo würde dir ein nüchterner Blick auf die Natur helfen?"},
  zv:{d:"Romantisierung heißt, die Natur zu verklären und nur das Idyll zu sehen. Gut gemeint ist die Liebe zur Natur, doch du übersiehst, dass sie auch hart und gefährlich sein kann.",a:"Du fütterst die Enten im Park mit Brot, weil es sich schön anfühlt, und merkst nicht, dass es ihnen schadet.",f:"Welches Bild von der Natur hast du, das der Wirklichkeit vielleicht nicht standhält?"},
  zs:{d:"Entfremdung heißt, die Natur nur noch als Kulisse oder Rohstoff zu sehen und nicht mehr zu spüren, dass du selbst dazugehörst. Sie beginnt mit dem guten, klaren Blick, wenn ihm die Verbindung fehlt.",a:"Du warst seit Wochen nicht mehr im Grünen und weißt nicht, was für Bäume vor deinem Haus stehen.",f:"Wann hast du dich zuletzt als Teil der Natur gefühlt?"}},
 folgerichtigkeit:{
  s:{d:"Nachsicht mit dir heißt, dir zu verzeihen, wenn du hinter deinen eigenen Vorsätzen zurückbleibst. Du behandelst dich so freundlich wie einen guten Freund.",f:"Wofür könntest du heute Nachsicht mit dir haben?"},
  zv:{d:"Selbstgeißelung heißt, dich für jede Ausnahme von deinen Vorsätzen zu bestrafen. Der gute Kern ist der Wunsch, wirklich zu tun, was du für richtig hältst, doch dein Anspruch wird zur Last.",a:"Du hast einmal Fleisch gegessen, obwohl du vegetarisch leben willst, und machst dir den ganzen Abend Vorwürfe.",f:"Wie sprichst du mit dir, wenn du einen Vorsatz nicht schaffst?"},
  zs:{d:"Gemeint ist, dass du immer einen Grund findest, warum es diesmal nicht geht. Dahinter steht die gute Freundlichkeit dir selbst gegenüber, doch sie entschuldigt jede Lücke zwischen Wissen und Tun.",a:"Du wolltest das Rad nehmen und sagst dir zum dritten Mal: Heute ist es zu kalt.",f:"Welche Ausrede hörst du dich am häufigsten sagen?"}},
 weitherzigkeit:{
  s:{d:"Nähe zum Eigenen heißt, für die Menschen da zu sein, die direkt um dich sind: Familie, Freunde, Nachbarn. Dort kannst du am unmittelbarsten etwas bewirken.",f:"Wer in deiner Nähe bräuchte gerade deine Aufmerksamkeit?"},
  zv:{d:"Fernstenliebe ohne Nächstenliebe heißt, dich für Fremde in der Ferne einzusetzen und die Menschen neben dir zu übersehen. Gut gemeint ist die Sorge um die ganze Welt.",a:"Du teilst Spendenaufrufe für Menschen auf anderen Kontinenten, rufst aber deine kranke Oma nicht zurück.",f:"Wer in deiner Nähe kommt zu kurz, weil du an die große Welt denkst?"},
  zs:{d:"Engstirnigkeit heißt, dass nur noch zählt, wer zu dir gehört, und alle anderen dir egal sind. Sie wächst aus der guten Treue zu deinen Leuten, wenn der Blick nicht mehr über den eigenen Kreis hinausgeht.",a:"Du sagst: Was gehen mich die Arbeitsbedingungen in anderen Ländern an, Hauptsache, das T-Shirt ist billig.",f:"Wessen Not lässt dich kalt, nur weil er weit weg lebt?"}},
 wahrhaftigkeit:{
  s:{d:"Taktgefühl heißt, zu spüren, was ein anderer gerade verträgt, und eine Wahrheit so zu sagen, dass sie ankommen kann. Dazu gehört auch der richtige Moment.",f:"Welche Wahrheit möchtest du jemandem sagen, und wie könntest du sie taktvoll sagen?"},
  zv:{d:"Verletzende Offenheit heißt, die Wahrheit so hart, zur falschen Zeit oder vor anderen zu sagen, dass sie mehr verletzt als hilft. Der gute Kern ist der Wunsch, ehrlich zu sein.",a:"Du sagst deiner Freundin vor der ganzen Gruppe, dass ihr neuer Haarschnitt furchtbar aussieht.",f:"Woran merkst du, ob du ehrlich sein willst oder nur etwas loswerden musst?"},
  zs:{d:"Schönfärberei heißt, Dinge schöner zu machen, als sie sind, sodass der andere sich nicht nach der Wirklichkeit richten kann. Dahinter steht der gute Wunsch, niemanden zu verletzen.",a:"Du sagst einem Kollegen, sein Vortrag sei super gewesen, und er macht beim nächsten Mal denselben Fehler.",f:"Wo machst du etwas schöner, als es ist, und wem schadet das?"}},
 muendigkeit:{
  s:{d:"Lernbereitschaft heißt, offen zu sein für das, was andere wissen und dir beibringen können. Du nimmst Rat an, wenn er gut begründet ist.",f:"Von wem könntest du gerade etwas lernen?"},
  zv:{d:"Besserwisserei heißt, dein eigenes Urteil für das einzig richtige zu halten und anderen kaum noch zuzuhören. Gut gemeint ist der Wunsch, selbst zu denken.",a:"Du korrigierst im Gruppenchat jede Aussage und gibst nie zu, dass du dich geirrt hast.",f:"Wann hast du zuletzt gesagt: Das wusste ich nicht, danke?"},
  zs:{d:"Hörigkeit heißt, ohne eigenes Nachdenken zu übernehmen, was eine Person, eine Gruppe, ein Influencer oder eine Maschine sagt. Sie beginnt mit der guten Offenheit für das Wissen anderer.",a:"Du machst eine Diät nach, weil eine Influencerin sie empfiehlt, ohne zu prüfen, ob sie gesund ist.",f:"Wessen Meinung übernimmst du am schnellsten, und warum gerade diese?"}},
 differenzierung:{
  s:{d:"Entschiedenheit heißt, dich festzulegen und klar Stellung zu beziehen, wenn es darauf ankommt.",f:"Wo solltest du dich klar entscheiden, statt weiter abzuwägen?"},
  zv:{d:"Unentschiedenheit heißt, endlos abzuwägen und nie zu sagen, was du denkst, auch wenn eine klare Antwort nötig wäre. Der gute Kern ist der Wunsch, allen Seiten gerecht zu werden.",a:"Bei jeder Streitfrage sagst du „einerseits, andererseits“ und drückst dich so davor, Stellung zu beziehen.",f:"Wann hat dich das Abwägen davor bewahrt, Farbe bekennen zu müssen?"},
  zs:{d:"Schwarz-Weiß-Denken heißt, nur noch richtig und falsch, gut und böse zu kennen, sodass die Wirklichkeit zu einfach wird. Dahinter steht der gute Wunsch nach Klarheit.",a:"Nach einem Streit ist ein Mensch für dich plötzlich komplett unten durch, obwohl du ihn vorher mochtest.",f:"Wo würde ein „sowohl als auch“ der Sache besser gerecht als ein klares Ja oder Nein?"}},
 verantwortlichkeit:{
  s:{d:"Gnade mit dir heißt, dir einen Fehler zu vergeben, nachdem du ihn gesehen hast. Du kannst Verantwortung tragen, ohne dich daran aufzureiben.",f:"Für welchen Fehler könntest du inzwischen Gnade mit dir haben?"},
  zv:{d:"Ein Schuldkomplex bedeutet, dass du dir auch die Schuld an dem gibst, was du gar nicht beeinflussen konntest. Gut gemeint ist die Bereitschaft, für Folgen einzustehen, doch du fühlst dich für alles zuständig.",a:"Deine Eltern streiten sich, und du fragst dich, was du falsch gemacht hast.",f:"Welche Schuld trägst du mit dir herum, die eigentlich nicht deine ist?"},
  zs:{d:"Abschieben heißt, die Schuld bei anderen oder bei den Umständen zu suchen, sodass sich nichts ändert. Es beginnt mit dem guten Wunsch, dich nicht fertigzumachen.",a:"Die Gruppenarbeit ist schiefgegangen, und du erklärst sofort, dass die anderen nicht mitgezogen haben.",f:"Wann hast du zuletzt auf andere gezeigt, obwohl ein Teil bei dir lag?"}},
 neugier:{
  s:{d:"Skepsis heißt, nicht alles sofort zu glauben und nach Belegen zu fragen. Du prüfst, bevor du etwas für wahr hältst.",f:"Welche Behauptung, die du zuletzt gehört hast, würde eine genauere Prüfung verdienen?"},
  zv:{d:"Leichtgläubigkeit heißt, für wahr zu halten, was nur spannend klingt. Der gute Kern ist die Offenheit für Neues und Fremdes, doch es fehlt die Prüfung.",a:"Du glaubst ein Video über ein geheimes Heilmittel, weil es so überzeugend erzählt ist, und schickst es weiter.",f:"Woran erkennst du, dass du etwas glauben willst, weil es spannend ist, und nicht, weil es stimmt?"},
  zs:{d:"Zynismus heißt, alles für Lüge oder Eigennutz zu halten und gar nichts mehr verstehen zu wollen. Dahinter steht der gute Wunsch, dich nicht täuschen zu lassen.",a:"Bei jeder guten Nachricht sagst du: Da steckt doch eh nur Geld dahinter.",f:"Wo hast du aufgehört nachzufragen, weil du ohnehin das Schlechteste erwartest?"}},
 integritaet:{
  s:{d:"Lernfähigkeit heißt, dich von neuen Erfahrungen und guten Gründen verändern zu lassen. Du kannst deine Meinung ändern, ohne dich selbst zu verlieren.",f:"Wann hast du zuletzt deine Meinung geändert, und was hat dich überzeugt?"},
  zv:{d:"Sturheit heißt, an einer Haltung festzuhalten, auch wenn gute Gründe dagegen sprechen. Gut gemeint ist der Wunsch, dir treu zu bleiben.",a:"Du merkst mitten im Streit, dass der andere recht hat, und bleibst trotzdem bei deiner Meinung, weil du sie einmal gesagt hast.",f:"Woran merkst du, ob du einer Überzeugung treu bist oder nur nicht nachgeben willst?"},
  zs:{d:"Gemeint ist, dass du dich nach jeder neuen Meinung drehst, bis niemand mehr weiß, wofür du stehst. Gut gemeint ist die Offenheit für Neues, doch ihr fehlt ein fester Halt.",a:"Bei deinen Eltern vertrittst du eine Meinung und am Abend bei deinen Freunden das Gegenteil.",f:"Bei welchem Thema sagst du je nach Gruppe etwas anderes?"}},
 demut:{
  s:{d:"Urteilsvertrauen heißt, dich auf dein eigenes Urteil zu verlassen, wenn du gründlich nachgedacht hast. Du traust dir eine Entscheidung zu.",f:"Wo könntest du deinem Urteil mehr zutrauen, als du es gerade tust?"},
  zv:{d:"Lähmender Selbstzweifel heißt, dir gar kein Urteil mehr zuzutrauen und die Entscheidung anderen zu überlassen. Gut gemeint ist das Wissen, dass du dich irren kannst.",a:"Du weißt im Unterricht die Antwort, meldest dich aber nicht, weil du ja falschliegen könntest.",f:"Wann hat dein Zweifel dich zuletzt davon abgehalten, etwas Richtiges zu sagen?"},
  zs:{d:"Selbstüberschätzung heißt, keinen Irrtum mehr für möglich zu halten und Einwände zu überhören. Sie beginnt mit dem guten Vertrauen in dein eigenes Denken.",a:"Du gibst eine Hausarbeit ab, ohne sie noch einmal durchzulesen, weil du sicher bist, dass alles stimmt.",f:"Wann hast du dich zuletzt ganz sicher gefühlt und lagst trotzdem falsch?"}},
 fairness:{
  s:{d:"Parteinahme für Schwächere heißt, dich bewusst auf die Seite derer zu stellen, die weniger Macht oder weniger Stimme haben. Gleiche Regeln allein reichen nicht, wenn die Ausgangslage ungleich ist.",f:"Wer in deinem Umfeld hätte deine Unterstützung gerade besonders nötig?"},
  zv:{d:"Falsche Ausgewogenheit heißt, beide Seiten gleich zu behandeln, obwohl sie nicht gleich sind, etwa Täter und Opfer. Der gute Kern ist der Wunsch, niemanden zu bevorzugen.",a:"Ein großer Schüler schubst einen kleinen, und du sagst: Ihr seid beide schuld, vertragt euch.",f:"Wann hast du „beide Seiten“ gesagt, obwohl eine Seite klar im Unrecht war?"},
  zs:{d:"Einseitigkeit heißt, nur noch eine Seite zu sehen und die andere mit strengerem Maß zu messen. Dahinter steht der gute Einsatz für die, die es schwerer haben.",a:"In einem Streit glaubst du der einen Person alles, weil sie die Schwächere ist, und hörst die andere gar nicht erst an.",f:"Wen hörst du in einem Konflikt nicht mehr an, weil du schon weißt, auf welcher Seite du stehst?"}}
};

{id:"affirmation",cat:"selbst",ev:2,w:"selbstachtung",ue:"werteinventur",
 t:"Wer seine Werte kennt, hält mehr aus",
 x:"In vielen Experimenten schrieben Menschen ein paar Minuten über einen Wert, der ihnen wichtig ist. Danach reagierten sie gelassener auf Kritik und Bedrohung und hörten Gegenargumenten eher zu. Der Gedanke dahinter: Wer sich an seine Werte erinnert, fühlt sich als ganzer Mensch bestätigt und muss sein Selbstbild nicht bei jedem Angriff verteidigen.",
 c:"Viele Studien, aber die Effekte schwanken stark. Einige große Wiederholungen in Schulen fanden deutlich kleinere Wirkungen als die ersten Studien.",
 tip:"Schreib dir einmal auf, welcher Wert dir am meisten bedeutet und warum. Lies es, bevor ein schwieriges Gespräch ansteht.",
 src:"Cohen & Sherman (2014), Annual Review of Psychology",u:SCH("Cohen Sherman 2014 the psychology of change self-affirmation and social psychological intervention")},
{id:"ambivalenz",cat:"selbst",ev:0,w:"differenzierung",ue:"wertequadrat",
 t:"Hin- und hergerissen zu sein ist kein Charakterfehler",
 x:"Jeder Wert braucht einen Gegenpol, um gut zu bleiben. Ehrlichkeit ohne Taktgefühl wird verletzend, Taktgefühl ohne Ehrlichkeit wird zur Schönfärberei. Das sogenannte Wertequadrat beschreibt genau diese Spannung. Wer zwischen zwei Werten schwankt, ist also nicht haltlos, sondern spürt, dass beide etwas Richtiges wollen.",
 c:"Ein Denkmodell aus der Philosophie und Kommunikationspsychologie, keine empirische Studie. Es hilft, eigene Zwickmühlen zu ordnen.",
 tip:"Wenn du hin- und hergerissen bist, benenne beide Werte. Dann frag: Was wäre jeweils das Zuviel?",
 src:"Helwig (1967); Schulz von Thun (1989), Miteinander reden 2",u:SCH("Schulz von Thun Wertequadrat Entwicklungsquadrat Miteinander reden 2")},
{id:"mitte",cat:"selbst",ev:0,w:"mass",ue:"werttag",
 t:"Die Tugend liegt in der Mitte",
 x:"Aristoteles beschrieb Tugenden als Mitte zwischen zwei Fehlhaltungen. Mut liegt zwischen Feigheit und Tollkühnheit, Großzügigkeit zwischen Geiz und Verschwendung. Die Mitte ist dabei kein lauwarmer Kompromiss, sondern das Richtige zur rechten Zeit, gegenüber den richtigen Menschen und im richtigen Maß.",
 c:"Philosophischer Klassiker aus der Nikomachischen Ethik. Er wird bis heute in der Tugendethik weiterentwickelt.",
 tip:"Frag dich bei einer Entscheidung: Was wäre hier zu wenig, und was wäre zu viel?",
 src:"Aristoteles, Nikomachische Ethik, Buch II",u:SCH("Aristoteles Nikomachische Ethik Mesotes Tugend als Mitte")},
{id:"frankl",cat:"selbst",ev:0,w:"freiheit",ue:"zornnotiz",
 t:"Die letzte Freiheit",
 x:"Viktor Frankl überlebte mehrere Konzentrationslager. Er schrieb später, man könne einem Menschen fast alles nehmen, nur nicht die Freiheit, sich zu den Umständen so oder so einzustellen. Er meinte damit nicht, dass Leid einen Sinn hat. Er meinte, dass auch in größter Unfreiheit ein innerer Raum bleibt, in dem ein Mensch entscheidet, wer er sein will.",
 c:"Ein persönliches Zeugnis und eine philosophische Deutung. Frankl selbst betonte, dass nicht jeder diese Kraft aufbringen konnte und niemand dafür verurteilt werden darf.",
 tip:"Wenn du eine Lage nicht ändern kannst, frag dich: Wie will ich mich in ihr verhalten?",
 src:"Frankl (1946), … trotzdem Ja zum Leben sagen",u:SCH("Viktor Frankl trotzdem Ja zum Leben sagen 1946 Freiheit Einstellung")},
{id:"moralidentitaet",cat:"selbst",ev:2,w:"integritaet",ue:"leitsatz",
 t:"Werte wirken, wenn sie zu dir gehören",
 x:"Menschen unterscheiden sich darin, wie zentral moralische Eigenschaften wie Ehrlichkeit oder Fairness für ihr Selbstbild sind. Wer sie als Kern der eigenen Person erlebt, handelt in Studien häufiger danach, etwa beim Spenden oder Helfen. Werte werden also stabiler, wenn sie nicht nur Regeln sind, sondern ein Teil davon, wer man sein will.",
 c:"Gut untersuchtes Konzept mit vielen Folgestudien. Die Zusammenhänge sind deutlich, aber eher mittelgroß.",
 tip:"Formuliere einen Wert als Satz über dich: Ich bin jemand, der …",
 src:"Aquino & Reed (2002), Journal of Personality and Social Psychology",u:SCH("Aquino Reed 2002 the self-importance of moral identity")},
{id:"licensing",cat:"selbst",ev:1,w:"folgerichtigkeit",ue:"werttag",
 t:"Nach der guten Tat die kleine Ausnahme",
 x:"Manchmal erlauben sich Menschen nach einer guten Tat eher eine weniger gute. Wer gerade gespendet hat, fühlt sich zum Beispiel berechtigt, beim nächsten Mal knausrig zu sein. Fachleute nennen das moralische Lizenzierung.",
 c:"Eine Zusammenschau vieler Studien fand nur einen kleinen Effekt, und neuere Wiederholungen bestätigen ihn teils nicht. Es lohnt sich trotzdem, das Muster bei sich zu bemerken.",
 tip:"Wenn du denkst „Heute darf ich mal“, prüf kurz, ob du dir gerade eine gute Tat anrechnest.",
 src:"Blanken, van de Ven & Zeelenberg (2015), Personality and Social Psychology Bulletin",u:SCH("Blanken van de Ven Zeelenberg 2015 a meta-analytic review of moral licensing")},
{id:"wenndann",cat:"selbst",ev:3,w:"disziplin",ue:"wenndann",
 t:"Ein Plan für den Ernstfall",
 x:"Gute Vorsätze scheitern oft im entscheidenden Moment. Hilfreich sind sogenannte Wenn-dann-Pläne: Wenn Situation X eintritt, dann tue ich Y. Eine Zusammenschau aus fast hundert Studien zeigt, dass solche Pläne die Umsetzung von Zielen deutlich verbessern.",
 c:"Sehr gut belegt, mit vielen Studien in unterschiedlichen Lebensbereichen.",
 tip:"Mach für einen deiner Werte einen Plan: Wenn jemand in meiner Gegenwart abwertend über andere spricht, dann sage ich …",
 src:"Gollwitzer & Sheeran (2006), Advances in Experimental Social Psychology",u:SCH("Gollwitzer Sheeran 2006 implementation intentions and goal achievement meta-analysis")},
{id:"selbstmitgefuehl",cat:"selbst",ev:1,w:"verantwortlichkeit",ue:"entschuldigung",
 t:"Milde mit sich macht verantwortungsvoller",
 x:"Man könnte meinen, Strenge mit sich selbst führe zu besserem Verhalten. In Experimenten war es eher umgekehrt: Menschen, die nach einem Fehler freundlich mit sich umgingen, waren eher bereit, den Fehler wiedergutzumachen und es künftig besser zu machen.",
 c:"Mehrere Experimente einer Forschungsgruppe. Die Richtung ist plausibel, die Größe des Effekts aber noch nicht sicher.",
 tip:"Sprich nach einem Fehler mit dir wie mit einem guten Freund. Dann frag: Was kann ich wiedergutmachen?",
 src:"Breines & Chen (2012), Personality and Social Psychology Bulletin",u:SCH("Breines Chen 2012 self-compassion increases self-improvement motivation")},
{id:"stimmigeziele",cat:"selbst",ev:2,w:"echtheit",ue:"werteinventur",
 t:"Stimmige Ziele tragen weiter",
 x:"Ziele, die zu den eigenen Werten passen, verfolgen Menschen ausdauernder als Ziele, die aus Druck oder Pflicht entstehen. Wer sie erreicht, ist danach auch zufriedener. Es lohnt sich also zu fragen, wessen Ziel man eigentlich verfolgt.",
 c:"Mehrere Längsschnittstudien mit ähnlichem Ergebnis. Die Messung von Stimmigkeit beruht auf Selbstauskunft.",
 tip:"Prüfe eines deiner Ziele: Würdest du es auch verfolgen, wenn niemand davon erfährt?",
 src:"Sheldon & Elliot (1999), Journal of Personality and Social Psychology",u:SCH("Sheldon Elliot 1999 goal striving need satisfaction self-concordance model")},
{id:"mutangst",cat:"selbst",ev:0,w:"mut",ue:"zivilplan",
 t:"Mut heißt nicht, keine Angst zu haben",
 x:"Für Aristoteles ist mutig nicht, wer nichts fürchtet, sondern wer das Richtige trotz Furcht tut, und zwar aus dem richtigen Grund. Wer gar keine Angst spürt, handelt eher leichtsinnig. Angst gehört also zum Mut dazu, sie zeigt nur, dass etwas auf dem Spiel steht.",
 c:"Philosophische Bestimmung aus der Nikomachischen Ethik. Sie passt gut zu dem, was mutige Menschen in Berichten über sich sagen.",
 tip:"Wenn du Angst vor einem Schritt hast, frag nicht, wie die Angst verschwindet, sondern ob der Schritt richtig ist.",

{id:"besseralsandere",cat:"selbst",ev:2,w:"demut",ue:"gegenseite",

 x:"Die meisten Menschen schätzen sich als überdurchschnittlich ehrlich, fair und hilfsbereit ein. Bei moralischen Eigenschaften ist dieser Effekt sogar stärker als bei Intelligenz oder Fahrkünsten. Das ist menschlich, macht aber blind für die eigenen Widersprüche.",
 c:"In mehreren Studien und Ländern gefunden. Die genaue Erklärung wird noch diskutiert.",

{id:"wertewandel",cat:"selbst",ev:2,w:"wachstum",ue:"leitsatz",
 t:"Werte sind stabil, aber nicht starr",
 x:"Langzeitstudien zeigen, dass die Werte Erwachsener über Jahre recht stabil bleiben. Gleichzeitig verschieben sie sich langsam, etwa nach großen Lebensereignissen. Ein Wertegerüst darf also wachsen und umgebaut werden, ohne dass es seinen Halt verliert.",

 src:"Milfont, Milojev & Sibley (2016), Personality and Social Psychology Bulletin",u:SCH("Milfont Milojev Sibley 2016 values stability and change in adulthood")},

{id:"freundschaft",cat:"naehe",ev:0,w:"loyalitaet",ue:"zuhoeren",
 t:"Drei Arten von Freundschaft",
 x:"Aristoteles unterschied Freundschaften, die auf Nutzen beruhen, solche, die auf Vergnügen beruhen, und solche, in denen man den anderen um seiner selbst willen schätzt. Die ersten beiden enden oft, wenn Nutzen oder Spaß wegfallen. Die dritte ist selten, braucht Zeit und trägt am längsten.",
