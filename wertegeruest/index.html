<style>
/* Wertegerüst: dunkel, ruhig, reduziert. Im Mittelpunkt steht das Gerüst, das langsam Licht bekommt. */
:root{
  --bg:#0B0D10;--s1:#111419;--s2:#171B21;--line:#252A32;--hair:#1C2027;
  --ink:#ECEEF1;--muted:#8B929D;--faint:#5C636E;
  --lit:#F1ECE1;--ghost:#3A404A;--accent:#E7C27D;--accent-ink:#E7C27D;
  --on-lit:#0B0D10;
  --c-selbst:#E0A267;--c-naehe:#E08A9C;--c-miteinander:#86A8F0;--c-welt:#8FC79B;--c-urteil:#B9A5EE;
  --f-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;--ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F3EF;--s1:#FBFAF7;--s2:#EFEEE9;--line:#DCDAD3;--hair:#E7E5DF;
  --ink:#16191E;--muted:#5F6670;--faint:#9AA0A8;
  --lit:#1E232B;--ghost:#C9C7C0;--accent:#B9852A;--accent-ink:#8A6119;--on-lit:#F4F3EF;
  --c-selbst:#B8702F;--c-naehe:#B34E66;--c-miteinander:#3E63C2;--c-welt:#3F8150;--c-urteil:#7457C2;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}

/* Kopf */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.logo{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--s1);padding:5px;cursor:pointer;display:grid;place-items:center;flex:none}
.logo svg{width:100%;height:100%;display:block}
.mark{border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-serif);font-size:27px;line-height:1;letter-spacing:-.005em;color:var(--ink)}
.pill{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

/* Grundbausteine */
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:7px;line-height:1.4}
.muted{color:var(--muted)}
.small{font-size:14.5px;line-height:1.5}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sec{margin-top:34px}
.view{display:flex;flex-direction:column}
.vh{margin:4px 0 22px}
.vh h1{font-family:var(--f-serif);font-size:44px;line-height:1;letter-spacing:-.01em}
.vh p{color:var(--muted);margin-top:10px;font-size:15.5px;max-width:34em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:border-color .3s,background-color .3s,transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--lit);color:var(--on-lit);border-color:var(--lit)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--muted);font-size:14.5px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.mini{align-self:flex-start;border:0;background:none;padding:8px 0 0;color:var(--muted);font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mini::before{content:"";width:14px;height:1px;background:var(--muted)}
.ripple{position:absolute;border-radius:50%;background:var(--lit);pointer-events:none}
textarea,input[type=time]{width:100%;background:var(--s1);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;resize:vertical;min-height:90px}
input[type=time]{width:auto;min-height:0;padding:9px 12px;font-family:var(--f-mono);font-size:14px}
textarea:focus,input:focus{outline:none;border-color:var(--muted)}

/* Bereiche als Chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:2px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .3s,border-color .3s,background-color .3s}
.chip small{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--c,var(--lit)) 60%,var(--line));background:color-mix(in srgb,var(--c,var(--lit)) 9%,transparent)}
.tag{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.tag em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* Listen */
.list{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.li{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:14px 2px;cursor:pointer}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li b{font-weight:600;font-size:15.5px;line-height:1.35}
.li small{color:var(--muted);font-size:13.5px;line-height:1.4}
.li .aside{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.04em;flex:none}
.li .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);width:54px;flex:none}
.wli .tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{white-space:nowrap}
.wli .pill{margin-left:0;font-size:9.5px;padding:3px 8px;letter-spacing:.1em;text-transform:uppercase}
.wli .pill.on{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}

/* ---------- Bühne: das Gerüst ---------- */
.stage{margin-top:2px}
.gwrap{position:relative;margin:0 -6px}
.gwrap::before{content:"";position:absolute;left:12%;right:12%;top:30%;bottom:12%;background:radial-gradient(closest-side,color-mix(in srgb,var(--lit) 7%,transparent),transparent);pointer-events:none}
.gsvg{display:block;width:100%;height:auto;overflow:visible;position:relative}
.gsvg .gh{fill:none;stroke:var(--ghost);stroke-width:1;stroke-dasharray:3 4}
.gsvg .gh.nx{stroke:var(--accent);stroke-width:1.3;stroke-dasharray:4 4}
.gsvg .glow rect{fill:var(--lit);opacity:.16}
:root[data-theme="light"] .gsvg .glow rect{opacity:.08}
.gsvg .sg{fill:var(--lit);transition:opacity .5s}
.gsvg.sel .sg:not(.on){opacity:.32}
.gsvg .pk{stroke:var(--lit);stroke-opacity:.55;stroke-width:2.5;stroke-linecap:round}
.gsvg .br{stroke:var(--accent);stroke-opacity:.6;stroke-width:1.2;stroke-linecap:round}
.gsvg .slab{cursor:pointer}
.gsvg .slab text{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.22em;fill:var(--muted)}
.gsvg .lb{font-family:var(--f-ui);font-size:11.5px;font-weight:500;fill:var(--ink)}
.gsvg .lb.free{fill:var(--faint);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em}
.gsvg .hit{fill:transparent;cursor:pointer;outline:none}
@media (prefers-reduced-motion:no-preference){
  .gsvg .gh.nx{animation:nx 3.2s ease-in-out infinite}
}
@keyframes nx{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
#ginfo:empty{display:none}
.pinfo{margin-top:8px;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--s1)}
.steps5{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps5 li{display:flex;align-items:center;gap:11px;font-size:14.5px;color:var(--muted)}
.steps5 li i{width:16px;height:10px;border-radius:2px;border:1px dashed var(--ghost);flex:none}
.steps5 li.ok{color:var(--ink)}
.steps5 li.ok i{background:var(--lit);border:0}

/* Nächster Schritt */
.next{position:relative;overflow:hidden;margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:var(--r);padding:15px 16px;cursor:pointer}
.next .label{color:var(--accent-ink);grid-column:1}
.next b{grid-column:1;font-weight:600;font-size:16px;line-height:1.4}
.next .arr{grid-column:2;grid-row:1/3;color:var(--accent-ink);font-size:18px}

/* Festigen */
.fest{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--s1)}
.fest .q{color:var(--muted);font-size:14.5px}
.fest blockquote,.leit q{font-family:var(--f-serif);font-size:24px;line-height:1.22;margin:8px 0 0;quotes:"„" "“"}
.fest blockquote::before{content:"„"}.fest blockquote::after{content:"“"}
.leits{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.leit{border:0;border-bottom:1px solid var(--hair);background:none;text-align:left;padding:14px 2px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.leit small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.leit q{font-size:21px}
.special{padding:14px 2px;border-bottom:1px solid var(--hair);font-size:15px}
.special .links{margin-top:10px}

/* Falten */
.fold{margin-top:16px;border-top:1px solid var(--hair)}
.fold+.fold{margin-top:0}
.fold summary{list-style:none;display:flex;align-items:center;gap:10px;padding:17px 2px;cursor:pointer;font-weight:600;font-size:15.5px}
.fold summary::-webkit-details-marker{display:none}
.fold summary .label{margin-left:auto}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .35s var(--ease)}
.fold[open] .chev{transform:rotate(180deg)}
.fbody{padding:0 2px 22px}
.fbody h3,.panel h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.about p{margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tiles div{border:1px solid var(--line);border-radius:10px;padding:12px}
.tiles b{display:block;font-family:var(--f-serif);font-size:32px;font-weight:400;line-height:1}
.tiles span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:6px}
.journal{display:flex;flex-direction:column;gap:14px}
.jr{border-left:2px solid var(--c);padding-left:12px;display:flex;flex-direction:column;gap:2px}
.jr small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.jr b{font-weight:600}
.jr p{font-family:var(--f-serif);font-size:19px;line-height:1.3}
.moms{display:flex;flex-wrap:wrap;gap:6px}
.mom{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;display:inline-flex;gap:8px;align-items:baseline}
.mom small{font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.setrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:14px 0;cursor:pointer}
.setrow.static{cursor:default}
.setrow span:first-child{flex:1;display:flex;flex-direction:column;gap:3px}
.setrow b{font-weight:600;font-size:15px}
.setrow small{color:var(--muted);font-size:13.5px;line-height:1.45}
.sw{width:40px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--s2);position:relative;flex:none;transition:background-color .3s,border-color .3s}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .3s var(--ease),background-color .3s}
[aria-checked="true"] .sw{background:color-mix(in srgb,var(--accent) 25%,var(--s2));border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
[aria-checked="true"] .sw i{transform:translateX(16px);background:var(--accent)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;flex-direction:column;gap:2px;font-size:14px}
.credit{margin-top:22px;padding-top:16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.credit p{margin:0}
.footcredit{margin:34px 0 0;text-align:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--faint)}

/* Belege */
.ev{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ev i{display:inline-flex;gap:2px}
.ev b{width:8px;height:3px;border-radius:1px;background:var(--ghost)}
.ev b.on{background:var(--lit)}

/* ---------- Impulse ---------- */
.draw{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;width:100%;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:20px 18px;cursor:pointer;margin-bottom:16px}
.draw .stack{position:relative;width:38px;height:46px;flex:none}
.draw .stack i{position:absolute;inset:0;border:1px solid var(--muted);border-radius:4px;background:var(--s1);transition:transform .45s var(--ease)}
.draw .stack i:nth-child(1){transform:translate(6px,-5px);opacity:.35}
.draw .stack i:nth-child(2){transform:translate(3px,-2.5px);opacity:.6}
.draw .stack i:nth-child(3){border-color:var(--lit);background:var(--s2)}
.draw.pull .stack i:nth-child(3){transform:translate(-6px,-14px) rotate(-6deg);opacity:0;transition:transform .42s var(--ease),opacity .42s}
.draw .dtx{flex:1;display:flex;flex-direction:column;gap:3px}
.draw b{font-family:var(--f-serif);font-weight:400;font-size:28px;line-height:1}
.draw small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.draw .arr{color:var(--muted);font-size:18px}
.bite{display:flex;flex-direction:column;padding-top:4px}
.bite .meta,.probe .meta,.exp .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bite .meta>span:first-child,.probe .meta>span:first-child,.exp .meta>span:first-child{display:inline-flex;align-items:center;gap:7px}
.bite h2{font-family:var(--f-serif);font-size:40px;line-height:1.04;letter-spacing:-.01em;margin:18px 0 16px;text-wrap:balance}
.bite .body{font-size:17.5px;line-height:1.62}
.note{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;border-top:1px solid var(--hair);background:none;padding:16px 2px;cursor:pointer;font-size:15.5px;line-height:1.5}
.note:first-of-type{margin-top:22px}
.note .tipx{font-family:var(--f-serif);font-size:22px;line-height:1.25}
.note .more{font-size:13px;color:var(--muted)}
.bite .src{border-top:1px solid var(--hair);padding-top:14px;font-size:13.5px;color:var(--muted)}
.bite .src a{text-decoration:none;border-bottom:1px solid var(--line)}
.bite #back{margin-top:18px;align-self:flex-start;text-decoration:none}
.hint{margin-top:22px;text-align:center;font-size:12.5px;color:var(--faint)}
.gift{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);padding:16px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.gift .btn{align-self:flex-start}

/* ---------- Üben ---------- */
.probe,.exp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;background:var(--s1);margin-top:8px}
.exp+.exp{margin-top:10px}
.probe h2,.exp h2{font-family:var(--f-serif);font-size:32px;line-height:1.05;margin:14px 0 10px}
.exp h2{font-size:27px}
.probe .situ{font-size:17px;line-height:1.58;margin-bottom:18px}
.exp p{font-size:15.5px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:transparent;padding:13px 14px;cursor:pointer;font-size:15.5px;line-height:1.45;transition:border-color .4s,opacity .4s,background-color .4s}
.opt .ok{width:14px;height:14px;border-radius:50%;border:1px solid var(--muted);flex:none;margin-top:3px;transition:background-color .3s,border-color .3s}
.opt.chosen,.opt.pick{border-color:color-mix(in srgb,var(--c) 70%,var(--line));background:color-mix(in srgb,var(--c) 7%,transparent)}
.opt.chosen .ok,.opt.pick .ok{background:var(--c);border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.opts.done .opt{cursor:default}
.opts.done .opt:not(.pick){opacity:.5}
.vw{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink);cursor:pointer}
.vchip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

 {id:"differenzierung",cat:"urteil",n:"Differenzierung",d:"Du siehst Zwischentöne und bildest dir ein Urteil, das der Wirklichkeit gerecht wird.",s:"Entschiedenheit",zv:"Beliebigkeit",zs:"Schwarz-Weiß-Denken",f:"Wo urteilst du schnell, obwohl die Lage verwickelter ist?",b:"Du sagst: In diesem Punkt hast du recht, in jenem nicht."},

 {id:"neugier",cat:"urteil",n:"Neugier",d:"Du willst verstehen, auch das, was dir fremd ist oder nicht gefällt.",s:"Skepsis",zv:"Leichtgläubigkeit",zs:"Zynismus",f:"Was möchtest du über einen Menschen verstehen, den du nicht magst?",b:"Du fragst jemanden mit anderer Meinung, wie er dazu gekommen ist."},

const IMPULSE=[
/* ---------- Selbst ---------- */
{id:"affirmation",cat:"selbst",ev:2,w:"selbstachtung",ue:"werteinventur",
 t:"Wer seine Werte kennt, hält mehr aus",
 x:"In vielen Experimenten schrieben Menschen ein paar Minuten über einen Wert, der ihnen wichtig ist. Danach reagierten sie gelassener auf Kritik und Bedrohung und hörten Gegenargumenten eher zu. Der Gedanke dahinter: Wer sich an seine Werte erinnert, fühlt sich als ganzer Mensch bestätigt und muss sein Selbstbild nicht bei jedem Angriff verteidigen.",
 c:"Viele Studien, aber die Effekte schwanken stark. Einige große Wiederholungen in Schulen fanden deutlich kleinere Wirkungen als die ersten Studien.",
 tip:"Schreib dir einmal auf, welcher Wert dir am meisten bedeutet und warum. Lies es, bevor ein schwieriges Gespräch ansteht.",
 src:"Cohen & Sherman (2014), Annual Review of Psychology",u:SCH("Cohen Sherman 2014 the psychology of change self-affirmation and social psychological intervention")},
{id:"ambivalenz",cat:"selbst",ev:0,w:"differenzierung",ue:"wertequadrat",
 t:"Ambivalenz ist kein Charakterfehler",
 x:"Jeder Wert braucht einen Gegenpol, um gut zu bleiben. Ehrlichkeit ohne Taktgefühl wird verletzend, Taktgefühl ohne Ehrlichkeit wird zur Schönfärberei. Das sogenannte Wertequadrat beschreibt genau diese Spannung. Wer zwischen zwei Werten schwankt, ist also nicht haltlos, sondern spürt, dass beide etwas Richtiges wollen.",
 c:"Ein Denkmodell aus der Philosophie und Kommunikationspsychologie, keine empirische Studie. Es hilft, eigene Zwickmühlen zu ordnen.",
 tip:"Wenn du hin- und hergerissen bist, benenne beide Werte. Dann frag: Was wäre jeweils das Zuviel?",
 src:"Helwig (1967); Schulz von Thun (1989), Miteinander reden 2",u:SCH("Schulz von Thun Wertequadrat Entwicklungsquadrat Miteinander reden 2")},
{id:"mitte",cat:"selbst",ev:0,w:"mass",ue:"werttag",
 t:"Die Tugend liegt in der Mitte",
 x:"Aristoteles beschrieb Tugenden als Mitte zwischen zwei Fehlhaltungen. Mut liegt zwischen Feigheit und Tollkühnheit, Großzügigkeit zwischen Geiz und Verschwendung. Die Mitte ist dabei kein lauwarmer Kompromiss, sondern das Richtige zur rechten Zeit, gegenüber den richtigen Menschen und im richtigen Maß.",
 c:"Philosophischer Klassiker aus der Nikomachischen Ethik. Er wird bis heute in der Tugendethik weiterentwickelt.",
 tip:"Frag dich bei einer Entscheidung: Was wäre hier zu wenig, und was wäre zu viel?",
 src:"Aristoteles, Nikomachische Ethik, Buch II",u:SCH("Aristoteles Nikomachische Ethik Mesotes Tugend als Mitte")},
{id:"frankl",cat:"selbst",ev:0,w:"freiheit",ue:"zornnotiz",
 t:"Die letzte Freiheit",
 x:"Viktor Frankl überlebte mehrere Konzentrationslager. Er schrieb später, man könne einem Menschen fast alles nehmen, nur nicht die Freiheit, sich zu den Umständen so oder so einzustellen. Er meinte damit nicht, dass Leid einen Sinn hat. Er meinte, dass auch in größter Unfreiheit ein innerer Raum bleibt, in dem ein Mensch entscheidet, wer er sein will.",
 c:"Ein persönliches Zeugnis und eine philosophische Deutung. Frankl selbst betonte, dass nicht jeder diese Kraft aufbringen konnte und niemand dafür verurteilt werden darf.",
 tip:"Wenn du eine Lage nicht ändern kannst, frag dich: Wie will ich mich in ihr verhalten?",
 src:"Frankl (1946), … trotzdem Ja zum Leben sagen",u:SCH("Viktor Frankl trotzdem Ja zum Leben sagen 1946 Freiheit Einstellung")},
{id:"moralidentitaet",cat:"selbst",ev:2,w:"integritaet",ue:"leitsatz",
 t:"Werte wirken, wenn sie zu dir gehören",
 x:"Menschen unterscheiden sich darin, wie zentral moralische Eigenschaften wie Ehrlichkeit oder Fairness für ihr Selbstbild sind. Wer sie als Kern der eigenen Person erlebt, handelt in Studien häufiger danach, etwa beim Spenden oder Helfen. Werte werden also stabiler, wenn sie nicht nur Regeln sind, sondern ein Teil davon, wer man sein will.",
 c:"Gut untersuchtes Konzept mit vielen Folgestudien. Die Zusammenhänge sind deutlich, aber eher mittelgroß.",
 tip:"Formuliere einen Wert als Satz über dich: Ich bin jemand, der …",
 src:"Aquino & Reed (2002), Journal of Personality and Social Psychology",u:SCH("Aquino Reed 2002 the self-importance of moral identity")},
{id:"licensing",cat:"selbst",ev:1,w:"folgerichtigkeit",ue:"werttag",
 t:"Nach der guten Tat die kleine Ausnahme",
 x:"Manchmal erlauben sich Menschen nach einer guten Tat eher eine weniger gute. Wer gerade gespendet hat, fühlt sich zum Beispiel berechtigt, beim nächsten Mal knausrig zu sein. Fachleute nennen das moralische Lizenzierung.",
 c:"Eine Zusammenschau vieler Studien fand nur einen kleinen Effekt, und neuere Wiederholungen bestätigen ihn teils nicht. Es lohnt sich trotzdem, das Muster bei sich zu bemerken.",
 tip:"Wenn du denkst „Heute darf ich mal“, prüf kurz, ob du dir gerade eine gute Tat anrechnest.",
 src:"Blanken, van de Ven & Zeelenberg (2015), Personality and Social Psychology Bulletin",u:SCH("Blanken van de Ven Zeelenberg 2015 a meta-analytic review of moral licensing")},
{id:"wenndann",cat:"selbst",ev:3,w:"disziplin",ue:"wenndann",
 t:"Ein Plan für den Ernstfall",
 x:"Gute Vorsätze scheitern oft im entscheidenden Moment. Hilfreich sind sogenannte Wenn-dann-Pläne: Wenn Situation X eintritt, dann tue ich Y. Eine Zusammenschau aus fast hundert Studien zeigt, dass solche Pläne die Umsetzung von Zielen deutlich verbessern.",
 c:"Sehr gut belegt, mit vielen Studien in unterschiedlichen Lebensbereichen.",
 tip:"Mach für einen deiner Werte einen Plan: Wenn jemand in meiner Gegenwart abwertend über andere spricht, dann sage ich …",
 src:"Gollwitzer & Sheeran (2006), Advances in Experimental Social Psychology",u:SCH("Gollwitzer Sheeran 2006 implementation intentions and goal achievement meta-analysis")},
{id:"selbstmitgefuehl",cat:"selbst",ev:1,w:"verantwortlichkeit",ue:"entschuldigung",
 t:"Milde mit sich macht verantwortungsvoller",
 x:"Man könnte meinen, Strenge mit sich selbst führe zu besserem Verhalten. In Experimenten war es eher umgekehrt: Menschen, die nach einem Fehler freundlich mit sich umgingen, waren eher bereit, den Fehler wiedergutzumachen und es künftig besser zu machen.",
 c:"Mehrere Experimente einer Forschungsgruppe. Die Richtung ist plausibel, die Größe des Effekts aber noch nicht sicher.",
 tip:"Sprich nach einem Fehler mit dir wie mit einem guten Freund. Dann frag: Was kann ich wiedergutmachen?",
 src:"Breines & Chen (2012), Personality and Social Psychology Bulletin",u:SCH("Breines Chen 2012 self-compassion increases self-improvement motivation")},
{id:"stimmigeziele",cat:"selbst",ev:2,w:"echtheit",ue:"werteinventur",
 t:"Stimmige Ziele tragen weiter",
 x:"Ziele, die zu den eigenen Werten passen, verfolgen Menschen ausdauernder als Ziele, die aus Druck oder Pflicht entstehen. Wer sie erreicht, ist danach auch zufriedener. Es lohnt sich also zu fragen, wessen Ziel man eigentlich verfolgt.",
 c:"Mehrere Längsschnittstudien mit ähnlichem Ergebnis. Die Messung von Stimmigkeit beruht auf Selbstauskunft.",
 tip:"Prüfe eines deiner Ziele: Würdest du es auch verfolgen, wenn niemand davon erfährt?",
 src:"Sheldon & Elliot (1999), Journal of Personality and Social Psychology",u:SCH("Sheldon Elliot 1999 goal striving need satisfaction self-concordance model")},
{id:"mutangst",cat:"selbst",ev:0,w:"mut",ue:"zivilplan",
 t:"Mut heißt nicht, keine Angst zu haben",
 x:"Für Aristoteles ist mutig nicht, wer nichts fürchtet, sondern wer das Richtige trotz Furcht tut, und zwar aus dem richtigen Grund. Wer gar keine Angst spürt, handelt eher leichtsinnig. Angst gehört also zum Mut dazu, sie zeigt nur, dass etwas auf dem Spiel steht.",
 c:"Philosophische Bestimmung aus der Nikomachischen Ethik. Sie passt gut zu dem, was mutige Menschen in Berichten über sich sagen.",
 tip:"Wenn du Angst vor einem Schritt hast, frag nicht, wie die Angst verschwindet, sondern ob der Schritt richtig ist.",
 src:"Aristoteles, Nikomachische Ethik, Buch III",u:SCH("Aristoteles Tapferkeit Nikomachische Ethik Buch III Furcht")},
{id:"besseralsandere",cat:"selbst",ev:2,w:"demut",ue:"gegenseite",
 t:"Wir halten uns für moralischer als andere",
 x:"Die meisten Menschen schätzen sich als überdurchschnittlich ehrlich, fair und hilfsbereit ein. Bei moralischen Eigenschaften ist dieser Effekt sogar stärker als bei Intelligenz oder Fahrkünsten. Das ist menschlich, macht aber blind für die eigenen Widersprüche.",
 c:"In mehreren Studien und Ländern gefunden. Die genaue Erklärung wird noch diskutiert.",
 tip:"Wenn du dich über das Verhalten anderer empörst, frag dich: Wann habe ich zuletzt ähnlich gehandelt?",
 src:"Tappin & McKay (2017), Social Psychological and Personality Science",u:SCH("Tappin McKay 2017 the illusion of moral superiority")},
{id:"wertewandel",cat:"selbst",ev:2,w:"wachstum",ue:"leitsatz",
 t:"Werte sind stabil, aber nicht starr",
 x:"Langzeitstudien zeigen, dass die Werte Erwachsener über Jahre recht stabil bleiben. Gleichzeitig verschieben sie sich langsam, etwa nach großen Lebensereignissen. Ein Wertegerüst darf also wachsen und umgebaut werden, ohne dass es seinen Halt verliert.",
 c:"Mehrere Längsschnittstudien mit großen Stichproben. Kurzfristige Schwankungen hängen auch mit der Messung zusammen.",
 tip:"Schau in einem Jahr auf deine Leitsätze. Was davon würdest du heute anders sagen?",
 src:"Milfont, Milojev & Sibley (2016), Personality and Social Psychology Bulletin",u:SCH("Milfont Milojev Sibley 2016 values stability and change in adulthood")},
/* ---------- Nähe ---------- */
{id:"freundschaft",cat:"naehe",ev:0,w:"loyalitaet",ue:"zuhoeren",
 t:"Drei Arten von Freundschaft",
 x:"Aristoteles unterschied Freundschaften, die auf Nutzen beruhen, solche, die auf Vergnügen beruhen, und solche, in denen man den anderen um seiner selbst willen schätzt. Die ersten beiden enden oft, wenn Nutzen oder Spaß wegfallen. Die dritte ist selten, braucht Zeit und trägt am längsten.",
 c:"Philosophischer Klassiker. Echte Freundschaften mischen meist alle drei Formen.",
 tip:"Denk an einen Freund: Was schätzt du an ihm selbst, unabhängig davon, was er dir bringt?",
 src:"Aristoteles, Nikomachische Ethik, Buch VIII",u:SCH("Aristoteles Freundschaft Nikomachische Ethik Buch VIII Nutzen Lust Tugend")},
{id:"vergebungwirkt",cat:"naehe",ev:2,w:"vergebung",ue:"vergebungsbrief",
 t:"Vergeben entlastet vor allem dich",
 x:"Eine Zusammenschau von über fünfzig Studien zeigt: Menschen, die angeleitet an Vergebung arbeiteten, berichteten danach weniger Wut, weniger Niedergeschlagenheit und mehr Hoffnung. Je länger sie sich damit beschäftigten, desto stärker war die Wirkung.",
 c:"Solide Datenlage aus vielen Studien. Gemessen wurde meist mit Fragebögen.",
 tip:"Vergeben musst du nicht sofort. Fang damit an, die Kränkung aufzuschreiben, ohne sie zu bewerten.",
 src:"Wade, Hoyt, Kidwell & Worthington (2014), Journal of Consulting and Clinical Psychology",u:SCH("Wade Hoyt Kidwell Worthington 2014 efficacy of psychotherapeutic interventions to promote forgiveness meta-analysis")},
{id:"vergebennicht",cat:"naehe",ev:0,w:"vergebung",ue:"vergebungsbrief",
 t:"Verstehen ist nicht Verzeihen",
 x:"Vergeben heißt nicht, das Unrecht gutzuheißen, es zu vergessen oder sich zu versöhnen. Man kann einem Menschen vergeben und trotzdem Abstand halten. Und man kann verstehen wollen, wie es zu einer Tat kam, ohne sie zu entschuldigen. Niemand ist verpflichtet zu vergeben, schon gar nicht stellvertretend für andere.",
 c:"Eine Unterscheidung, die in der Vergebungsforschung und in der Ethik breit geteilt wird.",
 tip:"Trenne drei Fragen: Will ich verstehen? Will ich vergeben? Will ich wieder Nähe?",
 src:"Enright & Fitzgibbons (2015), Forgiveness Therapy",u:SCH("Enright forgiveness is not reconciliation condoning forgetting")},
{id:"gutenachrichten",cat:"naehe",ev:2,w:"zuwendung",ue:"zuhoeren",
 t:"Wie du auf Gutes reagierst, zählt",
 x:"Beziehungen hängen nicht nur davon ab, wie man in Krisen füreinander da ist. Mindestens genauso wichtig ist, wie man reagiert, wenn der andere etwas Schönes erzählt. Echtes, interessiertes Mitfreuen stärkt die Bindung messbar, ein beiläufiges „Schön für dich“ dagegen kaum.",
 c:"Mehrere Studien mit Paaren und Freunden, auch mit Beobachtungen im Labor.",
 tip:"Wenn jemand dir eine gute Nachricht erzählt, stell eine echte Nachfrage dazu.",
 src:"Gable, Reis, Impett & Asher (2004), Journal of Personality and Social Psychology",u:SCH("Gable Reis Impett Asher 2004 what do you do when things go right capitalization")},
{id:"verachtung",cat:"naehe",ev:1,w:"wuerde",ue:"grenzewuerde",
 t:"Verachtung zerstört mehr als Streit",
 x:"Streit gehört zu jeder engen Beziehung. Gefährlich wird es, wenn Verachtung dazukommt: Spott, Augenrollen, Herabsetzung der ganzen Person. In Beobachtungsstudien mit Paaren galt Verachtung als einer der deutlichsten Hinweise auf spätere Trennungen.",
 c:"Die Grundidee ist gut gestützt, populäre Zahlen zur Trefferquote sind aber übertrieben.",
 tip:"Kritisiere im Streit ein Verhalten, nicht den ganzen Menschen.",
 src:"Gottman & Levenson (2000), Journal of Marriage and Family",u:SCH("Gottman Levenson 2000 the timing of divorce predicting when a couple will divorce contempt")},
{id:"feedbackwunsch",cat:"naehe",ev:1,w:"wahrhaftigkeit",ue:"ehrlichesfeedback",
 t:"Andere wollen ehrliche Hinweise öfter als gedacht",
 x:"Ein Fleck auf dem Hemd, Spinat zwischen den Zähnen, ein Fehler im Vortrag: Viele sagen lieber nichts, um niemanden zu beschämen. In Studien unterschätzten Menschen deutlich, wie gern andere solche Hinweise bekommen hätten.",
 c:"Mehrere Experimente einer Forschungsgruppe mit einheitlichem Ergebnis. Bei sehr persönlichen Themen kann es anders aussehen.",
 tip:"Wenn du zögerst, einen hilfreichen Hinweis zu geben, frag dich: Würde ich es an seiner Stelle wissen wollen?",
 src:"Abi-Esber, Abel, Schroeder & Gino (2022), Journal of Personality and Social Psychology",u:SCH("Abi-Esber Abel Schroeder Gino 2022 just letting you know underestimating others desire for constructive feedback")},
{id:"notluege",cat:"naehe",ev:1,w:"wahrhaftigkeit",ue:"ehrlichesfeedback",
 t:"Freundliche Lügen gelten oft als moralisch",
 x:"Wenn jemand lügt, um einen anderen zu schonen, halten Beobachter ihn in Studien oft für moralischer als jemanden, der eine verletzende Wahrheit sagt. Wohlwollen wiegt also manchmal schwerer als Ehrlichkeit. Die Spannung zwischen Wahrheit und Taktgefühl ist uralt und lässt sich nicht mit einer Regel lösen.",
 c:"Mehrere Experimente mit ähnlichem Ergebnis. Langfristige Folgen für Beziehungen sind wenig untersucht.",
 tip:"Prüf bei einer Notlüge: Schütze ich den anderen oder mich selbst vor einem unangenehmen Moment?",
 src:"Levine & Schweitzer (2014), Journal of Experimental Social Psychology",u:SCH("Levine Schweitzer 2014 are liars ethical on the tension between benevolence and honesty")},
{id:"ichdu",cat:"naehe",ev:0,w:"zuwendung",ue:"zuhoeren",
 t:"Begegnung statt Benutzung",
 x:"Martin Buber unterschied zwei Grundhaltungen: In der Ich-Es-Haltung behandeln wir andere als Mittel, als Rolle oder Funktion. In der Ich-Du-Haltung begegnen wir ihnen als ganzen Menschen. Beides gehört zum Leben, aber nur in der zweiten entsteht echte Beziehung.",
 c:"Philosophischer Klassiker des 20. Jahrhunderts.",
 tip:"Sprich heute mit jemandem, den du sonst nur in seiner Funktion siehst, etwa an der Kasse, über etwas Persönliches.",
 src:"Buber (1923), Ich und Du",u:SCH("Martin Buber Ich und Du 1923")},
{id:"vertrauenlohnt",cat:"naehe",ev:2,w:"vertrauen",ue:"zuhoeren",
 t:"Wir unterschätzen, wie vertrauenswürdig andere sind",
 x:"In Vertrauensspielen mit echtem Geld trauten Menschen Fremden deutlich weniger zu, als diese dann tatsächlich zurückgaben. Wer misstraut, erfährt allerdings nie, dass er falschlag. So bestätigt sich Misstrauen selbst, während Vertrauen die Chance bekommt, belohnt zu werden.",
 c:"Mehrere Experimente mit einheitlichem Muster. Im Alltag hängt viel von der Lage ab.",
 tip:"Gib einem Menschen, bei dem du unsicher bist, einen kleinen Vertrauensvorschuss und schau, was passiert.",
 src:"Fetchenhauer & Dunning (2010), Psychological Science",u:SCH("Fetchenhauer Dunning 2010 why so cynical asymmetric feedback underlies misguided skepticism regarding the trustworthiness of others")},
{id:"widerspruch",cat:"naehe",ev:0,w:"loyalitaet",ue:"widerspruch",
 t:"Loyal sein heißt manchmal widersprechen",
 x:"Der Ökonom Albert Hirschman beschrieb, wie Menschen auf Missstände in einer Gemeinschaft reagieren: Sie gehen, oder sie erheben ihre Stimme. Loyalität entscheidet oft, ob jemand bleibt und sich einsetzt. Wer schweigt, um Frieden zu wahren, ist deshalb nicht unbedingt loyaler als jemand, der offen widerspricht.",
 c:"Einflussreiches Denkmodell aus der Ökonomie, auf Freundschaften übertragen.",
 tip:"Sag einem Freund, wo du anderer Meinung bist, gerade weil er dir wichtig ist.",
 src:"Hirschman (1970), Exit, Voice, and Loyalty",u:SCH("Hirschman 1970 exit voice and loyalty")},
{id:"dankbindet",cat:"naehe",ev:2,w:"dankbarkeit",ue:"zuhoeren",
 t:"Dank verbindet",
 x:"Dankbarkeit lenkt den Blick auf Menschen, die einem guttun, und bringt einen näher zu ihnen. In Studien mit Paaren führte ausgedrückter Dank dazu, dass sich beide verbundener fühlten und mehr in die Beziehung investierten.",
 c:"Mehrere Studien, vor allem mit Paaren und Mitbewohnern. Die Effekte sind mittelgroß.",
 tip:"Danke heute jemandem für etwas Konkretes, das er nicht tun musste.",
 src:"Algoe (2012), Social and Personality Psychology Compass",u:SCH("Algoe 2012 find remind and bind the functions of gratitude in everyday relationships")},
{id:"entschuldigung",cat:"naehe",ev:1,w:"verantwortlichkeit",ue:"entschuldigung",
 t:"Was eine Entschuldigung ausmacht",
 x:"In Studien wurden Entschuldigungen besonders gut angenommen, wenn sie zwei Dinge enthielten: das klare Eingeständnis der eigenen Verantwortung und ein Angebot, den Schaden wiedergutzumachen. Erklärungen und Rechtfertigungen halfen deutlich weniger.",
 c:"Experimente mit vorgegebenen Entschuldigungstexten. Im echten Leben spielen Ton und Beziehung mit.",
 tip:"Beginne eine Entschuldigung mit „Das war mein Fehler“ und ende mit „Wie kann ich es wiedergutmachen?“.",
 src:"Lewicki, Polin & Lount (2016), Negotiation and Conflict Management Research",u:SCH("Lewicki Polin Lount 2016 an exploration of the structure of effective apologies")},
/* ---------- Miteinander ---------- */
{id:"kant",cat:"miteinander",ev:0,w:"wuerde",ue:"grenzewuerde",
 t:"Niemals bloß als Mittel",
 x:"Immanuel Kant formulierte, man solle die Menschheit, in der eigenen Person wie in jedem anderen, immer zugleich als Zweck und niemals bloß als Mittel gebrauchen. Daraus erwächst die Idee der Menschenwürde. Das Grundgesetz beginnt mit ihr: Die Würde des Menschen ist unantastbar.",
 c:"Grundlegender Gedanke der Ethik, der bis in die Verfassung reicht.",
 tip:"Prüfe eine Situation: Behandle ich gerade jemanden nur als Werkzeug für meine Zwecke?",
 src:"Kant (1785), Grundlegung zur Metaphysik der Sitten; Art. 1 Grundgesetz",u:SCH("Kant Grundlegung zur Metaphysik der Sitten Selbstzweckformel Menschenwürde")},
{id:"grauzone",cat:"miteinander",ev:0,w:"differenzierung",ue:"namen",
 t:"Die Grauzone",
 x:"Primo Levi, Überlebender von Auschwitz, beschrieb die Grauzone: Häftlinge, die vom System gezwungen oder verführt wurden, an der Gewalt gegen andere Häftlinge mitzuwirken. Levi warnte davor, sie vorschnell zu verurteilen oder freizusprechen. Er hielt an der Verantwortung fest und bestand zugleich darauf, die Bedingungen nicht zu vergessen, unter denen gehandelt wurde.",
 c:"Zeitzeugnis und philosophische Reflexion eines Überlebenden. Ein Schlüsseltext der Erinnerungskultur.",
 tip:"Wenn du über Schuld urteilst, frag zweimal: Was hat dieser Mensch getan? Und welche Wahl hatte er wirklich?",
 src:"Levi (1986), Die Untergegangenen und die Geretteten",u:SCH("Primo Levi die Untergegangenen und die Geretteten Grauzone")},
{id:"normalemaenner",cat:"miteinander",ev:2,w:"zivilcourage",ue:"zivilplan",
 t:"Ganz normale Männer",
 x:"Der Historiker Christopher Browning untersuchte ein Hamburger Polizeibataillon, das 1942 in Polen an Massenerschießungen beteiligt war. Der Kommandeur bot den Männern an, sich nicht zu beteiligen. Nur sehr wenige nahmen das Angebot an. Gruppendruck, Anpassung und Karrieredenken wogen schwerer als Gewissen. Die Täter waren keine Monster, sondern Durchschnittsbürger, und gerade das macht ihre Verantwortung so beklemmend.",
 c:"Gründliche historische Studie auf Basis von Vernehmungsprotokollen. Über die Gewichtung von Ideologie und Gruppendruck wird bis heute gestritten.",
 tip:"Frag dich in Gruppen: Würde ich hier mitmachen, wenn ich allein entscheiden müsste?",
 src:"Browning (1992), Ganz normale Männer",u:SCH("Browning 1992 ordinary men reserve police battalion 101")},
{id:"banalitaet",cat:"miteinander",ev:0,w:"muendigkeit",ue:"gegenseite",
 t:"Die Gefahr der Gedankenlosigkeit",
 x:"Hannah Arendt beobachtete 1961 den Prozess gegen Adolf Eichmann. Sie sprach von der Banalität des Bösen: Ungeheure Verbrechen könnten auch von Menschen begangen werden, die nicht dämonisch sind, sondern gedankenlos ihre Aufgaben erfüllen. Für Arendt war selbstständiges Denken deshalb eine moralische Fähigkeit.",
 c:"Einflussreiche philosophische Deutung. Spätere Forschung zeigte allerdings, dass Eichmann ein überzeugter Antisemit war. Der Gedanke bleibt trotzdem wichtig, das Beispiel ist umstritten.",
 tip:"Halte inne, wenn du sagst „Das ist halt meine Aufgabe“. Frag: Wozu trägt sie bei?",
 src:"Arendt (1963), Eichmann in Jerusalem; Stangneth (2011), Eichmann vor Jerusalem",u:SCH("Arendt Eichmann in Jerusalem Banalität des Bösen Stangneth Eichmann vor Jerusalem")},
{id:"gehorsam",cat:"miteinander",ev:2,w:"muendigkeit",ue:"widerspruch",
 t:"Gehorsam und Widerstand",
 x:"In Stanley Milgrams berühmten Experimenten folgten viele Menschen der Anweisung, einem anderen vermeintlich Stromstöße zu geben. Eine teilweise Wiederholung im Jahr 2009 fand ähnliche Raten. Weniger bekannt ist: Ein großer Teil widersetzte sich, und der Gehorsam sank stark, wenn jemand anderes im Raum widersprach.",
 c:"Viel wiederholt und viel kritisiert. Ob die Teilnehmer der Anordnung glaubten und warum sie gehorchten, wird bis heute diskutiert.",
 tip:"Merk dir: Ein einziger Mensch, der Nein sagt, macht es anderen leichter, ebenfalls Nein zu sagen.",
 src:"Milgram (1963); Burger (2009), American Psychologist",u:SCH("Burger 2009 replicating Milgram would people still obey today")},
{id:"retter",cat:"miteinander",ev:1,w:"solidaritaet",ue:"namen",
 t:"Was Retter auszeichnete",
 x:"Forscher befragten Menschen, die während des Holocaust Jüdinnen und Juden versteckt und gerettet hatten, und verglichen sie mit Menschen, die das nicht taten. Retter waren nicht reicher oder mutiger von Natur aus. Sie hatten aber häufiger Eltern, die Regeln erklärten statt sie nur durchzusetzen, und sie fühlten sich für einen weiten Kreis von Menschen verantwortlich.",
 c:"Große Befragungsstudie Jahrzehnte nach den Ereignissen. Erinnerungen können sich verändert haben, das Muster wurde aber auch anderswo beobachtet.",
 tip:"Erkläre einem Kind oder jüngeren Menschen nicht nur eine Regel, sondern warum sie dir wichtig ist.",
 src:"Oliner & Oliner (1988), The Altruistic Personality",u:SCH("Oliner Oliner 1988 the altruistic personality rescuers of Jews in Nazi Europe")},
{id:"zuschauer",cat:"miteinander",ev:3,w:"zivilcourage",ue:"zivilplan",
 t:"Meistens greift jemand ein",
 x:"Lange hieß es, je mehr Zuschauer, desto weniger hilft jemand. Bei gefährlichen Situationen ist dieser Effekt aber viel schwächer. Eine Auswertung von Videoaufnahmen echter Konflikte in drei Ländern zeigte: In etwa neun von zehn Fällen griff mindestens eine Person ein, und mehr Anwesende erhöhten die Chance auf Hilfe.",
 c:"Große Zusammenschau von Laborstudien und eine starke Studie mit echten Aufnahmen aus dem öffentlichen Raum.",
 tip:"Wenn du eingreifst, sprich gezielt eine weitere Person an: „Sie in der grünen Jacke, helfen Sie mir bitte.“",
 src:"Fischer et al. (2011), Psychological Bulletin; Philpot et al. (2020), American Psychologist",u:SCH("Philpot Liebst Levine Bernasco Lindegaard 2020 would I be helped cross-national CCTV footage shows that intervention is the norm in public conflicts")},
{id:"toleranzparadox",cat:"miteinander",ev:0,w:"toleranz",ue:"grenzewuerde",
 t:"Das Paradox der Toleranz",
 x:"Karl Popper gab zu bedenken: Wenn eine Gesellschaft unbegrenzt tolerant ist, auch gegenüber denen, die Toleranz abschaffen wollen, dann wird die Toleranz am Ende zerstört. Toleranz braucht daher eine Grenze dort, wo andere bedroht und entrechtet werden. Popper meinte dabei zuerst Argumente, nicht Verbote.",
 c:"Philosophischer Gedanke aus „Die offene Gesellschaft und ihre Feinde“. Wo genau die Grenze verläuft, ist bis heute umstritten.",
 tip:"Unterscheide: Diese Meinung stört mich. Oder: Diese Haltung will anderen die Würde absprechen.",
 src:"Popper (1945), Die offene Gesellschaft und ihre Feinde",u:SCH("Popper 1945 die offene Gesellschaft und ihre Feinde Paradox der Toleranz")},
{id:"kontakt",cat:"miteinander",ev:3,w:"toleranz",ue:"begegnung",
 t:"Begegnung baut Vorurteile ab",
 x:"Über 500 Studien zeigen: Wenn Menschen aus verschiedenen Gruppen miteinander zu tun haben, sinken Vorurteile. Am stärksten wirkt Kontakt auf Augenhöhe, mit gemeinsamen Zielen und mit Rückhalt von außen. Selbst Freundschaften über Ecken helfen schon.",
 c:"Eine der am besten belegten Erkenntnisse der Sozialpsychologie.",
 tip:"Such das Gespräch mit jemandem aus einer Gruppe, über die du bisher vor allem Meinungen hast.",
 src:"Pettigrew & Tropp (2006), Journal of Personality and Social Psychology",u:SCH("Pettigrew Tropp 2006 a meta-analytic test of intergroup contact theory")},
{id:"entmenschlichung",cat:"miteinander",ev:2,w:"wuerde",ue:"grenzewuerde",
 t:"Sprache, die entmenschlicht",
 x:"Wer andere als Ungeziefer, Flut oder Abschaum bezeichnet, senkt die Schwelle zur Gewalt. Die Forschung beschreibt, wie Menschen moralische Hemmungen abschalten: Sie beschönigen Taten, schieben Verantwortung ab und sprechen den Opfern das Menschsein ab. Entmenschlichende Sprache war ein Vorbote vieler Verbrechen.",
 c:"Gut gestützte Theorie mit vielen Studien. Wie direkt Sprache zu Taten führt, ist schwer zu messen.",
 tip:"Widersprich, wenn Menschen mit Tierwörtern oder Naturkatastrophen verglichen werden.",
 src:"Bandura (1999), Personality and Social Psychology Review; Haslam (2006)",u:SCH("Bandura 1999 moral disengagement in the perpetration of inhumanities")},
{id:"zornwaechter",cat:"miteinander",ev:0,w:"gewaltfreiheit",ue:"zornnotiz",
 t:"Zorn als Wächter",
 x:"Zorn über Unrecht ist kein Zeichen mangelnder Reife. Er zeigt, dass dir etwas wichtig ist, das verletzt wurde. Aristoteles hielt es für richtig, über das Richtige, gegenüber den Richtigen und im rechten Maß zornig zu sein. Zorn wird dann zur Kraft, wenn er eine Grenze setzt und den Menschen nicht aufgibt, statt in Hass umzuschlagen.",
 c:"Philosophische Deutung. Psychologisch gilt: Ärger kann zum Handeln motivieren, anhaltender Groll schadet eher.",
 tip:"Vervollständige: Mein Zorn zeigt mir, wie wichtig mir … ist.",
 src:"Aristoteles, Nikomachische Ethik, Buch IV",u:SCH("Aristoteles Zorn Sanftmut rechtes Maß Nikomachische Ethik")},
{id:"namen",cat:"miteinander",ev:0,w:"erinnerung",ue:"namen",
 t:"Jeder Name zählt",
 x:"Die Nationalsozialisten wollten Menschen nicht nur ermorden, sondern auch ihre Namen und Spuren auslöschen. Erinnerung setzt dagegen: Sie gibt den Ermordeten ihre Geschichten zurück, ihre Gesichter, ihre Hoffnungen und ihren Humor. So bekommen die Täter nicht das letzte Wort.",
 c:"Ein Grundgedanke der Gedenkkultur. Die Arolsen Archives laden mit dem Projekt #everynamecounts alle ein, Dokumente zu erfassen.",
 tip:"Lies die Geschichte eines einzelnen Menschen, etwa auf einem Stolperstein in deiner Nähe.",
 src:"Arolsen Archives, #everynamecounts",u:"https://arolsen-archives.org/"},
/* ---------- Welt ---------- */
{id:"jonas",cat:"welt",ev:0,w:"zukunftsverantwortung",ue:"brief2060",
 t:"Verantwortung für die, die noch nicht da sind",
 x:"Hans Jonas schrieb 1979, die Ethik müsse sich erweitern, weil unsere Technik weit in die Zukunft wirkt. Sein Grundsatz lautet sinngemäß: Handle so, dass die Wirkungen deines Handelns verträglich sind mit der Fortdauer echten menschlichen Lebens auf der Erde.",
 c:"Philosophischer Grundtext der Umweltethik, viel zitiert in der Nachhaltigkeitsdebatte.",
 tip:"Frag bei einer Entscheidung: Wer trägt die Folgen in dreißig Jahren?",
 src:"Jonas (1979), Das Prinzip Verantwortung",u:SCH("Hans Jonas 1979 das Prinzip Verantwortung")},
{id:"allmende",cat:"welt",ev:2,w:"teilen",ue:"genugwoche",
 t:"Gemeinsam verwalten funktioniert",
 x:"Lange galt: Was allen gehört, wird übernutzt. Die Ökonomin Elinor Ostrom zeigte an Fischgründen, Almen und Bewässerungssystemen, dass Gemeinschaften ihre Gemeingüter über Jahrhunderte erfolgreich pflegen können, wenn sie klare Regeln, Mitsprache und faire Kontrolle haben. Sie bekam dafür den Wirtschaftsnobelpreis.",
 c:"Viele Fallstudien weltweit. Die Bedingungen für Erfolg sind gut beschrieben, lassen sich aber nicht beliebig übertragen.",
 tip:"Schau, wo in deinem Umfeld etwas gemeinsam genutzt wird, und hilf mit, es zu pflegen.",
 src:"Ostrom (1990), Governing the Commons",u:SCH("Ostrom 1990 governing the commons the evolution of institutions for collective action")},
{id:"shiftingbaseline",cat:"welt",ev:2,w:"erinnerung",ue:"naturzeit",
 t:"Wir gewöhnen uns an das Weniger",
 x:"Jede Generation hält den Zustand der Natur, den sie in ihrer Kindheit erlebt hat, für normal. Was davor verloren ging, fällt nicht auf. Der Meeresbiologe Daniel Pauly nannte das die sich verschiebende Grundlinie. So kann die Natur über Generationen verarmen, ohne dass es jemand bemerkt.",
 c:"Zuerst für die Fischerei beschrieben, später in vielen Bereichen beobachtet.",
 tip:"Frag ältere Menschen, welche Tiere und Pflanzen sie als Kind in deiner Gegend gesehen haben.",
 src:"Pauly (1995), Trends in Ecology & Evolution",u:SCH("Pauly 1995 anecdotes and the shifting baseline syndrome of fisheries")},
{id:"einzeltat",cat:"welt",ev:1,w:"folgerichtigkeit",ue:"fussabdruck",
 t:"Eine gute Tat ist nicht genug",
 x:"Nach einer einzelnen Maßnahme gegen ein Risiko lassen Menschen oft weitere Schritte bleiben, als wäre die Sache damit erledigt. Wer Stofftaschen benutzt, fühlt sich vielleicht schon umweltbewusst genug und fliegt trotzdem häufig. Die Forschung spricht von der Neigung zur Einzelhandlung.",
 c:"Das Muster wurde in mehreren Studien beobachtet, aber nicht überall. Es ist eher ein Warnhinweis als ein Gesetz.",
 tip:"Such nach deinem größten Hebel, nicht nach dem bequemsten.",
 src:"Weber (1997), Climatic Change",u:SCH("Weber 1997 perception and expectation of climate change single action bias")},
{id:"wissentun",cat:"welt",ev:2,w:"folgerichtigkeit",ue:"genugwoche",
 t:"Wissen allein ändert wenig",
 x:"Umweltbewusstsein und Umweltverhalten hängen nur mäßig zusammen. Eine Zusammenschau zeigt, dass neben Einstellungen vor allem Gewohnheiten, Gelegenheiten, Kosten und das Verhalten der Mitmenschen entscheiden. Wer etwas ändern will, sollte deshalb Gewohnheiten und Umgebung ändern, nicht nur seine Überzeugung.",
 c:"Breite Datenlage aus vielen Studien.",
 tip:"Mach das Richtige zum Bequemen: Lege zum Beispiel die Einkaufstasche direkt an die Haustür.",
 src:"Bamberg & Möser (2007), Journal of Environmental Psychology",u:SCH("Bamberg Möser 2007 twenty years after Hines Hungerford Tomera new meta-analysis psycho-social determinants of pro-environmental behaviour")},
{id:"normen",cat:"welt",ev:3,w:"beteiligung",ue:"fussabdruck",
 t:"Was die Nachbarn tun, wirkt",
 x:"Ein Energieversorger schickte Millionen Haushalten Briefe, in denen ihr Stromverbrauch mit dem ähnlicher Nachbarn verglichen wurde. Die Haushalte sparten danach im Schnitt etwa zwei Prozent Strom, und das dauerhaft. Unser Verhalten orientiert sich stark daran, was andere tun.",
 c:"Sehr große Feldstudien mit echten Verbrauchsdaten. Der Effekt ist klein, aber verlässlich und günstig.",
 tip:"Erzähl anderen, was du für die Umwelt tust. Du veränderst damit, was in deinem Umfeld als normal gilt.",
 src:"Allcott (2011), Journal of Public Economics",u:SCH("Allcott 2011 social norms and energy conservation")},
{id:"gemeinsam",cat:"welt",ev:1,w:"solidaritaet",ue:"genugwoche",
 t:"Das Wir macht wirksam",
 x:"Viele Menschen fühlen sich angesichts der Klimakrise allein machtlos. Studien zeigen, dass das Gefühl, als Gruppe etwas bewirken zu können, umweltfreundliches Handeln stärker fördert als der Glaube an die eigene, einzelne Wirkung. Wer sich als Teil einer Bewegung erlebt, bleibt eher dran.",
 c:"Ein gut begründetes Modell mit vielen, aber oft kleinen Studien.",
 tip:"Such dir eine Gruppe, mit der du ein Umweltprojekt gemeinsam angehst, und sei es eine Tauschbörse im Haus.",
 src:"Fritsche, Barth, Jugert, Masson & Reese (2018), Psychological Review",u:SCH("Fritsche Barth Jugert Masson Reese 2018 a social identity model of pro-environmental action SIMPEA")},
{id:"fleischparadox",cat:"welt",ev:2,w:"ehrfurcht",ue:"naturzeit",
 t:"Tiere lieben und Tiere essen",
 x:"Viele Menschen mögen Tiere und essen trotzdem Fleisch. Um diesen Widerspruch auszuhalten, sprechen wir Nutztieren in Studien weniger Gefühle und Verstand zu, besonders kurz bevor wir sie essen. Die Forschung nennt das Fleischparadox.",
 c:"Mehrere Studien mit ähnlichem Ergebnis. Was jemand daraus folgert, bleibt eine persönliche Entscheidung.",
 tip:"Bemerk, wann du einen Widerspruch mit einer bequemen Ausrede zudeckst. Du musst ihn nicht sofort auflösen.",
 src:"Loughnan, Haslam & Bastian (2010), Appetite; Bastian & Loughnan (2017)",u:SCH("Loughnan Haslam Bastian 2010 the role of meat consumption in the denial of moral status and mind to meat animals")},
{id:"schweitzer",cat:"welt",ev:0,w:"ehrfurcht",ue:"naturzeit",
 t:"Leben inmitten von Leben",
 x:"Albert Schweitzer beschrieb den Kern seiner Ethik mit dem Satz: Ich bin Leben, das leben will, inmitten von Leben, das leben will. Daraus folgte für ihn Ehrfurcht vor allem Lebendigen. Er wusste, dass man nicht leben kann, ohne anderes Leben zu schädigen, aber er wollte, dass man es nie gedankenlos tut.",
 c:"Ethischer Grundgedanke des 20. Jahrhunderts, der die Tierethik stark geprägt hat.",
 tip:"Wenn du Leben schädigst, und sei es nur eine Pflanze, tu es bewusst und nicht nebenbei.",
 src:"Schweitzer (1923), Kultur und Ethik",u:SCH("Albert Schweitzer Ehrfurcht vor dem Leben Kultur und Ethik")},
{id:"vermaechtnis",cat:"welt",ev:1,w:"zukunftsverantwortung",ue:"brief2060",
 t:"Was du hinterlassen willst",
 x:"In Experimenten schrieben Menschen kurz darüber, wie sie von späteren Generationen erinnert werden möchten. Danach spendeten sie mehr für den Klimaschutz und sprachen sich stärker für ihn aus. Der Gedanke an das eigene Vermächtnis macht die ferne Zukunft persönlich.",
 c:"Mehrere Experimente einer Forschungsgruppe. Wie lange die Wirkung anhält, ist offen.",
 tip:"Frag dich: Wofür möchte ich, dass meine Enkel mich in Erinnerung behalten?",
 src:"Zaval, Markowitz & Weber (2015), Psychological Science",u:SCH("Zaval Markowitz Weber 2015 how will I be remembered conserving the environment for the sake of one's legacy")},
{id:"naturnaehe",cat:"welt",ev:2,w:"naturverbundenheit",ue:"naturzeit",
 t:"Wer sich verbunden fühlt, schützt",
 x:"Menschen, die sich der Natur verbunden fühlen, verhalten sich deutlich umweltfreundlicher. Das zeigt eine Zusammenschau aus über hundert Studien. Verbundenheit lässt sich üben: durch Zeit draußen, Aufmerksamkeit für Details und Staunen.",
 c:"Viele Studien, meist Befragungen. Die Richtung des Zusammenhangs ist nicht in allen Fällen geklärt.",
 tip:"Geh diese Woche einmal ohne Kopfhörer nach draußen und zähle, wie viele Vogelstimmen du hörst.",
 src:"Whitburn, Linklater & Abrahamse (2020), Conservation Biology",u:SCH("Whitburn Linklater Abrahamse 2020 meta-analysis of human connection to nature and proenvironmental behavior")},
{id:"grenzen",cat:"welt",ev:2,w:"genuegsamkeit",ue:"fussabdruck",
 t:"Die Belastungsgrenzen des Planeten",
 x:"Forscher haben neun Bereiche bestimmt, in denen die Erde stabil bleibt, solange bestimmte Grenzen nicht überschritten werden, etwa beim Klima, der Artenvielfalt oder dem Stickstoff. Nach ihrer Auswertung von 2023 sind sechs dieser neun Grenzen überschritten.",
 c:"Ein einflussreiches wissenschaftliches Rahmenwerk. Einzelne Grenzwerte und ihre Berechnung werden diskutiert.",
 tip:"Mach dir klar, dass Genug kein Verzicht aus Prinzip ist, sondern ein Maß, das die Erde vorgibt.",
 src:"Richardson et al. (2023), Science Advances",u:SCH("Richardson 2023 Earth beyond six of nine planetary boundaries")},
/* ---------- Urteil ---------- */
{id:"wiederholung",cat:"urteil",ev:3,w:"muendigkeit",ue:"querlesen",
 t:"Wiederholung macht glaubhaft",
 x:"Behauptungen, die wir schon einmal gehört haben, halten wir eher für wahr, selbst wenn wir es eigentlich besser wissen. Dieser Effekt ist seit Jahrzehnten bekannt und wirkt auch bei falschen Nachrichten. Wer Falsches oft wiederholt, macht es glaubwürdiger.",
 c:"Sehr gut belegt, in vielen Studien wiederholt.",
 tip:"Teile keine Falschmeldung, auch nicht, um dich über sie lustig zu machen. Teile lieber die richtige Information.",
 src:"Fazio, Brashier, Payne & Marsh (2015), Journal of Experimental Psychology: General",u:SCH("Fazio Brashier Payne Marsh 2015 knowledge does not protect against illusory truth")},
{id:"querlesen",cat:"urteil",ev:2,w:"muendigkeit",ue:"querlesen",
 t:"Profis lesen quer",
 x:"Forscher ließen Faktenprüfer, Geschichtsprofessoren und Studierende Webseiten beurteilen. Die Faktenprüfer waren am schnellsten und genauesten. Ihr Trick: Sie verließen die Seite sofort und schauten in neuen Tabs nach, wer dahintersteckt, statt die Seite selbst gründlich zu lesen.",
 c:"Mehrere Studien derselben Forschungsgruppe, inzwischen auch in Schulprogrammen erprobt.",
 tip:"Bevor du einer Quelle glaubst, such nach ihrem Namen und schau, was andere über sie sagen.",
 src:"Wineburg & McGrew (2019), Teachers College Record",u:SCH("Wineburg McGrew 2019 lateral reading and the nature of expertise reading less and learning more")},
{id:"deepfakes",cat:"urteil",ev:2,w:"demut",ue:"querlesen",
 t:"Fälschungen erkennen wir schlecht",
 x:"In Experimenten sollten Menschen echte Videos von gefälschten unterscheiden. Sie lagen kaum besser als beim Raten, hielten sich aber für sehr treffsicher. Gerade diese Selbstüberschätzung macht anfällig für Täuschung.",
 c:"Sorgfältige Experimente. Die Technik entwickelt sich schnell, das Problem dürfte eher größer geworden sein.",
 tip:"Verlass dich bei aufregenden Videos nicht auf dein Auge, sondern auf die Quelle.",
 src:"Köbis, Doležalová & Soraperra (2021), iScience",u:SCH("Köbis Dolezalova Soraperra 2021 fooled twice people cannot detect deepfakes but think they can")},
{id:"automationbias",cat:"urteil",ev:2,w:"muendigkeit",ue:"kipause",
 t:"Zu viel Vertrauen in Maschinen",
 x:"Wenn ein Computer eine Empfehlung gibt, folgen Menschen ihr oft auch dann, wenn ihre eigene Wahrnehmung dagegen spricht, und übersehen Fehler, die sie sonst bemerkt hätten. Das zeigte sich bei Piloten, in der Medizin und in vielen Laborstudien.",
 c:"Gut untersuchter Effekt mit vielen Studien. Wie stark er bei heutigen KI-Systemen ist, wird gerade erforscht.",
 tip:"Wenn eine KI dir etwas empfiehlt, frag: Wie würde ich entscheiden, wenn ich die Antwort nicht kennen würde?",
 src:"Parasuraman & Manzey (2010), Human Factors",u:SCH("Parasuraman Manzey 2010 complacency and bias in human use of automation an attentional integration")},
{id:"zustimmung",cat:"urteil",ev:2,w:"wahrhaftigkeit",ue:"kipause",
 t:"KI redet dir gern nach dem Mund",
 x:"Sprachmodelle wie Chatbots neigen dazu, Nutzern zuzustimmen, ihre Meinung zu bestätigen und sich bei Widerspruch zu korrigieren, auch wenn sie vorher recht hatten. Das liegt unter anderem daran, wie sie trainiert werden: Zustimmung wird von Menschen oft besser bewertet.",
 c:"Systematische Untersuchung mehrerer großer Sprachmodelle. Hersteller arbeiten daran, das Verhalten zu verringern.",
 tip:"Bitte eine KI ausdrücklich um die stärksten Gegenargumente zu deiner Meinung.",
 src:"Sharma et al. (2023), Towards Understanding Sycophancy in Language Models",u:SCH("Sharma 2023 towards understanding sycophancy in language models")},
{id:"auslagern",cat:"urteil",ev:1,w:"muendigkeit",ue:"kipause",
 t:"Denken auslagern hat einen Preis",
 x:"Wir lagern Gedächtnis und Denken gern aus: an Notizen, Suchmaschinen und inzwischen an KI. Das entlastet und ist oft klug. Studien deuten aber darauf hin, dass wir uns Ausgelagertes schlechter merken und eigene Fähigkeiten weniger trainieren.",
 c:"Ein lebendiges Forschungsfeld mit gemischten Ergebnissen. Klar ist: Es kommt darauf an, was man auslagert.",
 tip:"Lagere Fleißarbeit aus, aber denk Entscheidungen, die dir wichtig sind, selbst zu Ende.",
 src:"Risko & Gilbert (2016), Trends in Cognitive Sciences",u:SCH("Risko Gilbert 2016 cognitive offloading")},
{id:"sapereaude",cat:"urteil",ev:0,w:"muendigkeit",ue:"kipause",
 t:"Habe Mut, dich deines eigenen Verstandes zu bedienen",
 x:"Kant beschrieb Aufklärung als Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit. Unmündig sei, wer sich seines Verstandes nicht ohne Leitung eines anderen bedient, nicht aus Mangel an Verstand, sondern aus Mangel an Mut. Der Satz klingt heute, im Zeitalter der Algorithmen, aktueller denn je.",
 c:"Philosophischer Klassiker von 1784.",
 tip:"Bilde dir zu einer Frage zuerst selbst eine Meinung, bevor du nachschaust, was andere denken.",
 src:"Kant (1784), Beantwortung der Frage: Was ist Aufklärung?",u:SCH("Kant 1784 Beantwortung der Frage was ist Aufklärung")},
{id:"intdemut",cat:"urteil",ev:1,w:"demut",ue:"gegenseite",
 t:"Wer sich irren kann, urteilt besser",
 x:"Menschen mit intellektueller Demut, also der Bereitschaft, eigene Irrtümer für möglich zu halten, prüfen Argumente sorgfältiger. Sie unterscheiden besser zwischen starken und schwachen Belegen und urteilen weniger hart über Andersdenkende.",
 c:"Ein junges Forschungsfeld mit vielversprechenden, aber noch nicht abschließenden Ergebnissen.",
 tip:"Sag in einer Diskussion einmal bewusst: Das wusste ich nicht, danke.",
 src:"Leary et al. (2017), Personality and Social Psychology Bulletin",u:SCH("Leary Diebels Davisson 2017 cognitive and interpersonal features of intellectual humility")},
{id:"gegenteil",cat:"urteil",ev:2,w:"fairness",ue:"gegenseite",
 t:"Das Gegenteil bedenken",

{id:"harmonie",cat:"urteil",ev:0,w:"toleranz",ue:"gegenseite",
 t:"Harmonie heißt nicht, alles Störende zu beseitigen",
