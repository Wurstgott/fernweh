{id:"vergebungwirkt",cat:"naehe",ev:2,w:"vergebung",ue:"vergebungsbrief",
 t:"Vergeben entlastet vor allem dich",
 x:"Eine Zusammenschau von über fünfzig Studien zeigt: Menschen, die angeleitet an Vergebung arbeiteten, berichteten danach weniger Wut, weniger Niedergeschlagenheit und mehr Hoffnung. Je länger sie sich damit beschäftigten, desto stärker war die Wirkung.",
 c:"Solide Datenlage aus vielen Studien. Gemessen wurde meist mit Fragebögen.",
 tip:"Vergeben musst du nicht sofort. Fang damit an, die Kränkung aufzuschreiben, ohne sie zu bewerten.",
 src:"Wade, Hoyt, Kidwell & Worthington (2014), Journal of Consulting and Clinical Psychology",u:SCH("Wade Hoyt Kidwell Worthington 2014 efficacy of psychotherapeutic interventions to promote forgiveness meta-analysis")},
{id:"vergebennicht",cat:"naehe",ev:0,w:"vergebung",ue:"vergebungsbrief",
 t:"Verstehen ist nicht Verzeihen",
 x:"Vergeben heißt nicht, das Unrecht gutzuheißen, es zu vergessen oder sich zu versöhnen. Man kann einem Menschen vergeben und trotzdem Abstand halten. Und man kann verstehen wollen, wie es zu einer Tat kam, ohne sie zu entschuldigen. Niemand ist verpflichtet zu vergeben, schon gar nicht stellvertretend für andere.",
 c:"Eine Unterscheidung, die in der Vergebungsforschung und in der Ethik breit geteilt wird.",
 tip:"Trenne drei Fragen: Will ich verstehen? Will ich vergeben? Will ich wieder Nähe?",
 src:"Enright & Fitzgibbons (2015), Forgiveness Therapy",u:SCH("Enright forgiveness is not reconciliation condoning forgetting")},
{id:"gutenachrichten",cat:"naehe",ev:2,w:"zuwendung",ue:"zuhoeren",
 t:"Wie du auf Gutes reagierst, zählt",
 x:"Beziehungen hängen nicht nur davon ab, wie man in Krisen füreinander da ist. Mindestens genauso wichtig ist, wie man reagiert, wenn der andere etwas Schönes erzählt. Echtes, interessiertes Mitfreuen stärkt die Bindung messbar, ein beiläufiges „Schön für dich“ dagegen kaum.",
 c:"Mehrere Studien mit Paaren und Freunden, auch mit Beobachtungen im Labor.",
 tip:"Wenn jemand dir eine gute Nachricht erzählt, stell eine echte Nachfrage dazu.",
 src:"Gable, Reis, Impett & Asher (2004), Journal of Personality and Social Psychology",u:SCH("Gable Reis Impett Asher 2004 what do you do when things go right capitalization")},
{id:"verachtung",cat:"naehe",ev:1,w:"wuerde",ue:"grenzewuerde",
 t:"Verachtung zerstört mehr als Streit",
 x:"Streit gehört zu jeder engen Beziehung. Gefährlich wird es, wenn Verachtung dazukommt: Spott, Augenrollen, Herabsetzung der ganzen Person. In Beobachtungsstudien mit Paaren galt Verachtung als einer der deutlichsten Hinweise auf spätere Trennungen.",
 c:"Die Grundidee ist gut gestützt, populäre Zahlen zur Trefferquote sind aber übertrieben.",
 tip:"Kritisiere im Streit ein Verhalten, nicht den ganzen Menschen.",
 src:"Gottman & Levenson (2000), Journal of Marriage and Family",u:SCH("Gottman Levenson 2000 the timing of divorce predicting when a couple will divorce contempt")},
{id:"feedbackwunsch",cat:"naehe",ev:1,w:"wahrhaftigkeit",ue:"ehrlichesfeedback",
 t:"Andere wollen ehrliche Hinweise öfter als gedacht",
 x:"Ein Fleck auf dem Hemd, Spinat zwischen den Zähnen, ein Fehler im Vortrag: Viele sagen lieber nichts, um niemanden zu beschämen. In Studien unterschätzten Menschen deutlich, wie gern andere solche Hinweise bekommen hätten.",
 c:"Mehrere Experimente einer Forschungsgruppe mit einheitlichem Ergebnis. Bei sehr persönlichen Themen kann es anders aussehen.",
 tip:"Wenn du zögerst, einen hilfreichen Hinweis zu geben, frag dich: Würde ich es an seiner Stelle wissen wollen?",
 src:"Abi-Esber, Abel, Schroeder & Gino (2022), Journal of Personality and Social Psychology",u:SCH("Abi-Esber Abel Schroeder Gino 2022 just letting you know underestimating others desire for constructive feedback")},
{id:"notluege",cat:"naehe",ev:1,w:"wahrhaftigkeit",ue:"ehrlichesfeedback",
 t:"Freundliche Lügen gelten oft als moralisch",
 x:"Wenn jemand lügt, um einen anderen zu schonen, halten Beobachter ihn in Studien oft für moralischer als jemanden, der eine verletzende Wahrheit sagt. Wohlwollen wiegt also manchmal schwerer als Ehrlichkeit. Die Spannung zwischen Wahrheit und Taktgefühl ist uralt und lässt sich nicht mit einer Regel lösen.",
 c:"Mehrere Experimente mit ähnlichem Ergebnis. Langfristige Folgen für Beziehungen sind wenig untersucht.",
 tip:"Prüf bei einer Notlüge: Schütze ich den anderen oder mich selbst vor einem unangenehmen Moment?",
 src:"Levine & Schweitzer (2014), Journal of Experimental Social Psychology",u:SCH("Levine Schweitzer 2014 are liars ethical on the tension between benevolence and honesty")},
{id:"ichdu",cat:"naehe",ev:0,w:"zuwendung",ue:"zuhoeren",
 t:"Begegnung statt Benutzung",
 x:"Martin Buber unterschied zwei Grundhaltungen: In der Ich-Es-Haltung behandeln wir andere als Mittel, als Rolle oder Funktion. In der Ich-Du-Haltung begegnen wir ihnen als ganzen Menschen. Beides gehört zum Leben, aber nur in der zweiten entsteht echte Beziehung.",
 c:"Philosophischer Klassiker des 20. Jahrhunderts.",
 tip:"Sprich heute mit jemandem, den du sonst nur in seiner Funktion siehst, etwa an der Kasse, über etwas Persönliches.",
 src:"Buber (1923), Ich und Du",u:SCH("Martin Buber Ich und Du 1923")},
{id:"vertrauenlohnt",cat:"naehe",ev:2,w:"vertrauen",ue:"zuhoeren",
 t:"Wir unterschätzen, wie vertrauenswürdig andere sind",
 x:"In Vertrauensspielen mit echtem Geld trauten Menschen Fremden deutlich weniger zu, als diese dann tatsächlich zurückgaben. Wer misstraut, erfährt allerdings nie, dass er falschlag. So bestätigt sich Misstrauen selbst, während Vertrauen die Chance bekommt, belohnt zu werden.",
 c:"Mehrere Experimente mit einheitlichem Muster. Im Alltag hängt viel von der Lage ab.",
 tip:"Gib einem Menschen, bei dem du unsicher bist, einen kleinen Vertrauensvorschuss und schau, was passiert.",
 src:"Fetchenhauer & Dunning (2010), Psychological Science",u:SCH("Fetchenhauer Dunning 2010 why so cynical asymmetric feedback underlies misguided skepticism regarding the trustworthiness of others")},
{id:"widerspruch",cat:"naehe",ev:0,w:"loyalitaet",ue:"widerspruch",
 t:"Loyal sein heißt manchmal widersprechen",
 x:"Der Ökonom Albert Hirschman beschrieb, wie Menschen auf Missstände in einer Gemeinschaft reagieren: Sie gehen, oder sie erheben ihre Stimme. Loyalität entscheidet oft, ob jemand bleibt und sich einsetzt. Wer schweigt, um Frieden zu wahren, ist deshalb nicht unbedingt loyaler als jemand, der offen widerspricht.",
 c:"Einflussreiches Denkmodell aus der Ökonomie, auf Freundschaften übertragen.",
 tip:"Sag einem Freund, wo du anderer Meinung bist, gerade weil er dir wichtig ist.",
 src:"Hirschman (1970), Exit, Voice, and Loyalty",u:SCH("Hirschman 1970 exit voice and loyalty")},
{id:"dankbindet",cat:"naehe",ev:2,w:"dankbarkeit",ue:"zuhoeren",
 t:"Dank verbindet",
 x:"Dankbarkeit lenkt den Blick auf Menschen, die einem guttun, und bringt einen näher zu ihnen. In Studien mit Paaren führte ausgedrückter Dank dazu, dass sich beide verbundener fühlten und mehr in die Beziehung investierten.",
 c:"Mehrere Studien, vor allem mit Paaren und Mitbewohnern. Die Effekte sind mittelgroß.",
 tip:"Danke heute jemandem für etwas Konkretes, das er nicht tun musste.",
 src:"Algoe (2012), Social and Personality Psychology Compass",u:SCH("Algoe 2012 find remind and bind the functions of gratitude in everyday relationships")},
{id:"entschuldigung",cat:"naehe",ev:1,w:"verantwortlichkeit",ue:"entschuldigung",
 t:"Was eine Entschuldigung ausmacht",
 x:"In Studien wurden Entschuldigungen besonders gut angenommen, wenn sie zwei Dinge enthielten: das klare Eingeständnis der eigenen Verantwortung und ein Angebot, den Schaden wiedergutzumachen. Erklärungen und Rechtfertigungen halfen deutlich weniger.",
 c:"Experimente mit vorgegebenen Entschuldigungstexten. Im echten Leben spielen Ton und Beziehung mit.",
 tip:"Beginne eine Entschuldigung mit „Das war mein Fehler“ und ende mit „Wie kann ich es wiedergutmachen?“.",
 src:"Lewicki, Polin & Lount (2016), Negotiation and Conflict Management Research",u:SCH("Lewicki Polin Lount 2016 an exploration of the structure of effective apologies")},
/* ---------- Miteinander ---------- */
{id:"kant",cat:"miteinander",ev:0,w:"wuerde",ue:"grenzewuerde",
 t:"Niemals bloß als Mittel",
 x:"Immanuel Kant formulierte, man solle die Menschheit, in der eigenen Person wie in jedem anderen, immer zugleich als Zweck und niemals bloß als Mittel gebrauchen. Daraus erwächst die Idee der Menschenwürde. Das Grundgesetz beginnt mit ihr: Die Würde des Menschen ist unantastbar.",
 c:"Grundlegender Gedanke der Ethik, der bis in die Verfassung reicht.",
 tip:"Prüfe eine Situation: Behandle ich gerade jemanden nur als Werkzeug für meine Zwecke?",
 src:"Kant (1785), Grundlegung zur Metaphysik der Sitten; Art. 1 Grundgesetz",u:SCH("Kant Grundlegung zur Metaphysik der Sitten Selbstzweckformel Menschenwürde")},
{id:"grauzone",cat:"miteinander",ev:0,w:"differenzierung",ue:"namen",
 t:"Die Grauzone",
 x:"Primo Levi, Überlebender von Auschwitz, beschrieb die Grauzone: Häftlinge, die vom System gezwungen oder verführt wurden, an der Gewalt gegen andere Häftlinge mitzuwirken. Levi warnte davor, sie vorschnell zu verurteilen oder freizusprechen. Er hielt an der Verantwortung fest und bestand zugleich darauf, die Bedingungen nicht zu vergessen, unter denen gehandelt wurde.",
 c:"Zeitzeugnis und philosophische Reflexion eines Überlebenden. Ein Schlüsseltext der Erinnerungskultur.",
 tip:"Wenn du über Schuld urteilst, frag zweimal: Was hat dieser Mensch getan? Und welche Wahl hatte er wirklich?",
 src:"Levi (1986), Die Untergegangenen und die Geretteten",u:SCH("Primo Levi die Untergegangenen und die Geretteten Grauzone")},
{id:"normalemaenner",cat:"miteinander",ev:2,w:"zivilcourage",ue:"zivilplan",
 t:"Ganz normale Männer",
 x:"Der Historiker Christopher Browning untersuchte ein Hamburger Polizeibataillon, das 1942 in Polen an Massenerschießungen beteiligt war. Der Kommandeur bot den Männern an, sich nicht zu beteiligen. Nur sehr wenige nahmen das Angebot an. Gruppendruck, Anpassung und Karrieredenken wogen schwerer als Gewissen. Die Täter waren keine Monster, sondern Durchschnittsbürger, und gerade das macht ihre Verantwortung so beklemmend.",
 c:"Gründliche historische Studie auf Basis von Vernehmungsprotokollen. Über die Gewichtung von Ideologie und Gruppendruck wird bis heute gestritten.",
 tip:"Frag dich in Gruppen: Würde ich hier mitmachen, wenn ich allein entscheiden müsste?",
 src:"Browning (1992), Ganz normale Männer",u:SCH("Browning 1992 ordinary men reserve police battalion 101")},
{id:"banalitaet",cat:"miteinander",ev:0,w:"muendigkeit",ue:"gegenseite",
 t:"Die Gefahr der Gedankenlosigkeit",
 x:"Hannah Arendt beobachtete 1961 den Prozess gegen Adolf Eichmann. Sie sprach von der Banalität des Bösen: Ungeheure Verbrechen könnten auch von Menschen begangen werden, die nicht dämonisch sind, sondern gedankenlos ihre Aufgaben erfüllen. Für Arendt war selbstständiges Denken deshalb eine moralische Fähigkeit.",
 c:"Einflussreiche philosophische Deutung. Spätere Forschung zeigte allerdings, dass Eichmann ein überzeugter Antisemit war. Der Gedanke bleibt trotzdem wichtig, das Beispiel ist umstritten.",
 tip:"Halte inne, wenn du sagst „Das ist halt meine Aufgabe“. Frag: Wozu trägt sie bei?",
 src:"Arendt (1963), Eichmann in Jerusalem; Stangneth (2011), Eichmann vor Jerusalem",u:SCH("Arendt Eichmann in Jerusalem Banalität des Bösen Stangneth Eichmann vor Jerusalem")},
{id:"gehorsam",cat:"miteinander",ev:2,w:"muendigkeit",ue:"widerspruch",
 t:"Gehorsam und Widerstand",
 x:"In Stanley Milgrams berühmten Experimenten folgten viele Menschen der Anweisung, einem anderen vermeintlich Stromstöße zu geben. Eine teilweise Wiederholung im Jahr 2009 fand ähnliche Raten. Weniger bekannt ist: Ein großer Teil widersetzte sich, und der Gehorsam sank stark, wenn jemand anderes im Raum widersprach.",
 c:"Viel wiederholt und viel kritisiert. Ob die Teilnehmer die Stromstöße für echt hielten und warum sie gehorchten, wird bis heute diskutiert.",
 tip:"Merk dir: Ein einziger Mensch, der Nein sagt, macht es anderen leichter, ebenfalls Nein zu sagen.",
 src:"Milgram (1963); Burger (2009), American Psychologist",u:SCH("Burger 2009 replicating Milgram would people still obey today")},
{id:"retter",cat:"miteinander",ev:1,w:"solidaritaet",ue:"namen",
 t:"Was Retter auszeichnete",
 x:"Forscher befragten Menschen, die während des Holocaust Jüdinnen und Juden versteckt und gerettet hatten, und verglichen sie mit Menschen, die das nicht taten. Retter waren nicht reicher oder mutiger von Natur aus. Sie hatten aber häufiger Eltern, die Regeln erklärten statt sie nur durchzusetzen, und sie fühlten sich für einen weiten Kreis von Menschen verantwortlich.",
 c:"Große Befragungsstudie Jahrzehnte nach den Ereignissen. Erinnerungen können sich verändert haben, das Muster wurde aber auch anderswo beobachtet.",
 tip:"Erkläre einem Kind oder jüngeren Menschen nicht nur eine Regel, sondern warum sie dir wichtig ist.",
 src:"Oliner & Oliner (1988), The Altruistic Personality",u:SCH("Oliner Oliner 1988 the altruistic personality rescuers of Jews in Nazi Europe")},
{id:"zuschauer",cat:"miteinander",ev:3,w:"zivilcourage",ue:"zivilplan",
 t:"Meistens greift jemand ein",
 x:"Lange hieß es, je mehr Zuschauer, desto weniger hilft jemand. Bei gefährlichen Situationen ist dieser Effekt aber viel schwächer. Eine Auswertung von Videoaufnahmen echter Konflikte in drei Ländern zeigte: In etwa neun von zehn Fällen griff mindestens eine Person ein, und mehr Anwesende erhöhten die Chance auf Hilfe.",
 c:"Große Zusammenschau von Laborstudien und eine starke Studie mit echten Aufnahmen aus dem öffentlichen Raum.",
 tip:"Wenn du eingreifst, sprich gezielt eine weitere Person an: „Sie in der grünen Jacke, helfen Sie mir bitte.“",
 src:"Fischer et al. (2011), Psychological Bulletin; Philpot et al. (2020), American Psychologist",u:SCH("Philpot Liebst Levine Bernasco Lindegaard 2020 would I be helped cross-national CCTV footage shows that intervention is the norm in public conflicts")},
{id:"toleranzparadox",cat:"miteinander",ev:0,w:"toleranz",ue:"grenzewuerde",
 t:"Das Paradox der Toleranz",
 x:"Karl Popper gab zu bedenken: Wenn eine Gesellschaft unbegrenzt tolerant ist, auch gegenüber denen, die Toleranz abschaffen wollen, dann wird die Toleranz am Ende zerstört. Toleranz braucht daher eine Grenze dort, wo andere bedroht und entrechtet werden. Popper meinte dabei zuerst Argumente, nicht Verbote.",
 c:"Philosophischer Gedanke aus „Die offene Gesellschaft und ihre Feinde“. Wo genau die Grenze verläuft, ist bis heute umstritten.",
 tip:"Unterscheide: Diese Meinung stört mich. Oder: Diese Haltung will anderen die Würde absprechen.",
 src:"Popper (1945), Die offene Gesellschaft und ihre Feinde",u:SCH("Popper 1945 die offene Gesellschaft und ihre Feinde Paradox der Toleranz")},
{id:"kontakt",cat:"miteinander",ev:3,w:"toleranz",ue:"begegnung",
 t:"Begegnung baut Vorurteile ab",
 x:"Über 500 Studien zeigen: Wenn Menschen aus verschiedenen Gruppen miteinander zu tun haben, sinken Vorurteile. Am stärksten wirkt Kontakt auf Augenhöhe, mit gemeinsamen Zielen und mit Rückhalt von außen. Es hilft sogar schon, wenn nur ein Freund jemanden aus der anderen Gruppe kennt.",
 c:"Eine der am besten belegten Erkenntnisse der Sozialpsychologie.",
 tip:"Such das Gespräch mit jemandem aus einer Gruppe, über die du bisher vor allem Meinungen hast.",
 src:"Pettigrew & Tropp (2006), Journal of Personality and Social Psychology",u:SCH("Pettigrew Tropp 2006 a meta-analytic test of intergroup contact theory")},
{id:"entmenschlichung",cat:"miteinander",ev:2,w:"wuerde",ue:"grenzewuerde",
 t:"Sprache, die entmenschlicht",
 x:"Wer andere als Ungeziefer, Flut oder Abschaum bezeichnet, senkt die Schwelle zur Gewalt. Die Forschung beschreibt, wie Menschen moralische Hemmungen abschalten: Sie beschönigen Taten, schieben Verantwortung ab und sprechen den Opfern das Menschsein ab. Entmenschlichende Sprache war ein Vorbote vieler Verbrechen.",
 c:"Gut gestützte Theorie mit vielen Studien. Wie direkt Sprache zu Taten führt, ist schwer zu messen.",
 tip:"Widersprich, wenn Menschen mit Tierwörtern oder Naturkatastrophen verglichen werden.",
 src:"Bandura (1999); Haslam (2006), beide Personality and Social Psychology Review",u:SCH("Bandura 1999 moral disengagement in the perpetration of inhumanities")},
{id:"zornwaechter",cat:"miteinander",ev:0,w:"gewaltfreiheit",ue:"zornnotiz",
 t:"Zorn als Wächter",
 x:"Zorn über Unrecht ist kein Zeichen mangelnder Reife. Er zeigt, dass dir etwas wichtig ist, das verletzt wurde. Aristoteles hielt es für richtig, über das Richtige, gegenüber den Richtigen und im rechten Maß zornig zu sein. Zorn wird dann zur Kraft, wenn er eine Grenze setzt und den Menschen nicht aufgibt, statt in Hass umzuschlagen.",
 c:"Philosophische Deutung. Psychologisch gilt: Ärger kann zum Handeln motivieren, anhaltender Groll schadet eher.",
 tip:"Vervollständige: Mein Zorn zeigt mir, wie wichtig mir … ist.",
 src:"Aristoteles, Nikomachische Ethik, Buch IV",u:SCH("Aristoteles Zorn Sanftmut rechtes Maß Nikomachische Ethik")},
{id:"namen",cat:"miteinander",ev:0,w:"erinnerung",ue:"namen",
 t:"Jeder Name zählt",
 x:"Die Nationalsozialisten wollten Menschen nicht nur ermorden, sondern auch ihre Namen und Spuren auslöschen. Erinnerung setzt dagegen: Sie gibt den Ermordeten ihre Geschichten zurück, ihre Gesichter, ihre Hoffnungen und ihren Humor. So bekommen die Täter nicht das letzte Wort.",
 c:"Ein Grundgedanke der Gedenkkultur. Die Arolsen Archives laden mit dem Projekt #everynamecounts alle ein, Dokumente zu erfassen.",
 tip:"Lies die Geschichte eines einzelnen Menschen, etwa auf einem Stolperstein in deiner Nähe.",
 src:"Arolsen Archives, #everynamecounts",u:"https://arolsen-archives.org/"},
/* ---------- Welt ---------- */
{id:"jonas",cat:"welt",ev:0,w:"zukunftsverantwortung",ue:"brief2060",
 t:"Verantwortung für die, die noch nicht da sind",
 x:"Hans Jonas schrieb 1979, die Ethik müsse sich erweitern, weil unsere Technik weit in die Zukunft wirkt. Sein Grundsatz lautet sinngemäß: Handle so, dass die Wirkungen deines Handelns verträglich sind mit der Fortdauer echten menschlichen Lebens auf der Erde.",
 c:"Philosophischer Grundtext der Umweltethik, viel zitiert in der Nachhaltigkeitsdebatte.",
 tip:"Frag bei einer Entscheidung: Wer trägt die Folgen in dreißig Jahren?",
 src:"Jonas (1979), Das Prinzip Verantwortung",u:SCH("Hans Jonas 1979 das Prinzip Verantwortung")},
{id:"allmende",cat:"welt",ev:2,w:"teilen",ue:"genugwoche",
 t:"Gemeinsam verwalten funktioniert",
 x:"Lange galt: Was allen gehört, wird übernutzt. Die Ökonomin Elinor Ostrom zeigte an Fischgründen, Almen und Bewässerungssystemen, dass Gemeinschaften ihre Gemeingüter über Jahrhunderte erfolgreich pflegen können, wenn sie klare Regeln, Mitsprache und faire Kontrolle haben. Sie bekam dafür den Wirtschaftsnobelpreis.",
 c:"Viele Fallstudien weltweit. Die Bedingungen für Erfolg sind gut beschrieben, lassen sich aber nicht beliebig übertragen.",
 tip:"Schau, wo in deinem Umfeld etwas gemeinsam genutzt wird, und hilf mit, es zu pflegen.",
 src:"Ostrom (1990), Governing the Commons",u:SCH("Ostrom 1990 governing the commons the evolution of institutions for collective action")},
{id:"shiftingbaseline",cat:"welt",ev:2,w:"erinnerung",ue:"naturzeit",
 t:"Wir gewöhnen uns an das Weniger",
 x:"Jede Generation hält den Zustand der Natur, den sie in ihrer Kindheit erlebt hat, für normal. Was davor verloren ging, fällt nicht auf. Der Meeresbiologe Daniel Pauly nannte das die sich verschiebende Grundlinie. So kann die Natur über Generationen verarmen, ohne dass es jemand bemerkt.",
 c:"Zuerst für die Fischerei beschrieben, später in vielen Bereichen beobachtet.",
 tip:"Frag ältere Menschen, welche Tiere und Pflanzen sie als Kind in deiner Gegend gesehen haben.",
 src:"Pauly (1995), Trends in Ecology & Evolution",u:SCH("Pauly 1995 anecdotes and the shifting baseline syndrome of fisheries")},
{id:"einzeltat",cat:"welt",ev:1,w:"folgerichtigkeit",ue:"fussabdruck",
 t:"Eine gute Tat ist nicht genug",
 x:"Nach einer einzelnen Maßnahme gegen ein Risiko lassen Menschen oft weitere Schritte bleiben, als wäre die Sache damit erledigt. Wer Stofftaschen benutzt, fühlt sich vielleicht schon umweltbewusst genug und fliegt trotzdem häufig. Die Forschung spricht von der Neigung zur Einzelhandlung.",
 c:"Das Muster wurde in mehreren Studien beobachtet, aber nicht überall. Es ist eher ein Warnhinweis als ein Gesetz.",
 tip:"Such nach deinem größten Hebel, nicht nach dem bequemsten.",
 src:"Weber (1997), Climatic Change",u:SCH("Weber 1997 perception and expectation of climate change single action bias")},
{id:"wissentun",cat:"welt",ev:2,w:"folgerichtigkeit",ue:"genugwoche",
 t:"Wissen allein ändert wenig",
 x:"Umweltbewusstsein und Umweltverhalten hängen nur mäßig zusammen. Eine Zusammenschau zeigt, dass neben Einstellungen vor allem Gewohnheiten, Gelegenheiten, Kosten und das Verhalten der Mitmenschen entscheiden. Wer etwas ändern will, sollte deshalb Gewohnheiten und Umgebung ändern, nicht nur seine Überzeugung.",
 c:"Breite Datenlage aus vielen Studien.",
 tip:"Mach das Richtige zum Bequemen: Lege zum Beispiel die Einkaufstasche direkt an die Haustür.",
 src:"Bamberg & Möser (2007), Journal of Environmental Psychology",u:SCH("Bamberg Möser 2007 twenty years after Hines Hungerford Tomera new meta-analysis psycho-social determinants of pro-environmental behaviour")},
{id:"normen",cat:"welt",ev:3,w:"beteiligung",ue:"fussabdruck",
 t:"Was die Nachbarn tun, wirkt",
 x:"Ein Energieversorger schickte Millionen Haushalten Briefe, in denen ihr Stromverbrauch mit dem ähnlicher Nachbarn verglichen wurde. Die Haushalte sparten danach im Schnitt etwa zwei Prozent Strom, und das dauerhaft. Unser Verhalten orientiert sich stark daran, was andere tun.",
 c:"Sehr große Feldstudien mit echten Verbrauchsdaten. Der Effekt ist klein, aber verlässlich und günstig.",
 tip:"Erzähl anderen, was du für die Umwelt tust. Du veränderst damit, was in deinem Umfeld als normal gilt.",
 src:"Allcott (2011), Journal of Public Economics",u:SCH("Allcott 2011 social norms and energy conservation")},
{id:"gemeinsam",cat:"welt",ev:1,w:"solidaritaet",ue:"genugwoche",
 t:"Das Wir macht wirksam",
 x:"Viele Menschen fühlen sich angesichts der Klimakrise allein machtlos. Studien zeigen, dass das Gefühl, als Gruppe etwas bewirken zu können, umweltfreundliches Handeln stärker fördert als der Glaube an die eigene, einzelne Wirkung. Wer sich als Teil einer Bewegung erlebt, bleibt eher dran.",
 c:"Ein gut begründetes Modell mit vielen, aber oft kleinen Studien.",
 tip:"Such dir eine Gruppe, mit der du ein Umweltprojekt gemeinsam angehst, und sei es eine Tauschbörse im Haus.",
 src:"Fritsche, Barth, Jugert, Masson & Reese (2018), Psychological Review",u:SCH("Fritsche Barth Jugert Masson Reese 2018 a social identity model of pro-environmental action SIMPEA")},
{id:"fleischparadox",cat:"welt",ev:2,w:"ehrfurcht",ue:"naturzeit",
 t:"Tiere lieben und Tiere essen",
 x:"Viele Menschen mögen Tiere und essen trotzdem Fleisch. Um diesen Widerspruch auszuhalten, sprechen wir Nutztieren in Studien weniger Gefühle und Verstand zu, besonders kurz bevor wir sie essen. Die Forschung nennt das Fleischparadox.",
 c:"Mehrere Studien mit ähnlichem Ergebnis. Was jemand daraus folgert, bleibt eine persönliche Entscheidung.",
 tip:"Bemerk, wann du einen Widerspruch mit einer bequemen Ausrede zudeckst. Du musst ihn nicht sofort auflösen.",
 src:"Loughnan, Haslam & Bastian (2010), Appetite; Bastian & Loughnan (2017)",u:SCH("Loughnan Haslam Bastian 2010 the role of meat consumption in the denial of moral status and mind to meat animals")},
{id:"schweitzer",cat:"welt",ev:0,w:"ehrfurcht",ue:"naturzeit",
 t:"Leben inmitten von Leben",
 x:"Albert Schweitzer beschrieb den Kern seiner Ethik mit dem Satz: Ich bin Leben, das leben will, inmitten von Leben, das leben will. Daraus folgte für ihn Ehrfurcht vor allem Lebendigen. Er wusste, dass man nicht leben kann, ohne anderes Leben zu schädigen, aber er wollte, dass man es nie gedankenlos tut.",
 c:"Ethischer Grundgedanke des 20. Jahrhunderts, der die Tierethik stark geprägt hat.",
 tip:"Wenn du Leben schädigst, und sei es nur eine Pflanze, tu es bewusst und nicht nebenbei.",
 src:"Schweitzer (1923), Kultur und Ethik",u:SCH("Albert Schweitzer Ehrfurcht vor dem Leben Kultur und Ethik")},
{id:"vermaechtnis",cat:"welt",ev:1,w:"zukunftsverantwortung",ue:"brief2060",
 t:"Was du hinterlassen willst",
 x:"In Experimenten schrieben Menschen kurz darüber, wie sie von späteren Generationen erinnert werden möchten. Danach spendeten sie mehr für den Klimaschutz und sprachen sich stärker für ihn aus. Der Gedanke an das eigene Vermächtnis macht die ferne Zukunft persönlich.",
 c:"Mehrere Experimente einer Forschungsgruppe. Wie lange die Wirkung anhält, ist offen.",
 tip:"Frag dich: Wofür möchte ich, dass meine Enkel mich in Erinnerung behalten?",
 src:"Zaval, Markowitz & Weber (2015), Psychological Science",u:SCH("Zaval Markowitz Weber 2015 how will I be remembered conserving the environment for the sake of one's legacy")},
{id:"naturnaehe",cat:"welt",ev:2,w:"naturverbundenheit",ue:"naturzeit",
 t:"Wer sich verbunden fühlt, schützt",
 x:"Menschen, die sich der Natur verbunden fühlen, verhalten sich deutlich umweltfreundlicher. Das zeigt eine Zusammenschau aus über hundert Studien. Verbundenheit lässt sich üben: durch Zeit draußen, Aufmerksamkeit für Details und Staunen.",
 c:"Viele Studien, meist Befragungen. Die Richtung des Zusammenhangs ist nicht in allen Fällen geklärt.",
 tip:"Geh diese Woche einmal ohne Kopfhörer nach draußen und zähle, wie viele Vogelstimmen du hörst.",
 src:"Whitburn, Linklater & Abrahamse (2020), Conservation Biology",u:SCH("Whitburn Linklater Abrahamse 2020 meta-analysis of human connection to nature and proenvironmental behavior")},
{id:"grenzen",cat:"welt",ev:2,w:"genuegsamkeit",ue:"fussabdruck",
 t:"Die Belastungsgrenzen des Planeten",
 x:"Forscher haben neun Bereiche bestimmt, in denen die Erde stabil bleibt, solange bestimmte Grenzen nicht überschritten werden, etwa beim Klima, der Artenvielfalt oder dem Stickstoff. Nach ihrer Auswertung von 2023 sind sechs dieser neun Grenzen überschritten.",
 c:"Ein einflussreiches wissenschaftliches Rahmenwerk. Einzelne Grenzwerte und ihre Berechnung werden diskutiert.",
 tip:"Mach dir klar, dass Genug kein Verzicht aus Prinzip ist, sondern ein Maß, das die Erde vorgibt.",
 src:"Richardson et al. (2023), Science Advances",u:SCH("Richardson 2023 Earth beyond six of nine planetary boundaries")},
/* ---------- Urteil ---------- */
{id:"wiederholung",cat:"urteil",ev:3,w:"muendigkeit",ue:"querlesen",
 t:"Wiederholung macht glaubhaft",
 x:"Behauptungen, die wir schon einmal gehört haben, halten wir eher für wahr, selbst wenn wir es eigentlich besser wissen. Dieser Effekt ist seit Jahrzehnten bekannt und wirkt auch bei falschen Nachrichten. Wer Falsches oft wiederholt, macht es glaubwürdiger.",
 c:"Sehr gut belegt, in vielen Studien wiederholt.",
 tip:"Teile keine Falschmeldung, auch nicht, um dich über sie lustig zu machen. Teile lieber die richtige Information.",
 src:"Fazio, Brashier, Payne & Marsh (2015), Journal of Experimental Psychology: General",u:SCH("Fazio Brashier Payne Marsh 2015 knowledge does not protect against illusory truth")},
{id:"querlesen",cat:"urteil",ev:2,w:"muendigkeit",ue:"querlesen",
 t:"Profis lesen quer",
 x:"Forscher ließen Faktenprüfer, Geschichtsprofessoren und Studierende Webseiten beurteilen. Die Faktenprüfer waren am schnellsten und genauesten. Ihr Trick: Sie verließen die Seite sofort und schauten in neuen Tabs nach, wer dahintersteckt, statt die Seite selbst gründlich zu lesen.",
 c:"Mehrere Studien derselben Forschungsgruppe, inzwischen auch in Schulprogrammen erprobt.",
 tip:"Bevor du einer Quelle glaubst, such nach ihrem Namen und schau, was andere über sie sagen.",
 src:"Wineburg & McGrew (2019), Teachers College Record",u:SCH("Wineburg McGrew 2019 lateral reading and the nature of expertise reading less and learning more")},
{id:"deepfakes",cat:"urteil",ev:2,w:"demut",ue:"querlesen",
 t:"Fälschungen erkennen wir schlecht",
 x:"In Experimenten sollten Menschen echte Videos von gefälschten unterscheiden. Sie lagen kaum besser als beim Raten, hielten sich aber für sehr treffsicher. Gerade diese Selbstüberschätzung macht anfällig für Täuschung.",
 c:"Sorgfältige Experimente. Die Technik entwickelt sich schnell, das Problem dürfte eher größer geworden sein.",
 tip:"Verlass dich bei aufregenden Videos nicht auf dein Auge, sondern auf die Quelle.",
 src:"Köbis, Doležalová & Soraperra (2021), iScience",u:SCH("Köbis Dolezalova Soraperra 2021 fooled twice people cannot detect deepfakes but think they can")},
{id:"automationbias",cat:"urteil",ev:2,w:"muendigkeit",ue:"kipause",
 t:"Zu viel Vertrauen in Maschinen",
 x:"Wenn ein Computer eine Empfehlung gibt, folgen Menschen ihr oft auch dann, wenn ihre eigene Wahrnehmung dagegen spricht, und übersehen Fehler, die sie sonst bemerkt hätten. Das zeigte sich bei Piloten, in der Medizin und in vielen Laborstudien.",
 c:"Gut untersuchter Effekt mit vielen Studien. Wie stark er bei heutigen KI-Systemen ist, wird gerade erforscht.",
 tip:"Wenn eine KI dir etwas empfiehlt, frag: Wie würde ich entscheiden, wenn ich die Antwort nicht kennen würde?",
 src:"Parasuraman & Manzey (2010), Human Factors",u:SCH("Parasuraman Manzey 2010 complacency and bias in human use of automation an attentional integration")},
{id:"zustimmung",cat:"urteil",ev:2,w:"wahrhaftigkeit",ue:"kipause",
 t:"KI redet dir gern nach dem Mund",
 x:"Sprachmodelle wie Chatbots neigen dazu, Nutzern zuzustimmen, ihre Meinung zu bestätigen und sich bei Widerspruch zu korrigieren, auch wenn sie vorher recht hatten. Das liegt unter anderem daran, wie sie trainiert werden: Zustimmung wird von Menschen oft besser bewertet.",
 c:"Systematische Untersuchung mehrerer großer Sprachmodelle. Hersteller arbeiten daran, das Verhalten zu verringern.",
 tip:"Bitte eine KI ausdrücklich um die stärksten Gegenargumente zu deiner Meinung.",
 src:"Sharma et al. (2023), Towards Understanding Sycophancy in Language Models",u:SCH("Sharma 2023 towards understanding sycophancy in language models")},
{id:"auslagern",cat:"urteil",ev:1,w:"muendigkeit",ue:"kipause",
 t:"Denken auslagern hat einen Preis",
 x:"Wir lagern Gedächtnis und Denken gern aus: an Notizen, Suchmaschinen und inzwischen an KI. Das entlastet und ist oft klug. Studien deuten aber darauf hin, dass wir uns Ausgelagertes schlechter merken und eigene Fähigkeiten weniger trainieren.",
 c:"Ein lebendiges Forschungsfeld mit gemischten Ergebnissen. Klar ist: Es kommt darauf an, was man auslagert.",
 tip:"Lagere Fleißarbeit aus, aber denk Entscheidungen, die dir wichtig sind, selbst zu Ende.",
 src:"Risko & Gilbert (2016), Trends in Cognitive Sciences",u:SCH("Risko Gilbert 2016 cognitive offloading")},
{id:"sapereaude",cat:"urteil",ev:0,w:"muendigkeit",ue:"kipause",
 t:"Habe Mut, dich deines eigenen Verstandes zu bedienen",
 x:"Kant beschrieb Aufklärung als Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit. Unmündig sei, wer sich seines Verstandes nicht ohne Leitung eines anderen bedient, nicht aus Mangel an Verstand, sondern aus Mangel an Mut. Der Satz passt gut in eine Zeit, in der Algorithmen uns viel Denken abnehmen.",
 c:"Philosophischer Klassiker von 1784.",
 tip:"Bilde dir zu einer Frage zuerst selbst eine Meinung, bevor du nachschaust, was andere denken.",
 src:"Kant (1784), Beantwortung der Frage: Was ist Aufklärung?",u:SCH("Kant 1784 Beantwortung der Frage was ist Aufklärung")},
{id:"intdemut",cat:"urteil",ev:1,w:"demut",ue:"gegenseite",
 t:"Wer sich irren kann, urteilt besser",
 x:"Menschen mit intellektueller Demut, also der Bereitschaft, eigene Irrtümer für möglich zu halten, prüfen Argumente sorgfältiger. Sie unterscheiden besser zwischen starken und schwachen Belegen und urteilen weniger hart über Andersdenkende.",
 c:"Ein junges Forschungsfeld mit vielversprechenden, aber noch nicht abschließenden Ergebnissen.",
 tip:"Sag in einer Diskussion einmal bewusst: Das wusste ich nicht, danke.",
 src:"Leary et al. (2017), Personality and Social Psychology Bulletin",u:SCH("Leary Diebels Davisson 2017 cognitive and interpersonal features of intellectual humility")},
{id:"gegenteil",cat:"urteil",ev:2,w:"fairness",ue:"gegenseite",
 t:"Das Gegenteil bedenken",
 x:"Menschen lesen Belege oft so, dass sie ihre Meinung bestätigen. Eine einfache Gegenstrategie wirkte in Experimenten gut: sich ausdrücklich zu fragen, wie man urteilen würde, wenn dasselbe Ergebnis die Gegenseite gestützt hätte.",
 c:"Klassisches Experiment, dessen Kern in vielen Folgestudien bestätigt wurde.",
 tip:"Frag dich: Würde ich diese Studie genauso ernst nehmen, wenn sie das Gegenteil zeigen würde?",
 src:"Lord, Lepper & Preston (1984), Journal of Personality and Social Psychology",u:SCH("Lord Lepper Preston 1984 considering the opposite a corrective strategy for social judgment")},
{id:"intuition",cat:"urteil",ev:1,w:"differenzierung",ue:"gegenseite",
 t:"Erst das Gefühl, dann die Gründe",
 x:"Bei moralischen Fragen urteilen wir oft blitzschnell aus dem Bauch und suchen die Begründung erst danach. Das muss nicht falsch sein, denn Intuitionen enthalten viel Erfahrung. Aber es lohnt sich, nach dem ersten Urteil kurz zu prüfen, ob die Gründe es wirklich tragen.",
 c:"Einflussreiche Theorie mit vielen Belegen. Einzelne Experimente dazu ließen sich nicht immer wiederholen.",
 tip:"Notiere bei einer moralischen Frage erst dein Bauchgefühl, dann drei Gründe. Passt beides zusammen?",
 src:"Haidt (2001), Psychological Review",u:SCH("Haidt 2001 the emotional dog and its rational tail social intuitionist approach to moral judgment")},
{id:"verbuendeter",cat:"urteil",ev:2,w:"mut",ue:"widerspruch",
 t:"Ein Verbündeter genügt",
 x:"In Solomon Aschs Experimenten passten sich viele Menschen einer offensichtlich falschen Gruppenmeinung an. Sobald aber nur eine einzige andere Person widersprach, sank die Anpassung drastisch. Man muss also nicht allein gegen alle stehen, um den Unterschied zu machen.",
 c:"Klassische, oft wiederholte Experimente. Das Ausmaß der Anpassung schwankt je nach Zeit und Kultur.",
 tip:"Wenn jemand in einer Gruppe als Einziger widerspricht, stell dich hörbar an seine Seite.",
 src:"Asch (1956), Psychological Monographs",u:SCH("Asch 1956 studies of independence and conformity a minority of one against a unanimous majority")},
{id:"empoerung",cat:"urteil",ev:2,w:"gelassenheit",ue:"kipause",
 t:"Empörung wird belohnt",
 x:"Eine Auswertung von Millionen Tweets zeigte: Wer für einen empörten Beitrag viele Likes bekam, schrieb danach häufiger empörte Beiträge. Soziale Medien trainieren uns so zu mehr Empörung, als wir von uns aus zeigen würden.",
 c:"Große Datenanalyse plus Experimente. Die Plattformen haben sich seither verändert, das Prinzip gilt weiter.",
 tip:"Bevor du dich online empörst, warte eine Stunde. Schreib dann, was du wirklich sagen willst.",
 src:"Brady, McLoughlin, Doan & Crockett (2021), Science Advances",u:SCH("Brady McLoughlin Doan Crockett 2021 how social learning amplifies moral outrage expression in online social networks")},
{id:"harmonie",cat:"urteil",ev:0,w:"toleranz",ue:"gegenseite",
 t:"Harmonie heißt nicht, alles Störende zu beseitigen",
 x:"Wer Harmonie als einen Zustand versteht, in dem alles den eigenen Vorstellungen entspricht, sieht im Fremden irgendwann ein Problem, das verschwinden muss. Genau so dachten totalitäre Ideologien. Harmonie im menschlichen Sinn ist etwas anderes: die Fähigkeit, verschieden zu sein und trotzdem miteinander zu leben, und Gewalt dabei klar zu begrenzen.",
 c:"Ein philosophischer Gedanke, der an die Kritik totalitärer Ordnungsvorstellungen anknüpft, etwa bei Hannah Arendt.",
 tip:"Wenn dich jemand stört, frag: Muss er sich ändern, oder muss ich lernen, ihn auszuhalten?",
 src:"Arendt (1951), Elemente und Ursprünge totaler Herrschaft",u:SCH("Arendt 1951 Elemente und Ursprünge totaler Herrschaft")}

 h:"Wer Täter zu Monstern erklärt, schiebt die Taten aus dem Menschlichen heraus und macht es sich zu leicht. Verstehen heißt nicht verzeihen: Nur weil sie Menschen waren, können wir sie voll verantwortlich machen. Und nur so erkennen wir, was auch heute verhindert werden muss.",f:"Was folgt für dich daraus, dass gewöhnliche Menschen zu Tätern wurden?"},
{id:"beleidigung",cat:"selbst",t:"Der Zorn kocht",
 x:"Jemand beleidigt deine Schwester vor deinen Augen grob. Du spürst, wie der Zorn in dir hochkocht.",

 h:"Zorn darf eine Grenze ziehen, so wie Gandalf, der einmal aufbraust, um Bilbo zur Besinnung zu bringen, und ihn danach nicht aufgibt. Wer zurückbeleidigt, lässt sich vom anderen den Ton vorschreiben.",f:"Was soll dein Zorn bewirken, und was nicht?"},
{id:"kirat",cat:"urteil",t:"Der Rat der Maschine",
 x:"Eine KI empfiehlt dir für eine wichtige Entscheidung eine Lösung und begründet sie überzeugend. Dein Bauchgefühl sagt etwas anderes, aber du kannst es nicht gut erklären.",
 o:[{t:"Ich folge der KI. Sie hat die besseren Argumente.",w:["demut","differenzierung"]},{t:"Ich folge meinem Gefühl. Es ist meine Entscheidung.",w:["freiheit","echtheit"]},{t:"Ich bitte die KI um Gegenargumente und frage einen Menschen, dem ich vertraue.",w:["muendigkeit","neugier"]}],
 h:"KI-Systeme neigen dazu, überzeugend zu klingen und Nutzern zuzustimmen. Ein unklares Bauchgefühl ist kein Gegenbeweis, aber ein Hinweis, genauer hinzuschauen.",f:"Wer trägt die Verantwortung, wenn die Entscheidung falsch war?"},
{id:"spende",cat:"welt",t:"Fünfzig Euro",

 o:[{t:"Ich spende ans Tierheim, das ich kenne.",w:["ehrfurcht","beteiligung"]},{t:"Ich spende für die Malarianetze.",w:["weitherzigkeit","gerechtigkeit"]},{t:"Ich teile die Summe auf.",w:["mass","teilen"]}],
 h:"Nähe zum Eigenen und Weitherzigkeit sind beide gute Werte. Es lohnt sich zu wissen, nach welchem du deine Spenden ausrichtest.",f:"Nach welchem Maßstab möchtest du künftig spenden?"},
{id:"verschwoerung",cat:"urteil",t:"Der Freund im Kaninchenbau",
 x:"Ein alter Freund teilt immer öfter Verschwörungsbeiträge. Wenn du widersprichst, wird er wütend. Ihr kennt euch seit der Grundschule.",
 o:[{t:"Ich bleibe in Kontakt und spreche über andere Dinge, die uns verbinden.",w:["loyalitaet","zuwendung"]},{t:"Ich widerspreche jedes Mal klar mit Belegen.",w:["wahrhaftigkeit","muendigkeit"]},{t:"Ich ziehe mich zurück, das tut mir nicht gut.",w:["selbstachtung","mass"]}],
 h:"Faktenschlachten überzeugen selten. Was Menschen manchmal zurückholt, ist eine Beziehung, die hält, und Fragen statt Vorwürfe. Du darfst aber auch auf dich achten.",f:"Was braucht dein Freund vielleicht, das er in diesen Beiträgen sucht?"},
{id:"lob",cat:"selbst",t:"Das fremde Lob",
 x:"Du wirst vor allen für eine Idee gelobt. Ein wichtiger Teil davon stammt aber von einer Kollegin, die gerade nicht da ist.",
 o:[{t:"Ich sage sofort, dass die Idee zum Teil von ihr stammt.",w:["fairness","integritaet"]},{t:"Ich sage jetzt nichts, erzähle ihr aber davon.",w:["wahrhaftigkeit","loyalitaet"]},{t:"Ich nehme das Lob an. Ich habe die Idee ja ausgearbeitet.",w:["selbstachtung","echtheit"]}],
 h:"Fairness kostet hier nur einen Satz und stärkt dein Ansehen meist eher, als dass es ihm schadet.",f:"Wie würdest du dich fühlen, wenn es umgekehrt wäre?"},
{id:"erschoepft",cat:"selbst",t:"Zu müde zum Retten",
 x:"Du bist erschöpft und brauchst dringend Ruhe. Eine Initiative, für die du dich engagierst, braucht dich aber gerade jetzt für eine wichtige Aktion.",
 o:[{t:"Ich mache eine Pause und sage offen, warum.",w:["selbstachtung","mass"]},{t:"Ich mache mit. Es geht um etwas Wichtiges.",w:["solidaritaet","verlaesslichkeit"]},{t:"Ich übernehme eine kleine Aufgabe, die mich nicht überfordert.",w:["gelassenheit","beteiligung"]}],

{id:"reparieren",cat:"welt",t:"Kaputt",

 o:[{t:"Ich lasse sie reparieren.",w:["sorgfalt","zukunftsverantwortung"]},{t:"Ich kaufe neue und bringe die alten zum Recycling.",w:["genuegsamkeit","verantwortlichkeit"]},{t:"Ich frage, ob jemand im Umfeld noch welche übrig hat.",w:["teilen","genuegsamkeit"]}],
 h:"Sorgfalt mit Dingen zahlt sich oft für die Welt aus, auch wenn sie sich für den Geldbeutel nicht immer rechnet.",f:"Welche Dinge willst du grundsätzlich reparieren, statt sie zu ersetzen?"},
{id:"spottvideo",cat:"selbst",t:"Der Spott über den Täter",
 x:"Ein Mitschüler hat dich zwei Jahre lang gemobbt. Jetzt geht ein Video herum, in dem er selbst ausgelacht wird. Im Klassenchat feiern es alle, und jemand schreibt: „Endlich trifft es mal den Richtigen.“",
 o:[{t:"Ich teile es nicht und schreibe in den Chat, dass ich so etwas bei niemandem gut finde, auch nicht bei ihm.",w:["zivilcourage","fairness"]},{t:"Ich halte mich raus. Ich muss nicht ausgerechnet ihn verteidigen.",w:["selbstachtung","echtheit"]},{t:"Ich schreibe ihm privat, dass ich das Video nicht in Ordnung finde, auch wenn ich nicht vergessen habe, was er mir angetan hat.",w:["mut","solidaritaet"]}],
 h:"Wer gemobbt wurde, schuldet dem Täter kein Mitgefühl, und die Erleichterung, dass es nun ihn trifft, ist menschlich. Trotzdem ist das Video dieselbe Herabsetzung, die du selbst erlebt hast. Du kannst ablehnen, was er getan hat, und zugleich nicht mitmachen, wenn er herabgesetzt wird.",f:"Was unterscheidet in diesem Fall Gerechtigkeit von Rache?"},
{id:"kommentare",cat:"urteil",t:"Die Kommentarspalte",
 x:"Unter einer Meldung über ein schweres Verbrechen an einem Kind fordern viele, man solle den Täter „wie ein Tier behandeln“. Ein Freund schickt dir einen dieser Kommentare und schreibt dazu: „Genau so.“",
 o:[{t:"Ich schreibe zurück, dass ich das genauso sehe. Bei so einer Tat habe ich kein Verständnis übrig.",w:["echtheit","gerechtigkeit"]},{t:"Ich schreibe: Ich will, dass er hart bestraft wird. Trotzdem rede ich nicht so über Menschen.",w:["differenzierung","wuerde"]},{t:"Ich antworte nicht im Chat, sondern frage ihn beim nächsten Treffen, was ihn an dem Fall so mitnimmt.",w:["neugier","zuwendung"]}],
 h:"Wut über ein schweres Verbrechen ist verständlich und oft ein Zeichen von Mitgefühl mit dem Opfer. Wer den Täter aber zum Tier erklärt, nimmt ihm genau das, wofür man ihn verurteilen kann: Nur ein Mensch kann schuldig sein. Eine harte Strafe und eine menschliche Sprache schließen sich nicht aus.",f:"Was willst du eigentlich, wenn du an den Täter denkst: Strafe, Schutz oder Vergeltung?"},
{id:"vereinspost",cat:"miteinander",t:"Der Post aus der Mannschaft",
 x:"Ein Spieler aus deiner Mannschaft postet ein Bild mit einem abfälligen Spruch über Geflüchtete. Ein paar aus dem Team haben Screenshots gemacht und wollen ihn in einer großen Gruppe vorführen. Sie fragen, ob du dabei bist.",
 o:[{t:"Ich mache mit. Wer so etwas öffentlich postet, muss auch öffentlichen Widerspruch aushalten.",w:["zivilcourage","gerechtigkeit"]},{t:"Ich mache nicht mit und spreche ihn selbst direkt an.",w:["mut","wahrhaftigkeit"]},{t:"Ich sage dem Trainer Bescheid und verlasse mich darauf, dass der Verein das klärt.",w:["vertrauen","verantwortlichkeit"]}],
 h:"Alle drei Wege lehnen den Post ab. Sie unterscheiden sich darin, was danach mit dem Menschen geschieht. Bloßstellen kann wirken, treibt Menschen aber oft tiefer in ihre Ecke. Ein direktes Gespräch ist mühsamer, und ein Verein kann nur handeln, wenn jemand Bescheid sagt.",f:"Was soll er am Ende verstanden haben, und auf welchem Weg wird das am ehesten passieren?"},
{id:"gedenkselfie",cat:"miteinander",t:"Das Selfie in der Gedenkstätte",
 x:"Deine Klasse besucht eine KZ-Gedenkstätte. Ein Mitschüler macht vor dem Lagertor grinsend Selfies und will sie in seine Story stellen. Ein paar lachen.",
 o:[{t:"Ich sage ihm direkt, dass das hier nicht der Ort dafür ist.",w:["erinnerung","zivilcourage"]},{t:"Ich spreche ihn später an und frage, wie es ihm an diesem Ort eigentlich ging.",w:["neugier","fuersorge"]},{t:"Ich sage nichts. Manche schützen sich an so einem Ort mit Witzen, und ich weiß nicht, was in ihm vorgeht.",w:["toleranz","demut"]}],
 h:"Unpassendes Verhalten an Gedenkorten hat viele Gründe: Überforderung, Unsicherheit, manchmal Gleichgültigkeit. Man kann klar sagen, dass etwas nicht passt, und dem anderen trotzdem zutrauen, dass er mehr versteht, als er zeigt.",f:"Was soll von diesem Ort bei dir bleiben?"},
{id:"screenshot",cat:"naehe",t:"Der weitergeleitete Screenshot",
 x:"Deine beste Freundin hat einen privaten Chat von dir als Screenshot an andere weitergeschickt. Es war dir sehr peinlich. Jetzt entschuldigt sie sich und sagt, sie habe nicht nachgedacht.",
 o:[{t:"Ich nehme die Entschuldigung an. Ein Fehler macht sie nicht zu einem schlechten Menschen.",w:["vergebung","vertrauen"]},{t:"Ich nehme die Entschuldigung an, aber Persönliches erzähle ich ihr vorerst nicht mehr.",w:["vergebung","selbstachtung"]},{t:"Ich sage ihr, dass ich erst einmal Abstand brauche, und erkläre, was das mit mir gemacht hat.",w:["offenheit","selbstachtung"]}],
 h:"Vergeben heißt nicht, sofort wieder alles anzuvertrauen. Vertrauen wächst über Erfahrungen und darf langsamer zurückkommen, als eine Entschuldigung gesagt ist. Abstand ist auch keine Strafe, wenn du offen sagst, warum du ihn brauchst.",f:"Was müsste passieren, damit du ihr wieder ganz vertraust?"},
{id:"schulwald",cat:"welt",t:"Der Wald hinter der Schule",
 x:"Das kleine Wäldchen hinter deiner Schule soll für einen neuen Sportplatz gerodet werden. Viele freuen sich auf den Platz. Du bist oft in dem Wäldchen, in Pausen und nach der Schule.",

 h:"Hier stehen zwei berechtigte Ansprüche gegeneinander: der Ort, an dem Lebendiges wächst, und der Ort, an dem Menschen zusammenkommen. Wer seine Verbundenheit mit einem Stück Natur ernst nimmt, darf sie laut sagen, auch wenn die Mehrheit anders entscheidet.",f:"Was würde dir fehlen, wenn das Wäldchen weg wäre, und wem würde der Platz fehlen, wenn er nicht gebaut wird?"},
{id:"zelten",cat:"naehe",t:"Ohne Netz",
 x:"Deine Eltern planen ein Wochenende zum Zelten an einem See, ohne Handyempfang. Dein kleiner Bruder freut sich riesig darauf. Am selben Samstag feiert dein bester Freund seinen Geburtstag.",
 o:[{t:"Ich fahre mit. Draußen am See bin ich gern, und mein Bruder freut sich.",w:["naturverbundenheit","zuwendung"]},{t:"Ich gehe zur Party. Ich habe meinem Freund schon lange zugesagt.",w:["verlaesslichkeit","loyalitaet"]},{t:"Ich frage, ob ich am Sonntag nachkommen kann, und kläre das offen mit allen.",w:["offenheit","mass"]}],

{id:"billigshirt",cat:"welt",t:"Das billige Shirt",
 x:"Ein Shop auf Social Media verkauft Kleidung extrem billig. Du hast gelesen, unter welchen Bedingungen solche Kleidung oft genäht wird. Deine Freundinnen bestellen gemeinsam und fragen, ob du mitmachst. Dein Geld vom Nebenjob ist knapp.",
 o:[{t:"Ich bestelle nicht. Die Menschen, die das nähen, sind mir nicht egal, auch wenn ich sie nie sehen werde.",w:["weitherzigkeit","folgerichtigkeit"]},{t:"Ich bestelle mit. Mit meinem Geld komme ich sonst nicht weit, und ich will dazugehören.",w:["loyalitaet","zuwendung"]},{t:"Ich kaufe weniger und dafür gebraucht oder fair hergestellt, auch wenn ich länger sparen muss.",w:["disziplin","genuegsamkeit"]}],
 h:"Wer wenig Geld hat, kann nicht alles nach seinen Werten kaufen, und das ist kein Versagen. Weitherzigkeit zeigt sich dort, wo du einen Spielraum hast. Gebraucht kaufen ist oft der Weg, der Geldbeutel und Gewissen zugleich schont.",f:"Bei welchen Dingen ist dir wichtig, wie sie hergestellt wurden, und bei welchen nicht?"}

const UEBUNGEN=[
{id:"werteinventur",cat:"selbst",d:1,w:"echtheit",t:"Deine fünf Stützen",x:"Wähle aus allen Werten der App bis zu fünf, die dich tragen sollen. Nicht die, die gut klingen, sondern die, nach denen du wirklich leben willst.",s:["Geh unter „Werte“ die Liste einmal in Ruhe durch","Markiere alles, was dich anspricht","Streich so lange, bis höchstens fünf übrig sind","Frag bei jedem: Woran würde man das bei mir merken?"]},
{id:"leitsatz",cat:"selbst",d:1,w:"integritaet",t:"Ein Leitsatz",x:"Formuliere für einen deiner Stützwerte einen Satz, der mit „Ich stehe dafür ein, dass …“ beginnt. Ein guter Leitsatz ist konkret und gilt auch, wenn es unbequem wird.",s:["Wähle einen Stützwert","Schreib den Satz so konkret wie möglich","Denk an eine Lage, in der er dich etwas kosten würde","Trag ihn unter „Werte“ beim Wert ein"]},
{id:"zornnotiz",cat:"selbst",d:1,w:"gewaltfreiheit",t:"Die Zorn-Notiz",x:"Gib einem Zorn, der dich beschäftigt, einen begrenzten Raum. Schreib fünfzehn Minuten, ohne dich zu erklären oder zu rechtfertigen. Danach leg das Blatt weg und geh nach draußen. Die Satzanfänge unten helfen dir beim Schreiben.",s:["Ich bin zornig, weil …","Dieser Zorn zeigt mir, wie wichtig mir … ist","Ich möchte nicht, dass dieser Zorn mich dazu bringt, …","Weglegen, spazieren gehen, die Gegenwart wahrnehmen"]},
{id:"wenndann",cat:"selbst",d:7,w:"disziplin",t:"Wenn-dann für den Ernstfall",x:"Werte geraten im Moment der Entscheidung leicht unter die Räder. Ein vorab gefasster Plan hilft, dann nach ihnen zu handeln.",s:["Wähle einen Wert und eine Lage, in der er oft unter Druck gerät","Formuliere: Wenn …, dann …","Sag den Plan dreimal laut","Notiere jeden Tag, ob die Lage eintrat und was du getan hast"]},
{id:"werttag",cat:"selbst",d:1,w:"folgerichtigkeit",t:"Ein Tag, ein Wert",x:"Nimm dir für einen Tag einen einzigen Wert vor und achte darauf, wo er im Alltag vorkommt.",s:["Wähle morgens einen Wert","Leg dir eine kleine Erinnerung, etwa als Handy-Hintergrund","Achte auf drei Momente, in denen er gefragt war","Notiere abends: Wo habe ich nach ihm gehandelt, wo nicht?"]},
{id:"wertequadrat",cat:"selbst",d:1,w:"differenzierung",t:"Dein Wertequadrat",x:"Nimm eine Zwickmühle, in der du hin- und hergerissen bist, und ordne sie: zwei Werte, die beide etwas Richtiges wollen, und ihr jeweiliges Zuviel.",s:["Schreib die beiden Werte nebeneinander","Schreib unter jeden, wie er übertrieben aussähe","Frag: Zu welchem Zuviel neige ich?","Such eine Handlung, die beide Werte ernst nimmt"]},
{id:"neinsagen",cat:"selbst",d:7,w:"selbstachtung",t:"Freundlich Nein sagen",x:"Wer nie Nein sagt, dessen Ja verliert an Wert. Übe eine Woche lang, kleine Bitten freundlich und ohne lange Begründung abzulehnen, wenn sie nicht passen.",s:["Achte auf Momente, in denen du automatisch Ja sagst","Gönn dir eine Bedenkzeit: Ich sag dir morgen Bescheid","Sag Nein in einem Satz, ohne Ausreden","Notiere, wie die anderen reagiert haben"]},
{id:"zuhoeren",cat:"naehe",d:7,w:"zuwendung",t:"Zehn Minuten ganz Ohr",x:"Hör einem Menschen jeden Tag zehn Minuten lang zu, ohne Ratschläge zu geben und ohne aufs Handy zu schauen.",s:["Wähle jeden Tag eine Person","Handy umdrehen oder weglegen","Nur nachfragen, nicht bewerten","Zum Schluss zusammenfassen, was du verstanden hast"]},
{id:"ehrlichesfeedback",cat:"naehe",d:1,w:"wahrhaftigkeit",t:"Ehrlich und freundlich",x:"Gib einem Menschen, der dir wichtig ist, einen ehrlichen Hinweis, den du bisher zurückgehalten hast, so freundlich wie möglich.",s:["Wähle einen Hinweis, der dem anderen wirklich nützt","Frag vorher: Darf ich dir etwas sagen?","Sprich über ein Verhalten, nicht über die Person","Frag hinterher, wie es bei ihm ankam"]},
{id:"entschuldigung",cat:"naehe",d:1,w:"verantwortlichkeit",t:"Eine vollständige Entschuldigung",x:"Gibt es jemanden, bei dem du dich nie richtig entschuldigt hast? Hol es nach, mit Eingeständnis und Angebot zur Wiedergutmachung.",s:["Benenne genau, was du getan hast","Sag: Das war mein Fehler","Verzichte auf Rechtfertigungen","Frag: Kann ich etwas wiedergutmachen?"]},
{id:"vergebungsbrief",cat:"naehe",d:1,w:"vergebung",t:"Ein Brief, den du nicht abschickst",x:"Schreib einem Menschen, der dich gekränkt hat, einen Brief. Du schickst ihn nicht ab. Es geht darum, die Kränkung zu ordnen, nicht um Versöhnung.",s:["Beschreib, was passiert ist und was es mit dir gemacht hat","Schreib, was du dir gewünscht hättest","Überleg, ob und was du loslassen möchtest","Bewahr den Brief auf oder vernichte ihn bewusst"]},
{id:"widerspruch",cat:"naehe",d:7,w:"loyalitaet",t:"Freundlich widersprechen",x:"Sag eine Woche lang einmal am Tag „Da sehe ich es anders“, wenn es stimmt, ruhig und mit einem Grund.",s:["Achte auf Momente, in denen du nur aus Höflichkeit nickst","Sag deinen Satz und einen Grund","Hör dir die Antwort wirklich an","Notiere, ob das Gespräch besser oder schlechter wurde"]},
{id:"grenzewuerde",cat:"miteinander",d:7,w:"wuerde",t:"Grenze ohne Herabsetzung",x:"Wenn jemand abfällig über andere spricht, setz eine klare Grenze, ohne ihn selbst herabzusetzen. Übe eine Woche lang, solche Momente zu bemerken und zu antworten.",s:["Leg dir einen Satz zurecht, etwa: Ich sehe das anders, und so möchte ich nicht über Menschen reden","Sprich über die Aussage, nicht über die Person","Bleib ruhig, auch wenn der andere lauter wird","Notiere, was du gesagt hast und wie es ankam"]},
{id:"zivilplan",cat:"miteinander",d:1,w:"zivilcourage",t:"Dein Plan fürs Eingreifen",x:"Wer vorher weiß, was er tun würde, handelt im Ernstfall eher. Mach dir einen persönlichen Plan, ohne dich selbst in Gefahr zu bringen.",s:["Hinschauen und die Lage einschätzen","Andere gezielt ansprechen: Sie mit der Brille, helfen Sie mir","Hilfe holen: 110 oder Personal","Die betroffene Person ansprechen, nicht den Täter angreifen"]},
{id:"namen",cat:"miteinander",d:1,w:"erinnerung",t:"Ein Name, ein Leben",x:"Lies die Geschichte eines einzelnen Menschen, der verfolgt oder ermordet wurde. Nicht als Zahl, sondern als Mensch mit Hoffnungen, Humor und Liebe.",s:["Such dir einen Stolperstein in deiner Nähe oder eine Biografie bei einer Gedenkstätte","Lies, was über diesen Menschen bekannt ist","Notiere eine Sache, die dich berührt hat","Erzähl jemandem von ihm oder ihr"]},
{id:"stolperstein",cat:"miteinander",d:7,w:"erinnerung",t:"Stolpersteine pflegen",x:"Stolpersteine erinnern vor Wohnhäusern an Menschen, die im Nationalsozialismus verfolgt wurden. Mit der Zeit werden sie dunkel. Polieren ist eine stille Geste der Erinnerung.",s:["Finde Stolpersteine in deiner Nähe, etwa über eine Online-Karte","Nimm ein weiches Tuch und etwas Messingpflege mit","Polier den Stein und lies den Namen laut","Halte einen Moment inne"]},
{id:"begegnung",cat:"miteinander",d:14,w:"toleranz",t:"Eine echte Begegnung",x:"Führe in den nächsten zwei Wochen ein längeres Gespräch mit jemandem aus einer Lebenswelt, die dir fremd ist, auf Augenhöhe und mit echtem Interesse.",s:["Überleg, über welche Gruppe du vor allem Meinungen, aber kaum Kontakte hast","Such eine Gelegenheit: Verein, Nachbarschaft, Arbeit","Frag nach Geschichten, nicht nach Positionen","Notiere, was dich überrascht hat"]},
{id:"gegenseite",cat:"urteil",d:1,w:"fairness",t:"Die Gegenseite stark machen",x:"Nimm eine Frage, bei der du eine feste Meinung hast, und formuliere das stärkste Argument der Gegenseite, so gut, dass jemand von dort sagen würde: Ja, genau so meine ich das.",s:["Wähle ein Thema, das dich bewegt","Schreib das beste Gegenargument in eigenen Worten","Frag dich, was daran stimmt","Prüfe, ob sich deine Meinung verschoben oder gefestigt hat"]},
{id:"querlesen",cat:"urteil",d:7,w:"muendigkeit",t:"Querlesen üben",x:"Prüfe eine Woche lang jeden Tag eine Nachricht oder einen Beitrag wie ein Profi: nicht die Seite lesen, sondern nachschauen, wer dahintersteckt.",s:["Neuen Tab öffnen und nach der Quelle suchen","Prüfen, was unabhängige Seiten über sie sagen","Die Kernaussage bei einer zweiten Quelle suchen","Notieren, was du gefunden hast"]},

function _hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function normProfil(p){p=p&&typeof p==="object"?p:{};

  const r=kand.length?_waehle(kand,schluessel,slot):d.rueckfall;used.push(r);res[slot]=r});return res}
function _gemeinschaft(pr,key){if(pr.gruppe.length)return GEMEINSCHAFT[_waehle(pr.gruppe,key,"gm")];
 return GEMEINSCHAFT[pr.phase]||GEMEINSCHAFT._}
const _gross=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

/* personalisiere(text, profil, schluessel): löst Platzhalter auf. text ist ein Text oder ein Objekt nach Lebensphase.
   Gibt null zurück, wenn es für diese Lebensphase keine eigene Fassung gibt; dann gilt der Originaltext.
   Ohne Profil (null) greifen die Rückfälle: Kontexte wie im Original, Familienrollen neutral. */
function personalisiere(text,profil,schluessel){

 if(text&&typeof text==="object"){text=pr.phase&&typeof text[pr.phase]==="string"?text[pr.phase]:null}
 if(typeof text!=="string")return null;
 if(text.indexOf("{")<0)return text;
 const wahl=rollenWahl(schluessel,pr),gm=_gemeinschaft(pr,schluessel),kt=Object.assign({},KONTEXTE._,KONTEXTE[pr.phase]||{});
 let out=text.replace(/\{([A-Za-z]+)\.([^{}]*)\}/g,(m,slot,form)=>{
  const gross=slot.charAt(0)!==slot.charAt(0).toLowerCase(),s=slot.toLowerCase();let r;
  if(s==="k")r=kt[form];
  else if(s==="gm")r=gm[form]!=null?gm[form]:GEMEINSCHAFT._[form];
  else{const rolle=ROLLEN[wahl[s]];if(!rolle)return "⟦"+m+"⟧";
   if(form.startsWith("g:")){const t=form.slice(2).split("|");r=t[{m:0,f:1,n:2}[rolle.g]];if(r==null)r=t[0]}
   else if(form.startsWith("ist:")){const q=form.slice(4),i=q.indexOf("?"),ids=q.slice(0,i).split(","),t=q.slice(i+1).split("|");r=ids.includes(rolle.id)?t[0]:t[1]}
   else r=rolle.f[form]}
  if(r==null)return "⟦"+m+"⟧";
  return gross?_gross(r):r});
 /* Relativsatz der neutralen Rolle: Komma setzen, wenn der Satz weitergeht */
 out=out.replace(/\u0001(?=\s+[^\s.,;:!?“”])/g,",").replace(/\u0001/g,"");
 return out}

function _aktiv(v,profil){return !!v&&(!v.wenn||v.wenn(normProfil(profil)))}
function _feld(tpl,orig,profil,key){if(tpl==null)return orig;const r=personalisiere(tpl,profil,key);return r==null?orig:r}
/* Kopie einer Probe mit personalisierten Texten. Werte (w) und Reihenfolge der Optionen bleiben gleich. */
function personalisiereProbe(p,profil){const key="p:"+p.id,v=VARIANTEN[key];if(!_aktiv(v,profil))return p;const F=v.felder;
 const out=Object.assign({},p);["t","x","h","f"].forEach(k=>{out[k]=_feld(F[k],p[k],profil,key)});
 out.o=p.o.map((o,i)=>Object.assign({},o,{t:_feld(F.o&&F.o[i],o.t,profil,key),w:o.w}));return out}
function personalisiereUebung(u,profil){const key="u:"+u.id,v=VARIANTEN[key];if(!_aktiv(v,profil))return u;const F=v.felder;
 const out=Object.assign({},u);["t","x"].forEach(k=>{out[k]=_feld(F[k],u[k],profil,key)});
 out.s=u.s.map((s,i)=>_feld(F.s&&F.s[i],s,profil,key));return out}
function personalisiereWert(w,profil){const key="b:"+w.id,v=VARIANTEN[key];if(!_aktiv(v,profil))return w;
 return Object.assign({},w,{b:_feld(v.felder.b,w.b,profil,key)})}
/* Für den sanften Hinweis: Hängt diese Probe von einem nahen Menschen ab? */
const hatPersonRolle=id=>{const v=VARIANTEN["p:"+id];return !!(v&&(v.rollen||v.neutral))};

function aboutFold(){return `<details class="fold" id="aboutfold" ${S.aboutOpen||confirmReset?"open":""}><summary><span>Über diese App</span>${CHEV}</summary><div class="fbody about">

 </div></details>`}

/* Wertequadrat: Jeder der vier Begriffe lässt sich antippen und erklärt sich selbst und seinen Platz im Quadrat.

const mid=t=>/^[A-ZÄÖÜ][a-zäöüß]+(e|er|es|en|em) [A-ZÄÖÜ]/.test(t)?t[0].toLowerCase()+t.slice(1):t;

function wqHTML(w){const q=(r,t)=>`<button class="q ${r==="w"||r==="s"?"top":"bot"}" data-wq="${w.id}" data-role="${r}" aria-pressed="false" aria-controls="wqi-${w.id}"><small>${wqHy(wqLab(w,r))}</small><b>${wqHy(t)}</b></button>`;
  return `<div class="wq" ${cc(w.cat)} data-on=""><svg aria-hidden="true" focusable="false"></svg>

/* Zeichnet die Linien in Pixeln nach den tatsächlichen Kästchen (offset* ist unabhängig von der Einblend-Animation des Blatts).

function wqDraw(box){const svg=box&&box.querySelector("svg");if(!svg)return;const q={};

/* Jede Abwägung merkt sich den Stand davor (f.dh). „Zurück“ stellt ihn her und markiert die damalige Wahl (f.drev). */
const DKEYS=["sc","played","pi","done","round","pairs","stage","pick"];
function fDuel(win){const f=F(),[a,b]=f.pairs[f.pi];const st={win};DKEYS.forEach(k=>{if(f[k]!==undefined)st[k]=JSON.parse(JSON.stringify(f[k]))});f.dh=(f.dh||[]).concat([st]);f.drev=null;if(win==="both"){f.sc[a]+=.5;f.sc[b]+=.5}else f.sc[win]+=1;f.played.push([a,b].sort().join("|"));f.pi++;f.done++;
  if(f.pi>=f.pairs.length){f.round++;f.pairs=f.round<=f.rounds?fPairs():[];f.pi=0;if(!f.pairs.length){f.stage="result";f.pick=fRank().slice(0,5)}}persist()}
function finderView(){const f=F(),steps=["Einschätzen","Abwägen","Auswählen"],si={sort:0,duel:1,result:2}[f.stage]||0;
  const head=`<div class="fsteps">${steps.map((t,i)=>`<span class="${i===si?"on":i<si?"ok":""}"><i></i>${t}</span>`).join("")}</div>`;
  if(f.stage==="sort"){const rv=f.rev!=null&&SAETZE[f.rev]?f.rev:null,i=rv!=null?rv:SAETZE.findIndex((_,k)=>f.a[k]==null);if(i<0){fStartDuel();return finderView()}const st=SAETZE[i],n=Object.keys(f.a).length,c2=fCount(2),w=W[st.w[0]],cur=f.a[i];
    return head+`<div class="fbar"><i style="width:${Math.round(n/SAETZE.length*100)}%"></i></div><p class="fq">Wie sehr stimmt das für dich?</p>
     <div class="fcard" ${cc(w.cat)}><span class="rodmark" aria-hidden="true"></span><span class="label">Satz ${i+1} von ${SAETZE.length}</span><p class="fst">${st.t}</p></div>
     <div class="fbtns">${[[2,"Stimmt"],[1,"Teils"],[0,"Eher nicht"]].map(([k,t])=>`<button class="btn${k===2?" primary":""}" data-frate="${k}" aria-pressed="${cur===k}">${t}</button>`).join("")}</div>
     <div class="fmeta"><span class="label">${c2} × stimmt</span><span class="fnav">${f.hist.length?`<button class="linkbtn" id="fundo">Zurück</button>`:""}${rv!=null&&cur!=null?`<button class="linkbtn" id="ffwd">Weiter</button>`:""}</span></div>
     ${n>=Math.ceil(SAETZE.length/2)&&fCands().length>=5?`<button class="linkbtn" id="fskip">Genug Sätze, weiter zum Abwägen</button>`:""}
     <p class="muted small">Es gibt keine richtigen Antworten. Antworte so, wie du bist, nicht wie du gern wärst.</p>`}
  if(f.stage==="duel"){const [a,b]=f.pairs[f.pi],A=W[a],B=W[b];
    return head+`<div class="fbar"><i style="width:${Math.round(f.done/Math.max(1,f.total)*100)}%"></i></div><p class="fq">Angenommen, beides geht gerade nicht zusammen. Was wiegt für dich schwerer?</p>
     <div class="fduel">${[A,B].map(w=>`<button class="fopt${f.drev===w.id?" on":""}" ${cc(w.cat)} data-fduel="${w.id}" aria-pressed="${f.drev===w.id}"><span class="rodmark" aria-hidden="true"></span><b>${w.n}</b><span>${w.d}</span></button>`).join(`<span class="fvs" aria-hidden="true">oder</span>`)}</div>
     <div class="fmeta"><span class="label">Abwägung ${f.done+1} von etwa ${f.total}</span><span class="fnav">${f.dh&&f.dh.length?`<button class="linkbtn" id="fdback">Zurück</button>`:""}<button class="linkbtn" data-fduel="both" aria-pressed="${f.drev==="both"}">Kann ich nicht entscheiden</button></span></div>`}
  const rank=f.c&&f.c.length?fRank().slice(0,8):[];f.pick=(f.pick||[]).filter(id=>rank.includes(id));
  return head+`<p class="fq">Diese Werte haben sich bei dir durchgesetzt. Du kannst noch tauschen, bis zu fünf bleiben.</p>
   <div class="fres">${rank.map((id,i)=>{const w=W[id],on=f.pick.includes(id);return `<button class="fr ${on?"on":""}" ${cc(w.cat)} data-fpick="${id}" aria-pressed="${on}"><span class="rodmark" aria-hidden="true"></span><span class="tx"><b>${w.n}</b><small>${w.d}</small>${fWhy(id)?`<em class="why">Du hast gesagt: „${fWhy(id)}“</em>`:""}</span><span class="ck" aria-hidden="true"></span></button>`}).join("")}</div>
   ${S.kern.length?`<p class="muted small">Deine bisherigen Stützen werden ersetzt. Deine Leitsätze bleiben gespeichert und tauchen wieder auf, wenn du einen Wert erneut wählst.</p>`:""}
   <div class="row"><button class="btn primary" id="fapply" ${f.pick.length?"":"disabled"}>${f.pick.length} als Stützen übernehmen</button>${f.dh&&f.dh.length?`<button class="linkbtn" id="fdback">Zurück zum Abwägen</button>`:""}<button class="linkbtn" id="frestart">Neu beginnen</button></div>`}
function finder(still){const l=$("#layer");if(!$("#finder")){sheet(`<div id="finder" class="finder"></div>`);$("#sh").classList.add("fsheet")}
  const box=$("#finder");box.innerHTML=finderView();const c=box.querySelector(".fcard,.fduel,.fres");if(c&&!still&&!calm())c.animate([{opacity:0,transform:"translateX(18px)"},{opacity:1,transform:"none"}],{duration:420,easing:"cubic-bezier(.2,.8,.2,1)"})}
function finderClick(t,d){if(!(d.finder||d.frate||d.fduel||d.fpick||/^f(undo|skip|restart|apply|fwd|dback)$/.test(t.id)))return false;const f=F();
  if(d.finder){finder();return true}
  /* Einschätzen. Im Rückblick hebt erneutes Antippen der markierten Antwort sie auf; der Satz bleibt stehen. */
  if(d.frate){const v=+d.frate,rv=f.rev!=null&&SAETZE[f.rev]?f.rev:null;
    if(rv!=null&&f.a[rv]===v){delete f.a[rv];persist();finder(true);return true}
    const id=rv!=null?rv:SAETZE.findIndex((_,k)=>f.a[k]==null);if(id<0)return true;f.a[id]=v;f.hist.push(id);f.rev=rv!=null&&f.fwd&&f.fwd.length?f.fwd.pop():null;
    persist();t.setAttribute("aria-pressed","true");if(v===2)lightUp(t);setTimeout(finder,calm()?0:220);return true}
  if(t.id==="fundo"){const id=f.hist.pop();if(id!=null){if(f.rev!=null&&f.a[f.rev]!=null)(f.fwd=f.fwd||[]).push(f.rev);f.rev=id}persist();finder();return true}
  if(t.id==="ffwd"){if(f.rev!=null){f.hist.push(f.rev);f.rev=f.fwd&&f.fwd.length?f.fwd.pop():null}persist();finder();return true}
  if(t.id==="fdback"){const st=(f.dh||[]).pop();if(st){DKEYS.forEach(k=>{if(k in st)f[k]=st[k];else delete f[k]});f.drev=st.win}persist();finder();return true}
  if(t.id==="fskip"){fStartDuel();finder();return true}
  /* Abwägen. Nach „Zurück“ ist die damalige Wahl markiert; erneutes Antippen hebt sie auf, die Abwägung bleibt offen. */
  if(d.fduel){if(f.drev!=null&&f.drev===d.fduel){f.drev=null;persist();finder(true);return true}
    if(d.fduel!=="both"){lightUp(t);t.classList.add("won")}fDuel(d.fduel);setTimeout(finder,calm()?0:260);return true}
  if(d.fpick){const id=d.fpick;if(f.pick.includes(id))f.pick=f.pick.filter(x=>x!==id);else if(f.pick.length<5)f.pick.push(id);else{buzz("err");shake(t);toast("Höchstens fünf. Nimm zuerst einen heraus.");return true}persist();finder();return true}
  if(t.id==="frestart"){const sn=snap();S.find={v:2,a:{},hist:[],stage:"sort"};persist();finder();undoToast("Deine Antworten sind gelöscht.",false,sn,{reopen:()=>finder()});return true}
  if(t.id==="fapply"){const sn=snap(),rank=fRank();S.kern=rank.filter(id=>f.pick.includes(id)).slice(0,5);f.stage="done";buzz("ok");closeSheet();setTimeout(()=>{toBuild();undoToast(`${S.kern.length===1?"Deine Stütze steht":"Deine Stützen stehen"}.`,true,sn,{reopen:()=>finder()})},calm()?0:260);return true}
  return false}

/* ---------- Licht, Klickbild & Vibration: nur als Antwort auf Berührung ---------- */
const calm=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
const vibOn=()=>S.settings.vibration!==false;
/* Klickfamilien. Jedes antippbare Element gehört bewusst zu genau einer:
   Aktion (Knöpfe, große Karten): Tick und eine matte Welle vom Berührungspunkt.
   Auswahl (Chips, Skalen, Abwägen, Legende, Optionen einer Probe): Tick, die Füllung läuft vom Finger aus ein.
   Schalter (Einstellungen): Tick, der Knopf dehnt sich beim Drücken (CSS).  Logo und Titel: Tick, das kleine Gerüst federt.
   Navigation (Listen, Reiter, Zurück, Aufklappen, Verweise, Links): kein Tick, nur leichtes Abdunkeln (CSS :active).
   Erfolg und Fehler sind Ausgänge einer Aktion: buzz("ok") oder buzz("err") im Klick-Handler. Erfolg zeigt einen Haken
   in der Meldung (toast(…,true)), Fehler eine kleine Seitwärtsbewegung (shake). */
const FAM=[["logo","#home,#home2"],["rod",".rhit"],["sw",".setrow[role=switch]"],["sel",".chip,.fbtns .btn,.fopt,.fr,.lg:not(.free),.cdot,.opt,.wq .q"],["act",".btn,.next,.draw,.findcard,.li.daily,.ubtn"]];
const HAPSEL=FAM.map(f=>f[1]).join(",");
const PAT={rod:10,sel:10,sw:10,logo:10,act:12,ok:[10,60,14],err:[24,60,24]};
const famHost=t=>{const el=t&&t.closest&&t.closest(HAPSEL);return el&&el.tagName!=="A"&&!el.disabled&&el.getAttribute("aria-disabled")!=="true"?el:null};
const famOf=el=>{for(const [k,s] of FAM)if(el.matches(s))return k;return null};
/* Android: navigator.vibrate mit eigenem Muster je Situation, synchron am Ende desselben Klicks (Listener auf window,
   läuft nach allen Handlern). Handler wählen mit buzz() Erfolg oder Fehler statt des Familienmusters. */
let buzzKind=null;
function buzz(k){buzzKind=k}
function vib(k){if(!vibOn()||!PAT[k]||typeof navigator.vibrate!=="function")return;try{navigator.vibrate(PAT[k])}catch(e){}}
/* iPhone: Safari vibriert nur, wenn ein Finger selbst einen <input type="checkbox" switch> umlegt; programmierte,
   mehrfache oder verzögerte Ticks spielt iOS nicht ab. Darum liegt in jedem Element, das ticken soll, ein unsichtbarer
   Schalter über der ganzen Fläche. Der Klick darauf läuft zum Element hoch, closest() findet dessen data-Attribute,
   die Aktion läuft also genau einmal. Neu gezeichnete Elemente bekommen den Schalter über den MutationObserver.
   Nicht in Links, ausgeblendet bei deaktivierten Knöpfen (CSS), für Screenreader und Tastatur unsichtbar. */
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
/* Bei ausgeschalteter Vibration bleibt nur der Schalter „Vibration“ selbst versorgt, damit das Einschalten tickt. */
function armHaps(){const on=vibOn(),keep="[data-setting=vibration]";if(!on)document.querySelectorAll("input.hap").forEach(i=>{if(!i.parentElement.matches(keep))i.remove()});
  document.querySelectorAll(on?HAPSEL:keep).forEach(el=>{if(el.tagName==="A"||el.querySelector(":scope>input.hap"))return;
    const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");i.className="hap";i.tabIndex=-1;i.setAttribute("aria-hidden","true");el.appendChild(i)})}
if(IOS){armHaps();new MutationObserver(armHaps).observe(document.body,{childList:true,subtree:true})}
const CK='<svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
/* Welle: eine weiche, matte Scheibe breitet sich vom Finger aus und verblasst in 600 ms. Erst beim Loslassen,
   damit Scrollen über große Karten ruhig bleibt; das sofortige Feedback beim Drücken gibt :active. */
function wave(el,x,y){const r=el.getBoundingClientRect(),sz=2*Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y));
  const w=document.createElement("span"),i=document.createElement("i");w.className="wave";w.setAttribute("aria-hidden","true");
  Object.assign(i.style,{left:x+"px",top:y+"px",width:sz+"px",height:sz+"px"});w.appendChild(i);el.appendChild(w);
  i.animate([{transform:"translate(-50%,-50%) scale(.12)",opacity:1},{transform:"translate(-50%,-50%) scale(1)",opacity:0}],{duration:600,easing:"cubic-bezier(.2,.6,.3,1)",fill:"both"}).onfinish=()=>w.remove()}
/* Füllung: Wird ein Element durch das Tippen ausgewählt, läuft seine Füllung vom Fingerpunkt aus ein (Radius --fr über
   @property animiert). Wird das Element dabei neu gezeichnet, findet tapKey das neue wieder. */
let tapMark=null;
function tapKey(el){const a=[...el.attributes].filter(x=>x.name.startsWith("data-")&&x.name!=="data-lit").map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join("");
  return a?el.tagName.toLowerCase()+"."+el.classList[0]+a:(el.id?"#"+CSS.escape(el.id):null)}
const selNow=el=>el.getAttribute("aria-pressed")==="true"||["on","won","chosen"].some(c=>el.classList.contains(c));
function settleFill(src,x,y){let el=src.isConnected?src:null;if(!el&&tapMark&&tapMark.key){try{el=document.querySelector(tapMark.key)}catch(e){}}
  if(!el||!selNow(el)||calm())return;el.style.setProperty("--px",x+"px");el.style.setProperty("--py",y+"px");el.classList.remove("fillin");void el.offsetWidth;el.classList.add("fillin")}
document.addEventListener("pointerdown",e=>{const el=famHost(e.target);if(!el){tapMark=null;return}const r=el.getBoundingClientRect();
  tapMark={el,key:tapKey(el),x:e.clientX-r.left,y:e.clientY-r.top,t:now()}},{passive:true,capture:true});
/* Der unsichtbare Schalter soll keinen Fokus behalten (sonst gälte er als Eingabefeld). */
document.addEventListener("click",e=>{if(e.target.classList&&e.target.classList.contains("hap"))e.target.blur()},true);
addEventListener("click",()=>{buzzKind=null},true);
addEventListener("click",e=>{const k=buzzKind;buzzKind=null;if(!e.isTrusted)return;const el=famHost(e.target);
  const fam=el?famOf(el):(e.target.closest&&e.target.closest(".gsvg [data-pil]")?"sel":null);vib(k||fam);
  if(!el||!fam)return;const m=tapMark&&tapMark.el===el&&now()-tapMark.t<1500?tapMark:null;let x,y;
  if(m){x=m.x;y=m.y}else{const r=el.getBoundingClientRect();x=e.detail?e.clientX-r.left:r.width/2;y=e.detail?e.clientY-r.top:r.height/2}
  if(fam==="act"&&el.isConnected&&!calm())wave(el,x,y);
  if(fam==="sel")settleFill(el,x,y);tapMark=null});
/* Fehler: eine kleine, einmalige Seitwärtsbewegung */
function shake(el){if(calm()||!el)return;el.animate([{transform:"none"},{transform:"translateX(-4px)",offset:.2},{transform:"translateX(3px)",offset:.45},{transform:"translateX(-1.5px)",offset:.7},{transform:"none"}],{duration:360,easing:"ease-out"})}
/* Logo und Titel: Das kleine Gerüst federt einmal in seiner Spannung nach, unter dem Titel zeichnet sich ein feiner Strich
   vom kühlen zum warmen Ton und verblasst. */
function logoMove(){if(calm())return;const s=$("#home svg");
  if(s)s.animate([{transform:"rotate(0)"},{transform:"rotate(-5deg)",offset:.28},{transform:"rotate(2.5deg)",offset:.62},{transform:"rotate(0)"}],{duration:760,easing:"cubic-bezier(.3,.6,.3,1)"});
  const m=$("#home2");if(!m)return;m.querySelectorAll(".mline").forEach(x=>x.remove());const l=document.createElement("span");l.className="mline";l.setAttribute("aria-hidden","true");m.appendChild(l);
  l.animate([{transform:"scaleX(0)",opacity:1},{transform:"scaleX(1)",opacity:1,offset:.55},{transform:"scaleX(1)",opacity:0}],{duration:900,easing:"cubic-bezier(.4,.1,.2,1)",fill:"both"}).onfinish=()=>l.remove()}
function fx(){let l=document.getElementById("fx");if(!l){l=document.createElement("div");l.id="fx";document.body.appendChild(l)}return l}
/* weiches, mattes Licht hinter einem Element */
function lightUp(el,strong){if(calm()||!el)return;const r=el.getBoundingClientRect(),sz=Math.max(r.width,r.height,40)*(strong?4.2:2.6);const d=document.createElement("span");d.className="lamp";
  Object.assign(d.style,{left:(r.left+r.width/2-sz/2)+"px",top:(r.top+r.height/2-sz/2)+"px",width:sz+"px",height:sz+"px"});fx().appendChild(d);
  d.animate([{transform:"scale(.4)",opacity:0},{transform:"scale(.9)",opacity:strong?.9:.55,offset:.3},{transform:"scale(1.15)",opacity:0}],{duration:strong?1400:1000,easing:"cubic-bezier(.2,.7,.2,1)",fill:"both"}).onfinish=()=>d.remove()}
/* eine Linie zeichnet sich einmal um das Element und verschwindet */
function trace(el,col){if(calm()||!el)return;const r=el.getBoundingClientRect(),cs=getComputedStyle(el),rad=parseFloat(cs.borderRadius)||0;
  const ns="http://www.w3.org/2000/svg",s=document.createElementNS(ns,"svg");s.setAttribute("class","trace");Object.assign(s.style,{left:(r.left-3)+"px",top:(r.top-3)+"px",width:(r.width+6)+"px",height:(r.height+6)+"px"});
  const q=document.createElementNS(ns,"rect");q.setAttribute("x",1);q.setAttribute("y",1);q.setAttribute("width",r.width+4);q.setAttribute("height",r.height+4);q.setAttribute("rx",rad+2);q.setAttribute("pathLength",100);q.style.stroke=col||"var(--lit)";s.appendChild(q);fx().appendChild(s);
  q.animate([{strokeDashoffset:100,opacity:1},{strokeDashoffset:0,opacity:1,offset:.6},{strokeDashoffset:0,opacity:0}],{duration:1100,easing:"cubic-bezier(.4,.1,.2,1)",fill:"both"}).onfinish=()=>s.remove()}

/* ---------- Erinnerungen über den eigenen Kalender ---------- */
const pad=n=>String(n).padStart(2,"0");
const icsDate=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const esc2=s=>s.replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
function remindPlan(id,mode){const e=U[id],v=S.ueb[id],start=new Date(),endDay=new Date(v.start+e.d*DAY);
  let first=new Date(),count=1,hour=8;
  if(mode==="morgen"){first.setDate(first.getDate()+1);hour=8}
  if(mode==="taeglich"){hour=19;if(first.getHours()>=19)first.setDate(first.getDate()+1);count=Math.max(1,Math.ceil((endDay-first)/DAY))}
  if(mode==="ende"){first=new Date(endDay.getTime()-DAY);hour=18;if(first<start)first=new Date()}
  first.setHours(hour,0,0,0);const end=new Date(first.getTime()+15*60000);
  return {e,first,end,count,text:`Wertegerüst: ${e.t}`,details:`${e.x}\n\n${e.s.map(s=>"• "+s).join("\n")}\n\n${APP_URL}#ueben`}}
function icsFor(p){return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Wertegeruest//DE","CALSCALE:GREGORIAN","BEGIN:VEVENT",`UID:${p.e.id}-${Date.now()}@wertegeruest`,`DTSTAMP:${icsDate(new Date())}`,`DTSTART:${icsDate(p.first)}`,`DTEND:${icsDate(p.end)}`,p.count>1?`RRULE:FREQ=DAILY;COUNT=${p.count}`:"",`SUMMARY:${esc2(p.text)}`,`DESCRIPTION:${esc2(p.details)}`,`URL:${APP_URL}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc2(p.text)}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n")}
function googleFor(p){const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;let u=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(p.text)}&dates=${icsDate(p.first)}/${icsDate(p.end)}&ctz=${encodeURIComponent(tz)}&details=${encodeURIComponent(p.details)}`;if(p.count>1)u+=`&recur=${encodeURIComponent("RRULE:FREQ=DAILY;COUNT="+p.count)}`;return u}
let remindMode="taeglich";

const lvSnap=()=>Object.fromEntries(S.kern.map(id=>[id,level(id)]));

/* save(true) zeigt die Meldung „Neues Bauteil“ nicht selbst, sondern gibt ihren Text zurück (für eine Meldung mit Rückgängig).
   save("restore") nach dem Abwählen: Bauteile, die dadurch zurückkehren, gab es schon; sie gelten nicht als neu.
   Bauteile, die es nicht mehr gibt (abgewählt, zurückgenommen), verschwinden aus S.fresh. */
const nbText=key=>{const [id,k]=key.split(":");return `<b>Neues Bauteil</b> · ${W[id].n} steht jetzt auf Stufe ${+k+1}`};
const partExists=key=>{const [id,k]=key.split(":");return S.kern.includes(id)&&+k<level(id)};
function save(silent){const cur=lvSnap(),old=S.lv||{},inc=[];Object.entries(cur).forEach(([id,l])=>{for(let k=(old[id]||0);k<l;k++)inc.push(id+":"+k)});
  S.lv=cur;S.fresh=S.fresh.filter(partExists);let msg="";
  if(inc.length&&silent!=="restore"){S.fresh=[...S.fresh.filter(x=>!inc.includes(x)),...inc];const last=inc[inc.length-1];if(tab!=="geruest")msg=nbText(last);
    setTimeout(()=>{if(!silent&&tab!=="geruest"&&partExists(last))toast(nbText(last));renderTabs()},500)}
  persist();return silent?msg:undefined}
if(!S.lv){S.lv=lvSnap();persist()}

    const msg=nt?"Bekräftigt. Deine Notiz steht im Bautagebuch.":"Bekräftigt. Die App fragt später wieder nach.";
